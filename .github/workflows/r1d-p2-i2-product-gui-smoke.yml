name: R1d P2 I2 Product Qt GUI Smoke (nonrelease)

on:
  push:
    branches:
      - staging/r1d-p2-i2-preview-focused-ci-20261112
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qt-product-app:
    name: Windows Qt Product App Compile + Startup
    runs-on: windows-2022
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6.8.3 including Multimedia
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0" "py7zr==1.1.0"
          if ($LASTEXITCODE -ne 0) { throw "QT_TOOL_INSTALL_FAILED" }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -m qtmultimedia
          if ($LASTEXITCODE -ne 0) { throw "QT_WINDOWS_INSTALL_FAILED" }
      - name: Configure actual Product Qt application, CI provenance only
        shell: pwsh
        run: |
          $qt = Join-Path $env:GITHUB_WORKSPACE "6.8.3/msvc2022_64"
          cmake -S . -B build-p2-product -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_CONFIGURATION_TYPES=Release `
            -DRGSML_BUILD_TESTS=OFF `
            -DRGSML_WARNINGS_AS_ERRORS=ON `
            -DRGSML_PROVENANCE_TYPE=CI `
            -DRGSML_PROVENANCE_RUN_NUMBER=${{ github.run_number }} `
            -DRGSML_PROVENANCE_GIT_SHA=${{ github.sha }} `
            -DRGSML_QT_ROOT="$qt"
          if ($LASTEXITCODE -ne 0) { throw "P2_FULL_PRODUCT_QT_CONFIG_FAILED" }
      - name: Build Product rgsml_app and real QML module
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "p2-product-app-build.txt"
          & cmake --build build-p2-product --config Release --parallel 4 --target rgsml_app *> $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "P2_PRODUCT_QT_BUILD_FAIL=$code"
            $hits = @(Select-String -Path $log -Pattern 'error C[0-9]+', 'error LNK[0-9]+', 'FAILED:', 'fatal error', 'Error:', 'QML Error' | Select-Object -First 14)
            foreach ($hit in $hits) {
              Write-Host $hit.Line.Substring(0,[Math]::Min(280,$hit.Line.Length))
            }
            if ($hits.Count -eq 0) { Get-Content $log -Tail 18 | Select-Object -First 18 }
            throw "P2_PRODUCT_QT_BUILD_FAILED"
          }
          Write-Host "P2_REAL_PRODUCT_APP_COMPILE=PASS"
      - name: Verify P2 seamless 44.1-kHz source target switching
        shell: pwsh
        run: |
          # Keep the release-like Product config unchanged: compile only
          # the existing targeted audition selector suite separately.
          $qt = Join-Path $env:GITHUB_WORKSPACE "6.8.3/msvc2022_64"
          cmake -S . -B build-p2-audition-tests -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_CONFIGURATION_TYPES=Release `
            -DRGSML_BUILD_TESTS=ON `
            -DRGSML_WARNINGS_AS_ERRORS=ON `
            -DRGSML_PROVENANCE_TYPE=CI `
            -DRGSML_PROVENANCE_RUN_NUMBER=${{ github.run_number }} `
            -DRGSML_PROVENANCE_GIT_SHA=${{ github.sha }} `
            -DRGSML_QT_ROOT="$qt"
          if ($LASTEXITCODE -ne 0) { throw "P2_AB_TEST_CONFIG_FAIL" }
          cmake --build build-p2-audition-tests --config Release --parallel 4 --target rgsml_audition_source_selector_tests rgsml_playback_support_tests
          if ($LASTEXITCODE -ne 0) { throw "P2_AB_TEST_COMPILE_FAIL" }
          $env:PATH="$qt/bin;$env:PATH"
          ctest --test-dir build-p2-audition-tests -C Release --output-on-failure -R '^(rgsml_audition_source_selector_tests|rgsml_playback_support_tests)$'
          if ($LASTEXITCODE -ne 0) { throw "P2_AB_TEST_FAIL" }
          Write-Host "P2_44K1_AB_NO_STOP_NO_CLEAR_UNIT=PASS"
          Write-Host "P2_44K1_TO_48K_SRC_HANDOFF_NEGATIVE_ORACLE=PASS"

      - name: Run genuine application Qt Main startup smoke
        shell: pwsh
        run: |
          $qt = Join-Path $env:GITHUB_WORKSPACE "6.8.3/msvc2022_64"
          $env:PATH="$qt/bin;$env:PATH"
          $env:QML2_IMPORT_PATH="$qt/qml"
          $env:QT_PLUGIN_PATH="$qt/plugins"
          $exe=Join-Path $env:GITHUB_WORKSPACE "build-p2-product/Release/RGSMasterLab.exe"
          if (-not (Test-Path $exe)) { throw "PRODUCT_EXE_MISSING" }
          $process=Start-Process -FilePath $exe -ArgumentList "--rgsml-deploy-smoke" -PassThru -Wait
          Write-Host "P2_APP_STARTUP_EXIT=$($process.ExitCode)"
          if ($process.ExitCode -ne 0) { throw "P2_APP_QML_STARTUP_FAILED" }
          Write-Host "P2_QT_PRODUCT_MAIN_STARTUP=PASS"
      - name: Open real P2 QML editor at minimum 1184x688 (strict opt-in)
        shell: pwsh
        run: |
          $qt = Join-Path $env:GITHUB_WORKSPACE "6.8.3/msvc2022_64"
          $env:PATH="$qt/bin;$env:PATH"
          $env:QML2_IMPORT_PATH="$qt/qml"
          $env:QT_PLUGIN_PATH="$qt/plugins"
          $exe=Join-Path $env:GITHUB_WORKSPACE "build-p2-product/Release/RGSMasterLab.exe"
          if (-not (Test-Path $exe)) { throw "P2_PRODUCT_EXE_MISSING" }
          # GUI-subsystem executables can return control before termination
          # when invoked directly in pwsh; $LASTEXITCODE is then unset.
          # Wait for the actual Qt process and read its authoritative exit code.
          $arguments="--rgsml-deploy-smoke --rgsml-p2-i2-preview --rgsml-p2-i2-gui-smoke"
          $env:RGSML_P2_I2_SCREENSHOT_PATH=Join-Path $env:GITHUB_WORKSPACE 'build-p2-product/p2-i2-complete-dsp-chain.png'
          $stdOut=Join-Path $env:RUNNER_TEMP "p2-i2-gui-stdout.txt"
          $stdErr=Join-Path $env:RUNNER_TEMP "p2-i2-gui-stderr.txt"
          $process=Start-Process -FilePath $exe -ArgumentList $arguments `
            -RedirectStandardOutput $stdOut -RedirectStandardError $stdErr -PassThru -Wait
          $code=$process.ExitCode
          if (Test-Path $stdOut) { Get-Content $stdOut -Tail 40 }
          if (Test-Path $stdErr) { Get-Content $stdErr -Tail 75 }
          Write-Host "P2_I2_REAL_GUI_SMOKE_EXIT=$code"
          if ($code -ne 0) { throw "P2_I2_GUI_1184x688_FAILED" }
          Write-Host "P2_I2_REAL_GUI_OPTIN_1184x688=PASS"
          if (-not (Test-Path -LiteralPath $env:RGSML_P2_I2_SCREENSHOT_PATH)) {
            throw "P2_I2_REAL_GUI_SCREENSHOT_MISSING"
          }
          if ((Get-Item -LiteralPath $env:RGSML_P2_I2_SCREENSHOT_PATH).Length -lt 10240) {
            throw "P2_I2_REAL_GUI_SCREENSHOT_EMPTY"
          }
          Write-Host "P2_I2_REAL_GUI_SCREENSHOT_SAVED=PASS"
          # Three real analysis editors are captured in addition to the
          # P2 top/bottom/full-chain triplet: no duplicate inner titles.
          foreach ($milestone in @(19,20,21)) {
            $shot=Join-Path $env:GITHUB_WORKSPACE "build-p2-product/p2-i2-complete-dsp-chain-M$milestone.png"
            if (-not (Test-Path -LiteralPath $shot)) { throw "P2_I2_ANALYSIS_SCREENSHOT_MISSING_M$milestone" }
            if ((Get-Item -LiteralPath $shot).Length -lt 10240) { throw "P2_I2_ANALYSIS_SCREENSHOT_EMPTY_M$milestone" }
          }
          Write-Host "P2_I2_REAL_QT_COMPACT_ANALYSIS_SCREENSHOTS=PASS"

      - name: Publish real Qt full DSP chain screenshot
        uses: actions/upload-artifact@v4
        with:
          name: RGS-P2-I2-REAL-QT-FULL-CHAIN-${{ github.run_number }}
          path: build-p2-product/p2-i2-complete-dsp-chain*.png
          if-no-files-found: error
          retention-days: 14

      # Physical playback is a separate PO-run gate. CI publishes an
      # isolated nonrelease bundle only after the actual Product smoke passes.
      - name: Install standalone Windows research bundle with all frozen FIRs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage=Join-Path $env:GITHUB_WORKSPACE 'build-p2-product/stage/Research-I2'
          cmake --install build-p2-product --config Release --prefix "$stage"
          if ($LASTEXITCODE -ne 0) { throw "P2_I2_STANDALONE_INSTALL_FAILED" }
          $exe=Join-Path $stage 'bin/RGSMasterLab.exe'
          $plugin=Join-Path $stage 'plugins/platforms/qwindows.dll'
          $manifest=Join-Path $stage 'share/RGSMasterLab/ToolchainManifest.json'
          foreach ($required in @($exe,$plugin,$manifest)) {
            if (-not (Test-Path -LiteralPath $required)) {
              throw "P2_I2_DEPLOY_REQUIRED_FILE_MISSING: $required"
            }
          }
          $fir=Join-Path $stage 'bin/resources/fir'
          python tools/qualification/playback_src/verify_installed_16_firs.py --fir-root "$fir"
          if ($LASTEXITCODE -ne 0) { throw "P2_I2_DEPLOY_FIR_PIN_FAILURE" }
          Write-Host "P2_I2_STANDALONE_16_FIR_INSTALL=PASS"
          # Explicit research-bundle opt-in lives next to the deployed EXE.
          # Direct double-click now enables P2; ordinary Product binaries do
          # not contain this marker and remain P2-free.
          $marker=Join-Path $stage 'bin/P2_I2_RESEARCH_ONLY.enabled'
          Set-Content -LiteralPath $marker -Value 'RGSML_R1D_P2_I2_STANDALONE_RESEARCH_ONLY' -Encoding ascii -NoNewline
          if ((Get-Content -LiteralPath $marker -Raw) -ne 'RGSML_R1D_P2_I2_STANDALONE_RESEARCH_ONLY') {
            throw "P2_I2_RESEARCH_OPTIN_MARKER_INVALID"
          }
          Write-Host "P2_I2_DIRECT_EXE_RESEARCH_OPT_IN=INSTALLED"

      - name: Cold-smoke deployed Product without developer Qt PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage=Join-Path $env:GITHUB_WORKSPACE 'build-p2-product/stage/Research-I2'
          $exe=Join-Path $stage 'bin/RGSMasterLab.exe'
          $out=Join-Path $env:RUNNER_TEMP 'p2-i2-stage-out.log'
          $err=Join-Path $env:RUNNER_TEMP 'p2-i2-stage-err.log'
          # The standalone stage must resolve its own Qt, plugins and FIRs.
          $env:QML2_IMPORT_PATH=''
          $env:QT_PLUGIN_PATH=''
          # Deliberately OMIT --rgsml-p2-i2-preview. This verifies that
          # the shipped research ZIP enables the real fifth P2 module simply
          # by starting its EXE, exactly as a Windows user would do.
          $p=Start-Process -FilePath $exe -ArgumentList '--rgsml-deploy-smoke --rgsml-p2-i2-gui-smoke' -PassThru -Wait -RedirectStandardOutput $out -RedirectStandardError $err
          if (Test-Path $out) { Get-Content $out -Tail 40 }
          if (Test-Path $err) { Get-Content $err -Tail 60 }
          if ($p.ExitCode -ne 0) { throw "P2_I2_COLD_DEPLOY_DIRECT_EXE_P2_MISSING: $($p.ExitCode)" }
          if (-not (Select-String -LiteralPath $err -Pattern 'P2_I2_RESEARCH_SRC_HANDOFF_RECOVERY_ENABLE=PASS' -Quiet)) {
            throw "P2_I2_SRC_HANDOFF_RESEARCH_NOT_ENABLED"
          }
          Write-Host 'P2_I2_COLD_DEPLOY_DIRECT_EXE_P2_WITHOUT_FLAG=PASS'
          Write-Host 'P2_I2_COLD_DEPLOY_GUI_M19_M20_M21=PASS'
          # The read-only M16 research tracer must initialize on an ordinary
          # research-only EXE launch, not require a developer CLI switch.
          $diagnostic=Join-Path $stage 'bin/P2_I2_M16_DIAGNOSTIC.tsv'
          if (-not (Test-Path -LiteralPath $diagnostic)) {
            throw 'P2_I2_M16_DIAGNOSTIC_NOT_CREATED'
          }
          $rows=@(Get-Content -LiteralPath $diagnostic)
          if ($rows.Count -lt 2 -or $rows[0] -notmatch 'binding_result') {
            throw 'P2_I2_M16_DIAGNOSTIC_INVALID_SCHEMA'
          }
          Write-Host 'P2_I2_M16_READ_ONLY_DIAGNOSTIC=PASS'
          # Let each physical trial start with a fresh log.
          Remove-Item -LiteralPath $diagnostic -Force

      - name: Build isolated P2 five-minute AutoMatch performance probe
        shell: pwsh
        run: |
          # Genuine RGS IModule; does not affect the installed Product EXE.
          $qt=Join-Path $env:GITHUB_WORKSPACE '6.8.3/msvc2022_64'
          cmake -S research/r1d-p2-live -B build-p2-perf -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$qt"
          if ($LASTEXITCODE -ne 0) { throw "P2_PERF_CONFIG_FAILED" }
          cmake --build build-p2-perf --config Release --parallel 4 --target r1d_p2_automatch_perf_probe r1d_p2_chain_perf_probe r1d_p2_callback_path_perf_probe r1d_p2_adversarial_perf_probe
          if ($LASTEXITCODE -ne 0) { throw "P2_PERF_COMPILE_FAILED" }
          $binary=Join-Path $env:GITHUB_WORKSPACE 'build-p2-perf/Release/r1d_p2_automatch_perf_probe.exe'
          if (-not (Test-Path -LiteralPath $binary)) { throw "P2_PERF_BINARY_MISSING" }
          $stage=Join-Path $env:GITHUB_WORKSPACE 'build-p2-product/stage/Research-I2'
          $dest=Join-Path $stage 'bin/r1d_p2_automatch_perf_probe.exe'
          Copy-Item -LiteralPath $binary -Destination $dest -Force
          # Fast, real 2-second C++ process/finalize/PCM smoke, not a timing SLA.
          $tsv=Join-Path $env:RUNNER_TEMP 'p2-perf-quick.tsv'
          & $dest --quick --output $tsv
          if ($LASTEXITCODE -ne 0) { throw "P2_PERF_QUICK_SMOKE_FAILED" }
          $rows=@(Import-Csv -Path $tsv -Delimiter "`t")
          if ($rows.Count -ne 4) { throw "P2_PERF_QUICK_ROWS_INVALID" }
          foreach ($row in $rows) {
            if ($row.schema -ne 'I2-PERF-1' -or
                [double]$row.process_ms -le 0 -or
                [double]$row.total_ms -le 0 -or
                [double]$row.total_ms -lt [double]$row.process_ms) {
              throw "P2_PERF_QUICK_SCHEMA_OR_TIMING_INVALID"
            }
          }
          Write-Host "P2_ISOLATED_PERF_QUICK_SMOKE=PASS"
          Write-Host "P2_ISOLATED_PERF_WINDOWS_EXE_PACKAGED=PASS"
          # Separate full Product RenderPreview benchmark, no L3 feature solver.
          $chainExe=Join-Path $env:GITHUB_WORKSPACE 'build-p2-perf/Release/r1d_p2_chain_perf_probe.exe'
          if (-not (Test-Path -LiteralPath $chainExe)) {
            throw "P2_CHAIN_PERF_BINARY_MISSING"
          }
          $chainDest=Join-Path $stage 'bin/r1d_p2_chain_perf_probe.exe'
          Copy-Item -LiteralPath $chainExe -Destination $chainDest -Force
          $chainTsv=Join-Path $env:RUNNER_TEMP 'p2-chain-perf-quick.tsv'
          & $chainDest --quick --output $chainTsv
          if ($LASTEXITCODE -ne 0) { throw "P2_CHAIN_PERF_QUICK_FAILED" }
          $chainRows=@(Import-Csv -Path $chainTsv -Delimiter "`t")
          if ($chainRows.Count -ne 14) { throw "P2_CHAIN_PERF_QUICK_ROWS_INVALID" }
          foreach ($row in $chainRows) {
            if ($row.schema -ne 'I2-CHAIN-PERF-1' -or
                [double]$row.full_render_ms -le 0) {
              throw "P2_CHAIN_PERF_QUICK_SCHEMA_OR_TIMING_INVALID"
            }
          }
          Write-Host "P2_CHAIN_PERF_QUICK_SMOKE=PASS"
          Write-Host "P2_CHAIN_PERF_WINDOWS_EXE_PACKAGED=PASS"
          $evalTsv=Join-Path $env:RUNNER_TEMP 'p2-chain-perf-eval-quick.tsv'
          & $chainDest --quick --eval-count 3 --rate 48000 --output $evalTsv
          if ($LASTEXITCODE -ne 0) { throw "P2_CHAIN_EVAL_MODE_QUICK_FAILED" }
          $evalRows=@(Import-Csv -Path $evalTsv -Delimiter "`t")
          if ($evalRows.Count -ne 3) { throw "P2_CHAIN_EVAL_MODE_ROWS_INVALID" }
          Write-Host "P2_CHAIN_REPEATED_CANDIDATE_QUICK_SMOKE=PASS"
          # Research-only path distribution observer: counters compiled out
          # of the ordinary P2 module/GUI. This EXE measures its own overhead.
          $pathExe=Join-Path $env:GITHUB_WORKSPACE 'build-p2-perf/Release/r1d_p2_callback_path_perf_probe.exe'
          if (-not (Test-Path -LiteralPath $pathExe)) { throw "P2_PATH_PERF_BINARY_MISSING" }
          $pathDest=Join-Path $stage 'bin/r1d_p2_callback_path_perf_probe.exe'
          Copy-Item -LiteralPath $pathExe -Destination $pathDest -Force
          $pathTsv=Join-Path $env:RUNNER_TEMP 'p2-path-perf-quick.tsv'
          & $pathDest --quick --output $pathTsv
          if ($LASTEXITCODE -ne 0) { throw "P2_PATH_PERF_QUICK_FAILED" }
          $pathRows=@(Import-Csv -Path $pathTsv -Delimiter "`t")
          if ($pathRows.Count -ne 36) { throw "P2_PATH_PERF_QUICK_ROWS_INVALID" }
          if (@($pathRows | Where-Object { $_.schema -ne 'I2-PATH-PERF-1' }).Count -gt 0) {
            throw "P2_PATH_PERF_QUICK_SCHEMA_INVALID"
          }
          Write-Host "P2_PATH_PERF_QUICK_SMOKE=PASS"
          Write-Host "P2_PATH_PERF_WINDOWS_EXE_PACKAGED=PASS"
          # Fail-closed feasibility test: does a naively trimmed 4-DSP
          # PCM intermediate exactly reproduce five-DSP fresh rendering?
          $cacheTsv=Join-Path $env:RUNNER_TEMP 'p2-cache-proof-quick.tsv'
          & $chainDest --quick --cache-proof --rate 48000 --output $cacheTsv
          if ($LASTEXITCODE -ne 0) { throw "P2_CACHE_PROOF_QUICK_FAILED" }
          $cacheRows=@(Import-Csv -Path $cacheTsv -Delimiter "`t")
          if ($cacheRows.Count -ne 1 -or
              $cacheRows[0].schema -ne 'I2-CACHE-BOUNDARY-1' -or
              $cacheRows[0].result -notin @('EXACT_ACCEPT','NON_EQUIVALENT_REJECT')) {
            throw "P2_CACHE_PROOF_QUICK_SCHEMA_INVALID"
          }
          Write-Host "P2_CACHE_PROOF_QUICK_SMOKE=PASS"
          $cacheMatrix=Join-Path $env:RUNNER_TEMP 'p2-cache-matrix-quick.tsv'
          & $chainDest --quick --cache-matrix --output $cacheMatrix
          if ($LASTEXITCODE -ne 0) { throw "P2_CACHE_MATRIX_QUICK_FAILED" }
          $matrixRows=@(Import-Csv -Path $cacheMatrix -Delimiter ([char]9))
          if ($matrixRows.Count -ne 14 -or
              @($matrixRows | Where-Object { $_.schema -ne 'I2-CACHE-MATRIX-1' -or $_.expected -ne $_.observed }).Count -gt 0) {
            throw "P2_CACHE_MATRIX_QUICK_INVARIANT_FAILED"
          }
          Write-Host "P2_CACHE_MATRIX_QUICK_SMOKE=PASS"
          $engineQuick=Join-Path $env:RUNNER_TEMP 'p2-bounded-cache-engine-quick.tsv'
          & $chainDest --quick --cache-engine --output $engineQuick
          if ($LASTEXITCODE -ne 0) { throw "BOUNDED_CACHE_ENGINE_QUICK_FAILED" }
          $engineRows=@(Import-Csv -Path $engineQuick -Delimiter ([char]9))
          if ($engineRows.Count -ne 22 -or @($engineRows | Where-Object {
            $_.schema -ne 'I2-REAL-CACHE-1' -or
            $_.expected_hit -ne $_.observed_hit -or
            [int]$_.mismatches -ne 0
          }).Count -gt 0) { throw "BOUNDED_CACHE_ENGINE_QUICK_SCHEMA_INVALID" }
          Write-Host "P2_BOUNDED_CACHE_ENGINE_QUICK_SMOKE=PASS"
          # Instrumentation exists only in a separate research test binary.
          $adversarialExe=Join-Path $env:GITHUB_WORKSPACE 'build-p2-perf/Release/r1d_p2_adversarial_perf_probe.exe'
          if (-not (Test-Path -LiteralPath $adversarialExe)) {
            throw "P2_ADVERSARIAL_BINARY_MISSING"
          }
          $adversarialDest=Join-Path $stage 'bin/r1d_p2_adversarial_perf_probe.exe'
          Copy-Item -LiteralPath $adversarialExe -Destination $adversarialDest -Force
          $adversarialTsv=Join-Path $env:RUNNER_TEMP 'p2-adversarial-quick.tsv'
          & $adversarialDest --quick --output $adversarialTsv
          if ($LASTEXITCODE -ne 0) { throw "P2_ADVERSARIAL_QUICK_FAILED" }
          $adversarialRows=@(Import-Csv -Path $adversarialTsv -Delimiter "`t")
          if ($adversarialRows.Count -ne 90 -or
              @($adversarialRows | Where-Object { $_.schema -ne 'I2-ADVERSARIAL-1' -or !$_.status }).Count -ne 0) {
            throw "P2_ADVERSARIAL_QUICK_SCHEMA_INVALID"
          }
          Write-Host "P2_ADVERSARIAL_WINDOWS_EXE_PACKAGED=PASS"

      - name: Add research-only physical test instructions
        shell: pwsh
        run: |
          $stage=Join-Path $env:GITHUB_WORKSPACE 'build-p2-product/stage/Research-I2'
          $instructions=@'
          RGS MasterLab - P2 I2 - Windows x64 - RESEARCH ONLY
          ==================================================
          This is a CI build for manual physical qualification, NOT a release.
          No product merge, FQ, persistence authorization or AutoMatch.
          M17 remains the separate final True Peak protection limiter.

          HOW TO RUN (bundle #15 onwards)
          Extract the entire GitHub Actions artifact into a new folder.
          Double-click bin/RGSMasterLab.exe: the isolated research bundle
          enables P2 automatically, even without any command-line flag.
          Start_P2_I2_Research.cmd remains a supported alternative.
          P2 appears in the DSP CHAIN after Stereo/M-S (not in View).
          Do not move the EXE away from its research-only marker,
          Qt plugins and FIR resources. Never copy this marker to a release.

          MANUAL TEST CHECKLIST (run only on real Windows 10/11 x64 hardware)
          [ ] Load a suitable source WAV.
          [ ] The manual Streaming TP Limiter P2 panel is selectable after
              Stereo M/S and before the M16 analyzer.
          [ ] M19, M20, M21 remain selectable and visible at 1184x688.
          [ ] Alter Ceiling and Drive; run PREVIEW, and note any error.
          [ ] Alter Bypass; compare resulting processed PCM measurements.
          [ ] Select PROCESSED and LISTEN; test SOURCE/PROCESSED switching.
          [ ] Seek, play/pause and loop; note clicks, glitches or dropouts.
          [ ] Repeat same 44.1 kHz source with device 48 kHz / 16-bit.
          [ ] Repeat with device 44.1 kHz / 16-bit (no SRC).
          [ ] Optional: device 48 kHz / 24-bit (bit-depth isolation).
          [ ] Verify PREPARED <-> PROCESSED A/B while playing.
          [ ] Collect bin/P2_I2_RENDER_TIMINGS.tsv (full-chain time).
              In current staging, inspect cache_hit=0/1 on genuine P2
              parameter changes and report cold vs hot times separately.
              A cache hit is not a physical audio or M16 qualification.
          [ ] To benchmark P2 IN ISOLATION over full five-minute inputs,
              close heavy applications then run Run_P2_AutoMatch_Perf.cmd.
              This runs the real P2 IModule with 300-second synthetic
              stereo test audio at 44.1 and 48 kHz, independent fresh
              candidate epochs (Drive 0, +3, +6, 0 and Bypass).
              It creates bin/P2_AUTOMATCH_5MIN_BENCH.tsv.
              No user WAV is read; this is NOT an AutoMatch implementation,
              P2 real-time WCET, canonical feature analyzer or listening test.
              Upload this TSV together with P2_I2_RENDER_TIMINGS.tsv.
          [ ] To measure the REAL Product RenderPreview full chain,
              run Run_P2_Chain_Perf.cmd in an extracted research ZIP.
              Benchmark stages: Gain; Gain+EQ; +Compressor; +Stereo/M-S;
              +P2 bypass; +P2 active at Drive 0 / +3 / 0 repeat; P2 only
              active/bypass. 300s synthetic stereo at 44.1 and 48 kHz.
              Output: bin/P2_AUTOMATCH_CHAIN_5MIN_BENCH.tsv.
              This is not a canonical L3 feature analyzer, AutoMatch
              solver, or incremental render implementation. Compare real
              complete rendering costs, not purported individual module
              execution times: estimates by subtraction are only marginal.
          [ ] To observe P2 path distributions and callback-block timing,
              run Run_P2_Path_Perf.cmd. This uses a separately
              INSTRUMENTED P2 callback research executable; ordinary Product
              P2 has no extra diagnostic counters.
              Test: 5min synthetic 44.1/48 kHz at quiet, normal, hot Drive6.
              Output: bin/P2_CALLBACK_PATH_5MIN_BENCH.tsv.
              Results are offline Windows benchmarks, NOT callback deadlines,
              device dropouts or complete M16/streaming certification.
          [ ] OPTIONAL stress test for 100 *fresh* five-minute
              full-chain Product renders at 48 kHz: use
              Run_P2_100_Evals.cmd, preferably when the PC is idle.
              Output: bin/P2_AUTOMATCH_100_EVAL_BENCH.tsv.
              This is CPU-throughput-only repeated candidate evaluation,
              NOT the actual L3 solver, reference feature analysis, caching
              or a guaranteed user-facing AutoMatch time.
          [ ] Check exact reuse of POST-TRIM upstream DSP PCM, not yet
              a Product cache: Run_P2_Cache_Proof.cmd generates
              bin/P2_CACHE_BOUNDARY_PROOF.tsv. NON_EQUIVALENT_REJECT
              is a valid FAIL-CLOSED result, not a broken tool.
              EXACT_ACCEPT on this fixture is NOT enough for certification:
              timebase/latency/sidecars/dependency identity must also match.
          [ ] Run_P2_Cache_Matrix.cmd extends exact comparison to
              both 44.1 and 48 kHz, P2 Drive 0/+3/+6, ceiling -3dBTP
              and bypass. Two intentional stale tests change upstream
              Gain and source audio, requiring NON_EQUIVALENT_REJECT.
              Matrix output: bin/P2_CACHE_MATRIX_5MIN.tsv.
              This is a research-only PCM proof, not a Product cache;
              sidecar/latency/epoch/dependency qualification is separate.
          [ ] Run_P2_Bounded_Cache.cmd exercises a REAL bounded immutable
              PCM stage cache (research-only) at 44.1/48 kHz, including
              SHA-256 source PCM identity, typed upstream DSP params,
              Product algorithm/schema versions, revisions, 256MB-ish
              1-entry LRU, correct misses for changed Gain, source PCM
              even without revision change, source/prefix revision and
              eviction. Every candidate is independently re-rendered
              by Product RenderPreview for sample-by-sample bit oracle.
              Report: bin/P2_BOUNDED_CACHE_5MIN.tsv.
              The oracle is intentionally excluded from cached-path
              timings. Full sidecar/epoch/tail provenance is NOT
              qualified. The opt-in L1 candidate has only a narrow\n              sidecar-safe Product prefix cache (M14/M15 bypass), not\n              a certified general-purpose cache.
          [ ] Stress P2 under adversarial but finite input, 30 sec each
              at 44.1 and 48 kHz: Run_P2_Adversarial.cmd creates
              bin/P2_ADVERSARIAL_PATH_BENCH.tsv. The CSV status column
              can report SAFETY_FAILURE or other failures; never hide it.
              No realtime WASAPI callback is exercised by this script.
          [ ] Collect bin/P2_I2_M16_DIAGNOSTIC.tsv with TP Meter
              selected and PROCESSED playing, before and after Stop/Play.
              This is read-only witness logging, NOT M16 certification.
          [ ] Repeat at available source rates and representative workloads.
          [ ] Record Windows, device, driver, sample rate, audio buffer and
              actual callback/dropout evidence if available.
          [ ] DO NOT interpret READY/PREVIEW as certified ACTIVE playback.
          [ ] Save the opt-in five-DSP P2 project as a new .rgsml file;
              reopen in this same RESEARCH-ONLY bundle and verify exact
              Ceiling, Drive, Margin, bypass, stable module identity.
          [ ] Check that ordinary non-P2 builds reject that file without
              changing their currently open session.
          [ ] Note: project persistence passed nonrelease Win/Linux CI;
              it is NOT physical PO qualification or permission to ship.
          These boxes are UNCHECKED; no physical testing has been done by CI.

          BUILD IDENTITY
          Commit: ${{ github.sha }}
          CI: https://github.com/casaferla/RGS-MasterLab/actions/runs/${{ github.run_id }}
          '@
          Set-Content -LiteralPath (Join-Path $stage 'README_P2_I2_RESEARCH_ONLY.txt') -Value $instructions -Encoding utf8
          $launcher=@'
          @echo off
          start "" "%~dp0bin\RGSMasterLab.exe" --rgsml-p2-i2-preview
          '@
          Set-Content -LiteralPath (Join-Path $stage 'Start_P2_I2_Research.cmd') -Value $launcher -Encoding ascii
          $perfLauncher=@'
          @echo off
          cd /d "%~dp0bin"
          echo RGS P2 - five-minute offline benchmark at 44.1 and 48 kHz
          echo This may occupy the CPU; no user audio is accessed.
          r1d_p2_automatch_perf_probe.exe --output P2_AUTOMATCH_5MIN_BENCH.tsv
          if errorlevel 1 (
              echo BENCHMARK FAILED -- see output above
          ) else (
              echo BENCHMARK COMPLETE -- bin\P2_AUTOMATCH_5MIN_BENCH.tsv
          )
          pause
          '@
          Set-Content -LiteralPath (Join-Path $stage 'Run_P2_AutoMatch_Perf.cmd') -Value $perfLauncher -Encoding ascii
          $chainLauncher=@'
          @echo off
          cd /d "%~dp0bin"
          echo RGS P2 - real full-chain RenderPreview benchmark, 300s audio
          echo Synthetic test: Gain, EQ, Compressor, Stereo M/S, P2
          echo No personal audio is read. The benchmark uses CPU and RAM.
          r1d_p2_chain_perf_probe.exe --output P2_AUTOMATCH_CHAIN_5MIN_BENCH.tsv
          if errorlevel 1 (
              echo CHAIN BENCHMARK FAILED -- see output above
          ) else (
              echo CHAIN BENCHMARK COMPLETE -- bin\P2_AUTOMATCH_CHAIN_5MIN_BENCH.tsv
          )
          pause
          '@
          Set-Content -LiteralPath (Join-Path $stage 'Run_P2_Chain_Perf.cmd') -Value $chainLauncher -Encoding ascii
          $evaluationLauncher=@'
          @echo off
          cd /d "%~dp0bin"
          echo RGS P2: 100 fresh full-chain evaluations on 5-minute synthetic PCM
          echo 48 kHz stereo, Gain/EQ/Compressor/Stereo MS/P2, Drive varies.
          echo This may occupy CPU and RAM. Close heavy applications.
          echo This is not an L3 AutoMatch solver. No WAV is read.
          r1d_p2_chain_perf_probe.exe --eval-count 100 --rate 48000 --output P2_AUTOMATCH_100_EVAL_BENCH.tsv
          if errorlevel 1 (
              echo EVALUATION STRESS FAILED -- see output above
          ) else (
              echo EVALUATION STRESS COMPLETE -- bin\P2_AUTOMATCH_100_EVAL_BENCH.tsv
          )
          pause
          '@
          Set-Content -LiteralPath (Join-Path $stage 'Run_P2_100_Evals.cmd') -Value $evaluationLauncher -Encoding ascii
          $pathLauncher=@'
          @echo off
          cd /d "%~dp0bin"
          echo RGS P2 - isolated instrumented callback path diagnostic
          echo Offline: 5-minute synthetic material at 44.1 and 48 kHz.
          echo No personal audio is read; counters are NOT in Product P2.
          r1d_p2_callback_path_perf_probe.exe --output P2_CALLBACK_PATH_5MIN_BENCH.tsv
          if errorlevel 1 (
              echo PATH BENCHMARK FAILED -- see output above
          ) else (
              echo PATH BENCHMARK COMPLETE -- bin\P2_CALLBACK_PATH_5MIN_BENCH.tsv
          )
          pause
          '@
          Set-Content -LiteralPath (Join-Path $stage 'Run_P2_Path_Perf.cmd') -Value $pathLauncher -Encoding ascii
          $cacheLauncher=@'
          @echo off
          cd /d "%~dp0bin"
          echo RGS P2 - exact binary cache-boundary proof, full 300s PCM
          echo Testing whether POST-TRIM Gain/EQ/Comp/MS can be replayed
          echo as P2-only input without changing ANY PCM sample.
          echo A NON_EQUIVALENT_REJECT result is safe and significant.
          r1d_p2_chain_perf_probe.exe --cache-proof --rate 48000 --output P2_CACHE_BOUNDARY_PROOF.tsv
          if errorlevel 1 (
              echo CACHE PROOF FAILED TO EXECUTE -- see console
          ) else (
              echo CACHE PROOF COMPLETE -- bin\P2_CACHE_BOUNDARY_PROOF.tsv
          )
          pause
          '@
          Set-Content -LiteralPath (Join-Path $stage 'Run_P2_Cache_Proof.cmd') -Value $cacheLauncher -Encoding ascii
          $cacheMatrixLauncher=@'
          @echo off
          cd /d "%~dp0bin"
          echo RGS P2 - 5 min PCM cache matrix proof with negative stale tests
          echo Checking Drive 0/3/6, ceiling, bypass at 44.1 and 48k.
          echo MUST reject stale source / Gain reuse; all values must match
          echo expected. No WAV is read and no Product cache is changed.
          r1d_p2_chain_perf_probe.exe --cache-matrix --output P2_CACHE_MATRIX_5MIN.tsv
          if errorlevel 1 (
              echo CACHE MATRIX FAILED -- see status and TSV
          ) else (
              echo CACHE MATRIX COMPLETE -- bin\P2_CACHE_MATRIX_5MIN.tsv
          )
          pause
          '@
          Set-Content -LiteralPath (Join-Path $stage 'Run_P2_Cache_Matrix.cmd') -Value $cacheMatrixLauncher -Encoding ascii
          $boundedCacheLauncher=@'
          @echo off
          cd /d "%~dp0bin"
          echo RGS P2 - isolated bounded stage cache/real Product PCM oracle
          echo Real 5-minute synthetic audio at 44.1 and 48 kHz.
          echo 22 candidates with validated cache HIT/MISS, SHA256 source,
          echo algorithm version, parameters, revision and LRU eviction.
          echo This is a RESEARCH prototype, not the installed Product cache.
          r1d_p2_chain_perf_probe.exe --cache-engine --output P2_BOUNDED_CACHE_5MIN.tsv
          if errorlevel 1 (
              echo BOUNDED CACHE PROOF FAILED -- see console / TSV
          ) else (
              echo BOUNDED CACHE PROOF COMPLETE -- bin\P2_BOUNDED_CACHE_5MIN.tsv
          )
          pause
          '@
          Set-Content -LiteralPath (Join-Path $stage 'Run_P2_Bounded_Cache.cmd') -Value $boundedCacheLauncher -Encoding ascii
          $adversarialLauncher=@'
          @echo off
          cd /d "%~dp0bin"
          echo RGS P2 - adversarial offline proof, two rates, 30s each
          echo The program logs any safety failures in the status column.
          echo This is NOT real device deadline or dropout qualification.
          r1d_p2_adversarial_perf_probe.exe --output P2_ADVERSARIAL_PATH_BENCH.tsv
          if errorlevel 1 (
              echo ADVERSARIAL PROBE FAILED TO EXECUTE -- see console
          ) else (
              echo ADVERSARIAL PROBE COMPLETE -- bin\P2_ADVERSARIAL_PATH_BENCH.tsv
          )
          pause
          '@
          Set-Content -LiteralPath (Join-Path $stage 'Run_P2_Adversarial.cmd') -Value $adversarialLauncher -Encoding ascii

      - name: Include validated real Qt GUI screenshot in physical-test package
        shell: pwsh
        run: |
          $srcDir=Join-Path $env:GITHUB_WORKSPACE 'build-p2-product'
          $dest=Join-Path $env:GITHUB_WORKSPACE 'build-p2-product/stage/Research-I2'
          $captures=@(Get-ChildItem -LiteralPath $srcDir -Filter 'p2-i2-complete-dsp-chain*.png')
          if ($captures.Count -ne 6) { throw "P2_I2_BUNDLE_SCREENSHOT_COUNT_NOT_6" }
          foreach ($capture in $captures) {
            Copy-Item -LiteralPath $capture.FullName -Destination $dest -Force
          }
          Write-Host "P2_I2_REAL_QT_CAPTURE_COUNT=$($captures.Count)"

      - name: Publish nonrelease Windows physical test bundle
        uses: actions/upload-artifact@v4
        with:
          name: RGS-P2-I2-Win64-RESEARCH-ONLY-${{ github.run_number }}
          path: build-p2-product/stage/Research-I2/
          if-no-files-found: error
          retention-days: 14
