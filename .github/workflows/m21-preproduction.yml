# PRIVATE M21-only CI. No production QML/App activation, Gate S/M, FQ or merge.
name: M21 Independent Preproduction CI
on:
  push:
    branches:
      - experimental/m21-metrics-delta-20261103
    paths:
      - 'app/src/internal/m21_*.hpp'
      - 'ui/qml/M21MetricsComparisonPreview.qml'
      - 'tools/qualification/m21/**'
      - 'docs/architecture/M21_PARALLEL_PREPRODUCTION_BRANCH_CONTRACT_20261103.md'
      - '.github/workflows/m21-preproduction.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m21-private-preproduction-only
  cancel-in-progress: false
jobs:
  linux-m21:
    name: M21 private candidate · Linux GCC C++20 Debug + Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authority/production non-activation guard
        run: python3 tools/qualification/m21/test_m21_scope_guard.py
      - name: M21 independent display-only Qt scope/nonactivation check
        run: python3 tools/qualification/m21/test_m21_qml_guard.py
      - name: Nine metrics and independent scope presentation · both GCC modes
        shell: bash
        run: |
          set -euo pipefail
          for opts in "-O0 -g" "-O2"; do
            g++ -std=c++20 $opts -Wall -Wextra -Wpedantic -Werror -fno-fast-math -ffp-contract=off -Iapp/src tools/qualification/m21/m21_presentation_selftest.cpp -o "$RUNNER_TEMP/m21-display"
            "$RUNNER_TEMP/m21-display"
          done
      - name: State, sign, scopes, status, async generations and tonal gate
        shell: bash
        run: |
          set -euo pipefail
          for opts in "-O0 -g" "-O2"; do
            g++ -std=c++20 $opts -Wall -Wextra -Wpedantic -Werror -fno-fast-math -ffp-contract=off -Iapp/src tools/qualification/m21/m21_comparison_selftest.cpp -o "$RUNNER_TEMP/m21-private"
            "$RUNNER_TEMP/m21-private"
          done
          echo M21_PRIVATE_LINUX_PASS_NOT_GATE_S_OR_M
  windows-m21:
    name: M21 private candidate · Windows 2022 MSVC Debug + Release
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Authority/production non-activation guard
        shell: pwsh
        run: python tools/qualification/m21/test_m21_scope_guard.py
      - name: State, sign, scopes, status, async generations and tonal gate
        shell: pwsh
        run: |
          foreach ($mode in @("Debug","Release")) {
            $opt = if ($mode -eq "Debug") { "/Od" } else { "/O2" }
            $log = "$env:RUNNER_TEMP/m21-$mode.log"
            & cl.exe /nologo /std:c++20 /EHsc $opt /W4 /WX /fp:strict /Zc:__cplusplus /Iapp/src tools/qualification/m21/m21_comparison_selftest.cpp "/Fe:$env:RUNNER_TEMP/m21-$mode.exe" *> $log
            if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 55; throw "M21_COMPILE_FAILED_$mode" }
            & "$env:RUNNER_TEMP/m21-$mode.exe"
            if ($LASTEXITCODE -ne 0) { throw "M21_TEST_FAILED_$mode" }
          }
          Write-Output M21_PRIVATE_WINDOWS_PASS_NOT_GATE_S_OR_M

      - name: M21 independent display-only Qt scope/nonactivation check
        shell: pwsh
        run: python tools/qualification/m21/test_m21_qml_guard.py
      - name: Nine metrics and independent scope presentation · both MSVC modes
        shell: pwsh
        run: |
          foreach ($mode in @("Debug","Release")) {
            $opt = if ($mode -eq "Debug") { "/Od" } else { "/O2" }
            $log = "$env:RUNNER_TEMP/m21-presentation-$mode.log"
            & cl.exe /nologo /std:c++20 /EHsc $opt /W4 /WX /fp:strict /Zc:__cplusplus /Iapp/src tools/qualification/m21/m21_presentation_selftest.cpp "/Fe:$env:RUNNER_TEMP/m21-presentation-$mode.exe" *> $log
            if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 55; throw "M21_PRESENTATION_COMPILE_FAILED_$mode" }
            & "$env:RUNNER_TEMP/m21-presentation-$mode.exe"
            if ($LASTEXITCODE -ne 0) { throw "M21_PRESENTATION_TEST_FAILED_$mode" }
          }
  qt-preview-linux:
    name: M21 private Qt6 preview · Linux
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Linux Qt/OpenGL packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev
      - name: Install Qt6.8.3
        run: |
          python3 -m pip install --disable-pip-version-check "aqtinstall==3.3.0" "py7zr==1.1.0"
          python3 -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 -O "$RUNNER_TEMP/m21qt"
      - name: Genuine QtQuick instantiate and state/clear smoke
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          set -euo pipefail
          cmake -S tools/qualification/m21/qt_preview -B "$RUNNER_TEMP/m21-qt-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/m21qt/6.8.3/gcc_64"
          cmake --build "$RUNNER_TEMP/m21-qt-build" --parallel 3
          "$RUNNER_TEMP/m21-qt-build/m21_qt_preview_smoke"
          echo M21_QT_LINUX_PRIVATE_PASS_NOT_GATE_M
  qt-preview-windows:
    name: M21 private Qt6 preview · Windows
    runs-on: windows-2022
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt6.8.3
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0" "py7zr==1.1.0" ninja
          if ($LASTEXITCODE -ne 0) { throw "M21_QT_WIN_PIP" }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O "$env:RUNNER_TEMP/m21qt"
          if ($LASTEXITCODE -ne 0) { throw "M21_QT_WIN_INSTALL" }
      - name: Genuine QtQuick instantiate and state/clear smoke
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          cmake -S tools/qualification/m21/qt_preview -B "$env:RUNNER_TEMP/m21-qt-build" -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:RUNNER_TEMP/m21qt/6.8.3/msvc2022_64"
          if ($LASTEXITCODE -ne 0) { throw "M21_QT_WIN_CONFIGURE" }
          cmake --build "$env:RUNNER_TEMP/m21-qt-build" --config Release --parallel 3
          if ($LASTEXITCODE -ne 0) { throw "M21_QT_WIN_BUILD" }
          & "$env:RUNNER_TEMP/m21-qt-build/m21_qt_preview_smoke.exe"
          if ($LASTEXITCODE -ne 0) { throw "M21_QT_WIN_SMOKE" }
          Write-Output M21_QT_WINDOWS_PRIVATE_PASS_NOT_GATE_M
