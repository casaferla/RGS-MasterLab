name: L3 C01 macro-lot focused gate (nonrelease)
on:
  push:
    branches:
      - staging/l3-m01-c01-focused-20261121
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Qt Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0" "py7zr==1.1.0"
          if ($LASTEXITCODE -ne 0) { throw 'L3_QT_DEP_FAILED' }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -m qtmultimedia
          if ($LASTEXITCODE -ne 0) { throw 'L3_QT_FAILED' }
      - name: Install Qt Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libegl1-mesa-dev libdbus-1-dev
          python3 -m pip install --disable-pip-version-check "aqtinstall==3.3.0" "py7zr==1.1.0"
          python3 -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 -m qtmultimedia
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Compile and test macro suite Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'l3-macro.log'
          cmake -S . -B build-l3 -G 'Visual Studio 17 2022' -A x64 -DRGSML_BUILD_TESTS=ON -DRGSML_WARNINGS_AS_ERRORS=ON "-DRGSML_QT_ROOT=$env:GITHUB_WORKSPACE/6.8.3/msvc2022_64" *> $log
          if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 70; throw 'L3_CONFIGURE_FAILED' }
          cmake --build build-l3 --config Release --parallel 4 --target rgsml_dsp_transient_shaper_c00_tests rgsml_dsp_transient_shaper_imodule_tests rgsml_l3_transient_shaper_product_tests rgsml_l3_m10_frozen_coordinate_refiner_tests rgsml_l3_m07_frozen_registry_tests rgsml_l3_m08_frozen_amount_tests rgsml_l3_m09_exact_candidate_dedup_tests rgsml_l3_m09_frozen_gaussian_grid_tests rgsml_l3_m09_p02_macro_reduction_tests rgsml_l3_m09_p03_stereo_low_seed_tests rgsml_l3_m09_p02_micro_seed_tests rgsml_l3_m09_p02_spectral_seed_tests rgsml_l3_m09_p01_weighted_atom_fit_tests rgsml_l3_m09_abstract_family_tests rgsml_l3_m09_pre_render_proxy_tests rgsml_l3_m10_p04_numeric_domain_tests rgsml_l3_m10_p04_numeric_combined_tests rgsml_l3_m10_authoritative_candidate_cost_tests rgsml_l3_m11_p03_protected_guard_tests rgsml_l3_m10_measured_seed_shortlist_tests rgsml_l3_m10_exact_combined_binding_tests rgsml_l3_m10_refinement_batch_tests rgsml_l3_m10_exact_cache_tests rgsml_l3_m10_cache_evaluator_tests rgsml_l3_m06_native_rms_crest_tests rgsml_l3_m06_d03d04_binding_tests rgsml_l3_m06_lra_native_tests rgsml_l3_m06_d02_lra_binding_tests rgsml_l3_m19_macro_loudness_binding_tests rgsml_l3_m20_native_stereo_binding_tests rgsml_l3_m20_tonal_scalar_binding_tests rgsml_l3_m20_t01_primary_binding_tests rgsml_l3_m07_exact_27_assembler_tests rgsml_l3_m07_native_fragment_collector_tests rgsml_l3_m06_d01_native_binding_tests rgsml_l3_m05m06_real_source_bundle_tests rgsml_l3_m06_native_transient_tests rgsml_l3_m06_transient_binding_tests rgsml_l3_m06_native_spectral_d10_d12_tests rgsml_l3_m06_d10_d12_native_binding_tests rgsml_l3_m06_m20_native_frame_sink_tests rgsml_l3_m06_m20_coherent_psd_tests rgsml_l3_m06_native_stereo_band_tests rgsml_l3_m06_s03_s06_binding_tests rgsml_l3_m06_p04_native_flux_tests rgsml_l3_m06_p04_native_event_tests rgsml_l3_m06_p04_native_descriptors_tests rgsml_l3_m06_p04_native_attack_rise_tests rgsml_l3_m06_p04_real_product_observation_tests rgsml_l3_m06_p04_product_to_m07_tests rgsml_l3_m12_ref_linked_native_stage_tests rgsml_mastering_preview_controller_tests rgsml_l3_m12_project_carrier_tests rgsml_l3_m12_terminal_hard_preflight_tests rgsml_l3_m13_fresh_native_probe_tests rgsml_l3_p2_typed_trial_tests rgsml_l3_m10_p2_real_native_product_tests rgsml_project_roundtrip_tests rgsml_dsp_processing_chain_tests rgsml_dsp_structural_integration_tests rgsml_l3_product_native_stereo_candidate_tests rgsml_l3_m11_native_stereo_safety_tests rgsml_l3_m11_native_stereo_bridge_tests rgsml_l3_m05m06_real_analysis_port_tests rgsml_basic_level_analyzer_tests rgsml_streamed_reference_analyzer_tests rgsml_dsp_dynamic_eq_parameters_tests rgsml_dsp_dynamic_eq_c01_coefficients_tests rgsml_dsp_dynamic_eq_c01_engine_tests rgsml_dsp_dynamic_eq_imodule_tests rgsml_dsp_dynamic_eq_static_equivalence_tests rgsml_dsp_dynamic_eq_perf_measure_tests rgsml_m21_real_product_metrics_port_tests rgsml_l3_dynamic_eq_canonical_render_tests rgsml_module_parameter_codec_tests rgsml_app *> $log
          if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 95; throw 'L3_BUILD_FAILED' }
          # M12 Product Open/Save is a Windows-native integration target;
          # Linux builds its platform-neutral C00/M12 native proofs only.
          cmake --build build-l3 --config Release --parallel 4 --target rgsml_project_session_tests *> $log
          if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 95; throw 'L3_M12_PRODUCT_BUILD_FAILED' }
          $env:PATH="$env:GITHUB_WORKSPACE/6.8.3/msvc2022_64/bin;$env:PATH"
          # Print the specific M12 QtTest failure before running the broad
          # macro suite, whose aggregate log truncates early test output.
          ctest --test-dir build-l3 -C Release --output-on-failure -V -R '^rgsml_l3_m12_project_carrier_tests$'
          if ($LASTEXITCODE -ne 0) { throw 'L3_M12_EXACT_FAILURE' }
          # Exercise real Product ProjectSession source/Gold, SaveAs and
          # PreviewController ownership, not only the native M12 helper.
          ctest --test-dir build-l3 -C Release --output-on-failure -V -R '^rgsml_project_session_tests(parameters|c01_coefficients|c01_engine|imodule|static_equivalence|perf_measure)_tests|rgsml_m21_real_product_metrics_port_tests|rgsml_l3_dynamic_eq_canonical_render_tests|rgsml_module_parameter_codec_tests|rgsml_dsp_transient_shaper_c00_tests|rgsml_dsp_transient_shaper_imodule_tests|rgsml_l3_transient_shaper_product_tests|rgsml_l3_m10_frozen_coordinate_refiner_tests|rgsml_l3_m07_frozen_registry_tests|rgsml_l3_m08_frozen_amount_tests|rgsml_l3_m09_exact_candidate_dedup_tests|rgsml_l3_m09_frozen_gaussian_grid_tests|rgsml_l3_m09_p02_macro_reduction_tests|rgsml_l3_m09_p03_stereo_low_seed_tests|rgsml_l3_m09_p02_micro_seed_tests|rgsml_l3_m09_p02_spectral_seed_tests|rgsml_l3_m09_p01_weighted_atom_fit_tests|rgsml_l3_m09_abstract_family_tests|rgsml_l3_m09_pre_render_proxy_tests|rgsml_l3_m10_p04_numeric_domain_tests|rgsml_l3_m10_p04_numeric_combined_tests|rgsml_l3_m10_authoritative_candidate_cost_tests|rgsml_l3_m11_p03_protected_guard_tests|rgsml_l3_m10_measured_seed_shortlist_tests|rgsml_l3_m10_exact_combined_binding_tests|rgsml_l3_m10_refinement_batch_tests|rgsml_l3_m10_exact_cache_tests|rgsml_l3_m10_cache_evaluator_tests|rgsml_l3_m06_native_rms_crest_tests|rgsml_l3_m06_d03d04_binding_tests|rgsml_l3_m06_lra_native_tests|rgsml_l3_m06_d02_lra_binding_tests|rgsml_l3_m19_macro_loudness_binding_tests|rgsml_l3_m20_native_stereo_binding_tests|rgsml_l3_m20_tonal_scalar_binding_tests|rgsml_l3_m20_t01_primary_binding_tests|rgsml_l3_m07_exact_27_assembler_tests|rgsml_l3_m07_native_fragment_collector_tests|rgsml_l3_m06_d01_native_binding_tests|rgsml_l3_m05m06_real_source_bundle_tests|rgsml_l3_m06_native_transient_tests|rgsml_l3_m06_transient_binding_tests|rgsml_l3_m06_native_spectral_d10_d12_tests|rgsml_l3_m06_d10_d12_native_binding_tests|rgsml_l3_m06_m20_native_frame_sink_tests|rgsml_l3_m06_m20_coherent_psd_tests|rgsml_l3_m06_native_stereo_band_tests|rgsml_l3_m06_s03_s06_binding_tests|rgsml_l3_m06_p04_native_flux_tests|rgsml_l3_m06_p04_native_event_tests|rgsml_l3_m06_p04_native_descriptors_tests|rgsml_l3_m06_p04_native_attack_rise_tests|rgsml_l3_m06_p04_real_product_observation_tests|rgsml_l3_m06_p04_product_to_m07_tests|rgsml_l3_m12_ref_linked_native_stage_tests|rgsml_mastering_preview_controller_tests|rgsml_l3_m12_project_carrier_tests|rgsml_l3_m12_terminal_hard_preflight_tests|rgsml_l3_m13_fresh_native_probe_tests|rgsml_l3_p2_typed_trial_tests|rgsml_l3_m10_p2_real_native_product_tests|rgsml_project_roundtrip_tests|rgsml_dsp_processing_chain_tests|rgsml_dsp_structural_integration_tests|rgsml_l3_product_native_stereo_candidate_tests|rgsml_l3_m11_native_stereo_safety_tests|rgsml_l3_m11_native_stereo_bridge_tests|rgsml_l3_m05m06_real_analysis_port_tests|rgsml_basic_level_analyzer_tests|rgsml_streamed_reference_analyzer_tests)$' *> $log
          if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 220; throw 'L3_TEST_FAILED' }
          Get-Content $log -Tail 24
      - name: Compile and test macro suite Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S . -B build-l3 -G Ninja -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/6.8.3/gcc_64" -DRGSML_BUILD_TESTS=ON -DRGSML_WARNINGS_AS_ERRORS=ON > /tmp/l3-macro.log 2>&1 || { tail -n 70 /tmp/l3-macro.log; exit 1; }
