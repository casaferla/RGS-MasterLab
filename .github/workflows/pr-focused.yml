name: PR Focused CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-portable-dsp:
    name: Linux Portable DSP Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head (B2b qualification provenance)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install system dependencies & Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libegl1-mesa-dev libdbus-1-dev

      - name: Install Qt 6.8.3 via aqtinstall
        run: |
          pip install "aqtinstall==3.3.0" "py7zr==1.1.0"
          python -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 -m qtmultimedia

      - name: Configure CMake (Portable DSP)
        run: |
          cmake -B build-linux -G Ninja \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/6.8.3/gcc_64" \
            -DRGSML_BUILD_TESTS=ON \
            -DRGSML_WARNINGS_AS_ERRORS=ON \
            -DRGSML_PROVENANCE_TYPE=PR \
            -DRGSML_PROVENANCE_PR_NUMBER=${{ github.event.pull_request.number }} \
            -DRGSML_PROVENANCE_RUN_NUMBER=${{ github.run_number }} \
            -DRGSML_PROVENANCE_GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build Focused DSP Targets
        run: |
          cmake --build build-linux --target \
            rgsml_dsp_module_descriptor_tests \
            rgsml_dsp_module_registry_tests \
            rgsml_dsp_processing_chain_tests \
            rgsml_dsp_structural_integration_tests \
            rgsml_gain_tests \
            rgsml_true_peak_itu4x_coefficients_tests \
            rgsml_true_peak_itu4x_channel_stream_tests \
            rgsml_true_peak_full_resource_tests \
            rgsml_true_peak_gate_g_edge_tests \
            rgsml_true_peak_chunk_invariance_tests \
            rgsml_true_peak_b2b_probe \
            rgsml_stereo_ms_parameters_tests \
            rgsml_stereo_ms_module_tests \
            rgsml_stereo_ms_crossover_tests \
            rgsml_stereo_ms_crossover_runtime_tests \
            rgsml_stereo_ms_module_streaming_tests \
            rgsml_stereo_ms_checkpoint_tests \
            rgsml_stereo_ms_independent_math_tests \
            rgsml_stereo_ms_long_resume_tests \
            rgsml_stereo_ms_gate_g_spatial_evidence_tests \
            rgsml_stereo_ms_no_alloc_tests \
            rgsml_stereo_ms_width_tests \
            rgsml_stereo_ms_width_response_tests \
            rgsml_stereo_ms_signature_tests \
            rgsml_stereo_ms_view_model_tests \
            rgsml_stereo_ms_audible_resolver_tests \
            rgsml_gain_golden_tests \
            rgsml_compressor_tests \
            rgsml_compressor_gate_g_tests \
            rgsml_compressor_no_alloc_tests \
            rgsml_module_parameter_codec_tests \
            rgsml_parametric_eq_tests \
            rgsml_parametric_eq_golden_tests \
            rgsml_parametric_eq_response_tests \
            rgsml_eq_view_model_tests \
            rgsml_gain_view_model_tests \
            rgsml_compressor_view_model_tests \
            rgsml_mastering_chain_state_tests \
            rgsml_mastering_preview_controller_tests \
            rgsml_dsp_module_adapter_tests \
            rgsml_render_preview_tests \
            rgsml_playback_engine_portable_tests

      - name: Run Focused DSP Tests
        run: |
          ctest --test-dir build-linux -R "^(rgsml_dsp_|rgsml_gain_|rgsml_true_peak_itu4x_coefficients_tests|rgsml_true_peak_itu4x_channel_stream_tests|rgsml_true_peak_full_resource_tests|rgsml_true_peak_gate_g_edge_tests|rgsml_true_peak_chunk_invariance_tests|rgsml_true_peak_b2b_probe_selftest|rgsml_stereo_ms_parameters_tests|rgsml_stereo_ms_module_tests|rgsml_stereo_ms_crossover_tests|rgsml_stereo_ms_crossover_runtime_tests|rgsml_stereo_ms_module_streaming_tests|rgsml_stereo_ms_checkpoint_tests|rgsml_stereo_ms_independent_math_tests|rgsml_stereo_ms_long_resume_tests|rgsml_stereo_ms_gate_g_spatial_evidence_tests|rgsml_stereo_ms_no_alloc_tests|rgsml_stereo_ms_width_tests|rgsml_stereo_ms_width_response_tests|rgsml_stereo_ms_signature_tests|rgsml_stereo_ms_view_model_tests|rgsml_stereo_ms_audible_resolver_tests|rgsml_compressor_|rgsml_module_parameter_codec_tests|rgsml_parametric_eq_|rgsml_eq_view_model_|rgsml_mastering_chain_state_tests|rgsml_mastering_preview_controller_tests|rgsml_render_preview_tests|rgsml_playback_engine_portable_tests|toolchain_manifest_)" --output-on-failure

  windows-focused-dsp:
    name: Windows Focused DSP
    runs-on: windows-2022
    env:
      RGSML_QT_ROOT: ${{ github.workspace }}/6.8.3/msvc2022_64
    steps:
      - name: Checkout exact PR head (B2b qualification provenance)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Qt 6.8.3 via aqtinstall
        run: |
          pip install "aqtinstall==3.3.0" "py7zr==1.1.0"
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -m qtmultimedia

      - name: Configure CMake (Windows MSVC)
        run: |
          cmake --preset windows-msvc `
            -DRGSML_PROVENANCE_TYPE=PR `
            -DRGSML_PROVENANCE_PR_NUMBER=${{ github.event.pull_request.number }} `
            -DRGSML_PROVENANCE_RUN_NUMBER=${{ github.run_number }} `
            -DRGSML_PROVENANCE_GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build Focused DSP Targets (Release)
        run: |
          cmake --build build/windows-msvc --config Release --target `
            rgsml_dsp_module_descriptor_tests `
            rgsml_dsp_module_registry_tests `
            rgsml_dsp_processing_chain_tests `
            rgsml_dsp_structural_integration_tests `
            rgsml_gain_tests `
            rgsml_true_peak_itu4x_coefficients_tests `
            rgsml_true_peak_itu4x_channel_stream_tests `
            rgsml_true_peak_full_resource_tests `
            rgsml_true_peak_gate_g_edge_tests `
            rgsml_true_peak_chunk_invariance_tests `
            rgsml_true_peak_b2b_probe `
            rgsml_stereo_ms_parameters_tests `
            rgsml_stereo_ms_module_tests `
            rgsml_stereo_ms_crossover_tests `
            rgsml_stereo_ms_crossover_runtime_tests `
            rgsml_stereo_ms_module_streaming_tests `
            rgsml_stereo_ms_checkpoint_tests `
            rgsml_stereo_ms_independent_math_tests `
            rgsml_stereo_ms_long_resume_tests `
            rgsml_stereo_ms_gate_g_spatial_evidence_tests `
            rgsml_stereo_ms_no_alloc_tests `
            rgsml_stereo_ms_width_tests `
            rgsml_stereo_ms_width_response_tests `
            rgsml_stereo_ms_signature_tests `
            rgsml_stereo_ms_view_model_tests `
            rgsml_stereo_ms_audible_resolver_tests `
            rgsml_gain_golden_tests `
            rgsml_compressor_tests `
            rgsml_compressor_gate_g_tests `
            rgsml_compressor_no_alloc_tests `
            rgsml_compressor_listening_gate `
            rgsml_module_parameter_codec_tests `
            rgsml_parametric_eq_tests `
            rgsml_parametric_eq_golden_tests `
            rgsml_parametric_eq_response_tests `
            rgsml_eq_view_model_tests `
            rgsml_gain_view_model_tests `
            rgsml_compressor_view_model_tests `
            rgsml_mastering_chain_state_tests `
            rgsml_mastering_preview_controller_tests `
            rgsml_dsp_module_adapter_tests `
            rgsml_render_preview_tests `
            rgsml_audition_source_selector_tests `
            rgsml_playback_support_tests `
            rgsml_source_metadata_panel_smoke `
            rgsml_project_session_tests `
            rgsml_app

      - name: Run Windows UI Smoke Diagnostic
        env:
          RGSML_GUI01_EVIDENCE_DIR: ${{ github.workspace }}\build\visual-evidence
        run: |
          $env:PATH = "$env:RGSML_QT_ROOT\bin;$env:PATH"
          $env:QML2_IMPORT_PATH = "$env:RGSML_QT_ROOT\qml"
          $log = "$env:GITHUB_WORKSPACE\m12b-smoke.txt"
          & build/windows-msvc/Release/rgsml_source_metadata_panel_smoke.exe -v2 -o "$log,txt"
          $exitCode = $LASTEXITCODE
          if (Test-Path $log) {
              Get-Content $log
          } else {
              Write-Host "M12B_SMOKE_LOG_NOT_CREATED"
          }
          if ($exitCode -ne 0) {
              exit $exitCode
          }

      - name: Run Focused DSP Tests (Release)
        env:
          RGSML_GUI01_EVIDENCE_DIR: ${{ github.workspace }}\build\visual-evidence
        run: |
          ctest --test-dir build/windows-msvc -C Release -R "^(rgsml_dsp_|rgsml_gain_|rgsml_true_peak_itu4x_coefficients_tests|rgsml_true_peak_itu4x_channel_stream_tests|rgsml_true_peak_full_resource_tests|rgsml_true_peak_gate_g_edge_tests|rgsml_true_peak_chunk_invariance_tests|rgsml_true_peak_b2b_probe_selftest|rgsml_stereo_ms_parameters_tests|rgsml_stereo_ms_module_tests|rgsml_stereo_ms_crossover_tests|rgsml_stereo_ms_crossover_runtime_tests|rgsml_stereo_ms_module_streaming_tests|rgsml_stereo_ms_checkpoint_tests|rgsml_stereo_ms_independent_math_tests|rgsml_stereo_ms_long_resume_tests|rgsml_stereo_ms_gate_g_spatial_evidence_tests|rgsml_stereo_ms_no_alloc_tests|rgsml_stereo_ms_width_tests|rgsml_stereo_ms_width_response_tests|rgsml_stereo_ms_signature_tests|rgsml_stereo_ms_view_model_tests|rgsml_stereo_ms_audible_resolver_tests|rgsml_compressor_|rgsml_module_parameter_codec_tests|rgsml_parametric_eq_|rgsml_eq_view_model_|rgsml_mastering_chain_state_tests|rgsml_mastering_preview_controller_tests|rgsml_render_preview_tests|rgsml_audition_source_selector_tests|rgsml_source_metadata_panel_smoke|rgsml_project_session_tests|rgsml_playback_support_tests|toolchain_manifest_)" --output-on-failure --verbose

      - name: Playback engine failure diagnostics
        if: failure()
        continue-on-error: true
        run: |
          $env:PATH = "$env:RGSML_QT_ROOT\bin;$env:PATH"
          $exe = "build/windows-msvc/Release/rgsml_playback_support_tests.exe"
          if (Test-Path $exe) {
            $log = "$env:GITHUB_WORKSPACE\playback-support-diagnostic.txt"
            & $exe -v2 -o "$log,txt"
            $exitCode = $LASTEXITCODE
            if (Test-Path $log) {
              Get-Content $log
            } else {
              Write-Host "PLAYBACK_DIAGNOSTIC_LOG_NOT_CREATED"
            }
            Write-Host "PLAYBACK_DIAGNOSTIC_EXIT_CODE=$exitCode"
          } else {
            Write-Host "PLAYBACK_DIAGNOSTIC_EXE_MISSING"
          }

      - name: Upload Visual Evidence Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-M12B-Visual-Evidence-${{ github.sha }}
          path: |
            ${{ github.workspace }}\build\visual-evidence\*.png
            ${{ github.workspace }}\build\visual-evidence\*.json
          retention-days: 7
# B2b only. Export the EXACT-SHA C++ probe + Qt dependencies, not WAVs,
      # and only after the Windows focused tests (including the selftest) pass.
      - name: Package B2b Windows C++ probe (no EBU audio)
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'build/windows-msvc/Release/rgsml_true_peak_b2b_probe.exe'
          if (-not (Test-Path $source)) { throw 'B2B_PROBE_EXECUTABLE_MISSING' }
          $dest = Join-Path $env:RUNNER_TEMP 'rgsml-b2b-probe'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $copy = Join-Path $dest 'rgsml_true_peak_b2b_probe.exe'
          Copy-Item -Path $source -Destination $copy
          # Probe links only rgsml_analysis/audio/core STATIC libraries (no Qt).
          # CI #416 confirmed windeployqt rejects this non-Qt executable.
          # Preserve the standalone EXE unchanged; assert no Qt6 import.
          $exeBytes = [System.IO.File]::ReadAllBytes($copy)
          $byteText = [System.Text.Encoding]::ASCII.GetString($exeBytes)
          if ($byteText -match '(?i)Qt6(Core|Gui|Test|Qml|Widgets|Multimedia)\.dll') {
            throw 'B2B_UNEXPECTED_QT_DYNAMIC_DEPENDENCY'
          }
          $probeHash = (Get-FileHash -Path $copy -Algorithm SHA256).Hash.ToLowerInvariant()
          $stamp = [ordered]@{
            kind = 'RGS_M16_B2B_CPP_PROBE_SYNTHETIC_CI_ONLY'
            source_commit_sha = '${{ github.event.pull_request.head.sha || github.sha }}'
            probe_exe_sha256 = $probeHash
            workflow_run_id = '${{ github.run_id }}'
            test_scope = 'SYNTHETIC_ONLY__OFFICIAL_EBU_WAVS_NOT_EXECUTED'
            production_gate_g = 'NOT_EXECUTED'
          }
          $stamp | ConvertTo-Json | Set-Content -Path (Join-Path $dest 'B2b_build_provenance.json') -Encoding utf8
          Write-Host "B2B_PROBE_EXE_SHA256=$probeHash"

      # B2c remains strictly qualification-only. PCM is generated in RAM and
      # passed to the production-linked probe via a local anonymous pipe.
      # Exact HEAD + run provenance is checked against this job's built artifact.
      - name: M16 B2c six-rate independent C++ synthetic qualification
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/qualification/true_peak/qualify_six_rate_cpp.py --selftest
          if ($LASTEXITCODE -ne 0) { throw 'B2C_INDEPENDENT_ORACLE_SELFTEST_FAILED' }
          $dest = Join-Path $env:RUNNER_TEMP 'rgsml-b2b-probe'
          $argsB2c = @(
            'tools/qualification/true_peak/qualify_six_rate_cpp.py',
            '--probe', (Join-Path $dest 'rgsml_true_peak_b2b_probe.exe'),
            '--provenance', (Join-Path $dest 'B2b_build_provenance.json'),
            '--expected-source-sha', '${{ github.event.pull_request.head.sha || github.sha }}',
            '--expected-run-id', '${{ github.run_id }}'
          )
          $resultFile = Join-Path $dest 'B2c_six_rate_result.json'
          python @argsB2c | Set-Content -Path $resultFile -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'B2C_SIX_RATE_CPP_COMPARISON_FAILED' }
          $report = Get-Content -LiteralPath $resultFile -Raw | ConvertFrom-Json
          if ($report.status -ne 'B2C_SYNTHETIC_SIX_RATE_CPP_COMPARISON_PASS' -or
              $report.production_gate_g -ne 'NOT_COMPLETE' -or
              $report.cases -ne 36 -or
              $report.metamorphic_pairs -ne 12 -or
              $report.results.Count -ne 36) {
            throw 'B2C_SIX_RATE_RESULT_CONTRACT_FAILED'
          }
          Write-Host 'B2C_SYNTHETIC_SIX_RATE_CPP_COMPARISON_PASS_36_OF_36__GATE_G_OPEN'

      # B2d: categorical error-path / subnormal / overflow qualification.
      # Uses the same EXACT built C++ probe, no EBU assets or audio artifacts.
      - name: M16 B2d extreme-FP and fail-closed C++ qualification
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/qualification/true_peak/qualify_extreme_fp_cpp.py --selftest
          if ($LASTEXITCODE -ne 0) { throw 'B2D_ORACLE_SELFTEST_FAILED' }
          $dest = Join-Path $env:RUNNER_TEMP 'rgsml-b2b-probe'
          $argsB2d = @(
            'tools/qualification/true_peak/qualify_extreme_fp_cpp.py',
            '--probe', (Join-Path $dest 'rgsml_true_peak_b2b_probe.exe'),
            '--provenance', (Join-Path $dest 'B2b_build_provenance.json'),
            '--expected-source-sha', '${{ github.event.pull_request.head.sha || github.sha }}',
            '--expected-run-id', '${{ github.run_id }}'
          )
          $resultFile = Join-Path $dest 'B2d_extreme_fp_result.json'
          python @argsB2d | Set-Content -Path $resultFile -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'B2D_EXTREME_FP_CPP_FAILED' }
          $report = Get-Content -LiteralPath $resultFile -Raw | ConvertFrom-Json
          if ($report.status -ne 'B2D_EXTREME_FP_CPP_COMPARISON_PASS' -or
              $report.production_gate_g -ne 'NOT_COMPLETE' -or
              $report.cases -ne 27 -or
              $report.counts.tiny -ne 4 -or
              $report.counts.large -ne 2 -or
              $report.counts.nonfinite -ne 18 -or
              $report.counts.overflow -ne 1 -or
              $report.counts.framing -ne 1 -or
              $report.counts.unsupported -ne 1) {
            throw 'B2D_RESULT_CONTRACT_FAILED'
          }
          Write-Host 'B2D_EXTREME_FP_CPP_COMPARISON_PASS_27_OF_27__GATE_G_OPEN'

      # B2e high precision ideal reconstruction is a diagnostic screen ONLY.
      # Frozen ITU QTP compares discrete FIR, NOT continuous ideal waveform.
      - name: M16 B2e high precision ideal reconstruction screen
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install mpmath==1.3.0
          if ($LASTEXITCODE -ne 0) { throw 'B2E_PINNED_MATH_LIB_INSTALL_FAILED' }
          python tools/qualification/true_peak/qualify_ideal_screen_cpp.py --selftest
          if ($LASTEXITCODE -ne 0) { throw 'B2E_SINC_ORACLE_SELFTEST_FAILED' }
          $dest = Join-Path $env:RUNNER_TEMP 'rgsml-b2b-probe'
          $argsB2e = @(
            'tools/qualification/true_peak/qualify_ideal_screen_cpp.py',
            '--probe', (Join-Path $dest 'rgsml_true_peak_b2b_probe.exe'),
            '--provenance', (Join-Path $dest 'B2b_build_provenance.json'),
            '--expected-source-sha', '${{ github.event.pull_request.head.sha || github.sha }}',
            '--expected-run-id', '${{ github.run_id }}'
          )
          $resultFile = Join-Path $dest 'B2e_ideal_screen_result.json'
          python @argsB2e | Set-Content -Path $resultFile -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'B2E_IDEAL_CPP_SCREEN_FAILED' }
          $report = Get-Content -LiteralPath $resultFile -Raw | ConvertFrom-Json
          if ($report.status -ne 'B2E_IDEAL_RECONSTRUCTION_SCREEN_PASS' -or
              $report.production_gate_g -ne 'NOT_COMPLETE' -or
              $report.cases -ne 5 -or
              $report.results.Count -ne 5 -or
              $report.results[0].ideal_tail_interval_certificate -ne 'NOT_EXECUTED') {
            throw 'B2E_SCREEN_RESULT_CONTRACT_FAILED'
          }
          Write-Host 'B2E_IDEAL_RECONSTRUCTION_SCREEN_PASS_5_OF_5__NOT_CERTIFIED__GATE_G_OPEN'

      - name: Upload B2b Windows C++ probe (NO EBU AUDIO)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-M16-B2b-CPP-Probe-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}\rgsml-b2b-probe\
          retention-days: 7
          if-no-files-found: error

