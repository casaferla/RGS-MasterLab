name: Windows Full Qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-windows-qualification:
    name: Full Windows Qualification Matrix
    runs-on: windows-2022
    env:
      RGSML_QT_ROOT: ${{ github.workspace }}/6.8.3/msvc2022_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Qt 6.8.3 via aqtinstall
        run: |
          pip install "aqtinstall==3.3.0" "py7zr==1.1.0"
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -m qtmultimedia

      - name: Configure Windows MSVC
        run: |
          cmake --preset windows-msvc `
            -DRGSML_PROVENANCE_TYPE=FQ `
            -DRGSML_PROVENANCE_RUN_NUMBER=${{ github.run_number }} `
            -DRGSML_PROVENANCE_GIT_SHA=${{ github.sha }}

      - name: Clean-build Debug
        run: |
          cmake --build --preset windows-msvc-debug-clean

      # Run the UI smoke directly in Debug with verbose QtTest output.
      # This preserves full Debug coverage while making any UI failure actionable;
      # the generic CTest pass below excludes the same ui_smoke label to avoid duplication.
      - name: Run Debug UI Smoke Diagnostic
        env:
          RGSML_GUI01_EVIDENCE_DIR: ${{ github.workspace }}\\build\\visual-evidence-debug
        run: |
          $env:PATH = "$env:RGSML_QT_ROOT\\bin;$env:PATH"
          $env:QML2_IMPORT_PATH = "$env:RGSML_QT_ROOT\\qml"
          $log = "$env:GITHUB_WORKSPACE\\debug-ui-smoke.txt"
          & build/windows-msvc/Debug/rgsml_source_metadata_panel_smoke.exe -v2 -o "$log,txt"
          $exitCode = $LASTEXITCODE
          if (Test-Path $log) {
              Get-Content $log
          } else {
              Write-Host "DEBUG_UI_SMOKE_LOG_NOT_CREATED"
          }
          if ($exitCode -ne 0) {
              exit $exitCode
          }

      # GitHub-hosted Windows runners expose no physical audio output endpoints.
      # playback_device label (rgsml_playback_device_probe) is excluded from headless CI only.
      # Real hardware playback device qualification remains mandatory at manual Windows PO Gate M.
      - name: Run Full Debug CTest
        run: |
          ctest --preset windows-msvc-debug --output-on-failure -LE "playback_device|ui_smoke"

      - name: Clean-build Release
        run: |
          cmake --build --preset windows-msvc-release-clean

      - name: Run Release UI Smoke Diagnostic
        env:
          RGSML_GUI01_EVIDENCE_DIR: ${{ github.workspace }}\\build\\visual-evidence-release
        run: |
          $env:PATH = "$env:RGSML_QT_ROOT\\bin;$env:PATH"
          $env:QML2_IMPORT_PATH = "$env:RGSML_QT_ROOT\\qml"
          $log = "$env:GITHUB_WORKSPACE\\release-ui-smoke.txt"
          & build/windows-msvc/Release/rgsml_source_metadata_panel_smoke.exe -v2 -o "$log,txt"
          $exitCode = $LASTEXITCODE
          if (Test-Path $log) {
              Get-Content $log
          } else {
              Write-Host "RELEASE_UI_SMOKE_LOG_NOT_CREATED"
          }
          if ($exitCode -ne 0) {
              exit $exitCode
          }

      - name: Run Full Release CTest
        run: |
          ctest --preset windows-msvc-release --output-on-failure -LE "playback_device|ui_smoke"

      - name: Configure Release (Tests OFF)
        run: |
          cmake -B build/windows-msvc-tests-off -G "Visual Studio 17 2022" -A x64 `
            -DRGSML_BUILD_TESTS=OFF `
            -DRGSML_WARNINGS_AS_ERRORS=ON `
            -DRGSML_PROVENANCE_TYPE=FQ `
            -DRGSML_PROVENANCE_RUN_NUMBER=${{ github.run_number }} `
            -DRGSML_PROVENANCE_GIT_SHA=${{ github.sha }}

      - name: Build Release (Tests OFF)
        run: |
          cmake --build build/windows-msvc-tests-off --config Release

      - name: Install/Stage Release Build
        run: |
          cmake --install build/windows-msvc --config Release --prefix build/windows-msvc/stage/CI/Release

      - name: Run Deploy Smoke Test
        run: |
          & build/windows-msvc/stage/CI/Release/bin/RGSMasterLab.exe --rgsml-deploy-smoke

      - name: Upload Staged Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RGS-MasterLab-Windows-FQ-${{ github.run_number }}-${{ github.sha }}
          path: build/windows-msvc/stage/CI/Release/**
          retention-days: 7
