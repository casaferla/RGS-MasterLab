name: L3 integrated Windows Product artifact (non-FQ)
on:
  push:
    branches:
      - staging/l3-windows-product-artifact-20261126
permissions:
  contents: read
jobs:
  product:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt 6.8.3
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0" "py7zr==1.1.0"
          if ($LASTEXITCODE -ne 0) { throw 'L3_ARTIFACT_DEPENDENCY_FAILURE' }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -m qtmultimedia
          if ($LASTEXITCODE -ne 0) { throw 'L3_ARTIFACT_QT_FAILURE' }
      - name: Build actual Product Release with exact CI provenance
        shell: pwsh
        run: |
          $actual=(git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw 'L3_ARTIFACT_WRONG_CHECKOUT' }
          $qt=Join-Path $env:GITHUB_WORKSPACE '6.8.3/msvc2022_64'
          $log=Join-Path $env:RUNNER_TEMP 'l3-artifact-build.log'
          cmake -S . -B build-l3-package -G 'Visual Studio 17 2022' -A x64 -DRGSML_BUILD_TESTS=ON -DRGSML_WARNINGS_AS_ERRORS=ON -DRGSML_PROVENANCE_TYPE=CI "-DRGSML_PROVENANCE_RUN_NUMBER=$env:GITHUB_RUN_NUMBER" "-DRGSML_PROVENANCE_GIT_SHA=$actual" "-DRGSML_QT_ROOT=$qt" *> $log
          if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 80; throw 'L3_ARTIFACT_CONFIGURE_FAILURE' }
          cmake --build build-l3-package --config Release --parallel 4 --target rgsml_app rgsml_project_session_tests rgsml_l3_m12_project_carrier_tests rgsml_mastering_chain_state_tests rgsml_mastering_preview_controller_tests *> $log
          if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 100; throw 'L3_ARTIFACT_PRODUCT_BUILD_FAILURE' }
      - name: Run transfer carrier and native preview unit regressions
        shell: pwsh
        run: |
          $env:PATH="$env:GITHUB_WORKSPACE/6.8.3/msvc2022_64/bin;$env:PATH"
          $env:RGSML_PLAYBACK_FIR_ROOT=Join-Path $env:GITHUB_WORKSPACE 'build-l3-package/generated/rgsml/fir'
          if (!(Test-Path -LiteralPath (Join-Path $env:RGSML_PLAYBACK_FIR_ROOT 'fir_manifest.json'))) { throw 'L3_UNIT_FIR_MANIFEST_MISSING' }
          $report=Join-Path $env:RUNNER_TEMP 'l3-transfer-unit-tests.txt'
          $failures=@()
          foreach ($name in @('rgsml_l3_m12_project_carrier_tests','rgsml_mastering_chain_state_tests','rgsml_mastering_preview_controller_tests')) {
            $exe=@(Get-ChildItem build-l3-package -Filter "$name.exe" -Recurse)
            if ($exe.Count -ne 1) { $failures+="${name}: executable missing or ambiguous"; continue }
            $detail=Join-Path $env:RUNNER_TEMP "l3-unit-$name.txt"
            $out=Join-Path $env:RUNNER_TEMP "l3-unit-$name-stdout.log"
            $err=Join-Path $env:RUNNER_TEMP "l3-unit-$name-stderr.log"
            $p=Start-Process -FilePath $exe[0].FullName -ArgumentList @('-o',"`"$detail,txt`"") -PassThru -Wait -RedirectStandardOutput $out -RedirectStandardError $err
            "${name}: exit=$($p.ExitCode)" | Tee-Object -FilePath $report -Append
            foreach ($file in @($detail,$out,$err)) {
              if (Test-Path -LiteralPath $file) { Get-Content -LiteralPath $file | Write-Host }
            }
            if ($p.ExitCode -ne 0 -or !(Test-Path -LiteralPath $detail) -or !(Select-String -LiteralPath $detail -Pattern 'Totals:.* 0 failed,' -Quiet)) {
              $failures+="${name}: exit=$($p.ExitCode)"
            }
          }
          if ($failures.Count -ne 0) { throw "L3_TRANSFER_UNIT_FAILURE: $($failures -join '; ')" }
      - name: Install complete standalone Windows Product
        shell: pwsh
        run: |
          $stage=Join-Path $env:GITHUB_WORKSPACE 'build-l3-package/stage/L3-INTEGRATED-NONFQ'
          cmake --install build-l3-package --config Release --prefix "$stage"
          if ($LASTEXITCODE -ne 0) { throw 'L3_ARTIFACT_INSTALL_FAILURE' }
          foreach ($relative in @('bin/RGSMasterLab.exe','plugins/platforms/qwindows.dll','share/RGSMasterLab/ToolchainManifest.json')) {
            if (!(Test-Path -LiteralPath (Join-Path $stage $relative))) { throw "L3_ARTIFACT_MISSING=$relative" }
          }
          python tools/qualification/playback_src/verify_installed_16_firs.py --fir-root (Join-Path $stage 'bin/resources/fir')
          if ($LASTEXITCODE -ne 0) { throw 'L3_ARTIFACT_FIR_PIN_FAILURE' }
      - name: Cold smoke actual installed Product
        shell: pwsh
        run: |
          $stage=Join-Path $env:GITHUB_WORKSPACE 'build-l3-package/stage/L3-INTEGRATED-NONFQ'
          $exe=Join-Path $stage 'bin/RGSMasterLab.exe'
          $env:QML2_IMPORT_PATH=''
          $env:QML_IMPORT_PATH=''
          $env:QT_PLUGIN_PATH=''
          $env:PATH=($env:PATH -split ';' | Where-Object { $_ -notlike "*6.8.3*msvc2022_64*" }) -join ';'
          $out=Join-Path $env:RUNNER_TEMP 'l3-artifact-cold-out.log'
          $err=Join-Path $env:RUNNER_TEMP 'l3-artifact-cold-err.log'
          $p=Start-Process -FilePath $exe -ArgumentList '--rgsml-deploy-smoke' -PassThru -Wait -RedirectStandardOutput $out -RedirectStandardError $err
          if (Test-Path -LiteralPath $out) { Get-Content $out -Tail 40 }
          if (Test-Path -LiteralPath $err) { Get-Content $err -Tail 80 }
          if ($p.ExitCode -ne 0) { throw "L3_ARTIFACT_COLD_SMOKE_FAILURE=$($p.ExitCode)" }
          Write-Host 'L3_STANDALONE_COLD_SMOKE=PASS'
      - name: Capture actual Product context and header screenshots
        shell: pwsh
        run: |
          $stage=Join-Path $env:GITHUB_WORKSPACE 'build-l3-package/stage/L3-INTEGRATED-NONFQ'
          $shots=Join-Path $env:RUNNER_TEMP 'l3-context-shots'
          New-Item -ItemType Directory -Force $shots | Out-Null
          $env:RGSML_CONTEXT_SCREENSHOT_DIR=$shots
          $env:QT_QUICK_BACKEND='software'
          $p=Start-Process -FilePath (Join-Path $stage 'bin/RGSMasterLab.exe') -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'L3_CONTEXT_CAPTURE_FAILED' }
          foreach ($file in @('minimum-dsp-0.png','minimum-dsp-1.png','minimum-dsp-2.png','minimum-dsp-3.png','minimum-dsp-4.png','minimum-dsp-5.png','minimum-prepare.png','capture-geometry.txt')) {
            if (!(Test-Path -LiteralPath (Join-Path $shots $file))) { throw "L3_CONTEXT_CAPTURE_MISSING=$file" }
          }
          $geometry=Get-Content -LiteralPath (Join-Path $shots 'capture-geometry.txt')
          $geometry | Write-Host
          if ($geometry -notcontains 'maximized=SKIPPED_INSUFFICIENT_SCREEN_GEOMETRY') {
            foreach ($file in @('maximized-automatch.png','maximized-prepare.png')) {
              if (!(Test-Path -LiteralPath (Join-Path $shots $file))) { throw "L3_CONTEXT_CAPTURE_MISSING=$file" }
            }
          }
      - name: Qualify staged native manual Dynamic EQ and Transient Shaper GUI
        shell: pwsh
        run: |
          $stage=Join-Path $env:GITHUB_WORKSPACE 'build-l3-package/stage/L3-INTEGRATED-NONFQ'
          $shots=Join-Path $env:RUNNER_TEMP 'l3-context-shots'
          $env:RGSML_CONTEXT_SCREENSHOT_DIR=''
          $env:RGSML_MANUAL_MATCH_SCREENSHOT_DIR=$shots
          $env:QT_QUICK_BACKEND='software'
          $out=Join-Path $env:RUNNER_TEMP 'manual-match-smoke-out.log'
          $err=Join-Path $env:RUNNER_TEMP 'manual-match-smoke-err.log'
          $p=Start-Process -FilePath (Join-Path $stage 'bin/RGSMasterLab.exe') -ArgumentList '--rgsml-manual-match-dsp-smoke' -PassThru -Wait -RedirectStandardOutput $out -RedirectStandardError $err
          Get-Content -LiteralPath $out
          Get-Content -LiteralPath $err -Tail 80
          if ($p.ExitCode -ne 0) { throw "L3_MANUAL_MATCH_GUI_FAILURE=$($p.ExitCode)" }
          foreach ($file in @('manual-dynamic-eq.png','manual-transient-shaper.png')) {
            if (!(Test-Path -LiteralPath (Join-Path $shots $file))) { throw "L3_MANUAL_MATCH_SCREENSHOT_MISSING=$file" }
          }
      - name: Upload actual Product screenshots
        uses: actions/upload-artifact@v4
        with:
          name: L3-Product-Context-and-DSP-Headers
          path: |
            ${{ runner.temp }}/l3-context-shots/*.png
            ${{ runner.temp }}/l3-context-shots/capture-geometry.txt
          if-no-files-found: error
          retention-days: 30
      - name: Include exact artifact provenance and physical replay checklist
        shell: pwsh
        run: |
          $stage=Join-Path $env:GITHUB_WORKSPACE 'build-l3-package/stage/L3-INTEGRATED-NONFQ'
          @("commit=$env:GITHUB_SHA","run=$env:GITHUB_RUN_ID","configuration=Release","qualification=NONFQ","physical_playback=NOT_RUN") |
            Set-Content (Join-Path $stage 'L3_ARTIFACT_PROVENANCE.txt') -Encoding utf8
          Copy-Item -LiteralPath 'docs/architecture/L3_WINDOWS_PHYSICAL_ACCEPTANCE_20261126.md' -Destination (Join-Path $stage 'L3_PHYSICAL_ACCEPTANCE.md')
      - name: Stage independent optional local music benchmark
        shell: pwsh
        run: |
          $stage=Join-Path $env:GITHUB_WORKSPACE 'build-l3-package/stage/L3-INTEGRATED-NONFQ'
          $qt=Join-Path $env:GITHUB_WORKSPACE '6.8.3/msvc2022_64'
          $bench=New-Item -ItemType Directory -Force -Path (Join-Path $stage 'benchmark')
          $test=@(Get-ChildItem build-l3-package -Filter rgsml_project_session_tests.exe -Recurse)
          if ($test.Count -ne 1) { throw 'L3_BENCH_EXE_NOT_UNIQUE' }
          Copy-Item -LiteralPath $test[0].FullName -Destination $bench.FullName
          Copy-Item -LiteralPath (Join-Path $qt 'bin/Qt6Test.dll') -Destination $bench.FullName
          Copy-Item -LiteralPath 'tools/qualification/run_l3_local_music_benchmark.ps1' -Destination $bench.FullName
          Copy-Item -LiteralPath 'docs/architecture/L3_NATIVE_SEARCH_PERFORMANCE_EVIDENCE_20261126.md' -Destination $bench.FullName
          $env:PATH="$($bench.FullName);$stage/bin;$env:PATH"
          $env:RGSML_PLAYBACK_FIR_ROOT=Join-Path $stage 'bin/resources/fir'
          $env:RGSML_L3_E2E_RATE='48000'
          $env:QTEST_FUNCTION_TIMEOUT='900000'
          $report=Join-Path $env:RUNNER_TEMP 'l3-benchmark-bundle-smoke.txt'
          & (Join-Path $bench.FullName 'rgsml_project_session_tests.exe') nativeMeasuredWinnerUsesRealQtM12AndM13 -o "$report,txt"
          if ($LASTEXITCODE -ne 0) { Get-Content $report -Tail 80; throw 'L3_BENCH_BUNDLE_SMOKE_FAILED' }
          if (!(Select-String -Path $report -Pattern 'PASS\s+:.*::nativeMeasuredWinnerUsesRealQtM12AndM13\(48k\)' -Quiet)) { throw 'L3_BENCH_BUNDLE_ROW_MISSING' }
          Copy-Item -LiteralPath $report -Destination $bench.FullName
          $transferReport=Join-Path $env:RUNNER_TEMP 'l3-transfer-six-rates.txt'
          & (Join-Path $bench.FullName 'rgsml_project_session_tests.exe') product_manual_match_transfer_transaction -o "$transferReport,txt"
          if ($LASTEXITCODE -ne 0) { Get-Content $transferReport -Tail 100; throw 'L3_TRANSFER_PRODUCT_FAILURE' }
          foreach ($tag in @('44k1','48k','88k2','96k','176k4','192k')) {
            $pattern='PASS\s+:.*::product_manual_match_transfer_transaction\(' + [regex]::Escape($tag) + '\)'
            if (!(Select-String -Path $transferReport -Pattern $pattern -Quiet)) { throw "L3_TRANSFER_RATE_MISSING=$tag" }
          }
          Copy-Item -LiteralPath $transferReport -Destination $bench.FullName
      - name: Publish exact standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: RGS-L3-Win64-INTEGRATED-NONFQ-${{ github.run_number }}-${{ github.sha }}
          path: build-l3-package/stage/L3-INTEGRATED-NONFQ/
          if-no-files-found: error
          retention-days: 14
      - name: Retain diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l3-windows-artifact-diagnostics
          path: |
            ${{ runner.temp }}/l3-artifact-build.log
            ${{ runner.temp }}/l3-artifact-cold-out.log
            ${{ runner.temp }}/l3-artifact-cold-err.log
            ${{ runner.temp }}/l3-transfer-six-rates.txt
            ${{ runner.temp }}/l3-transfer-unit-tests.txt
            ${{ runner.temp }}/l3-unit-*.txt
            ${{ runner.temp }}/l3-unit-*.log
          if-no-files-found: warn
          retention-days: 14
