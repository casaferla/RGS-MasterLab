name: R1d P2 I2 Opt-In Registry Focused (nonrelease)
on:
  push:
    branches:
      - staging/r1d-p2-i2-preview-focused-ci-20261112
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2-registry:
    name: P2 Registry ABI ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Linux strict FP)
        if: runner.os == 'Linux'
        shell: bash
        run: >
          cmake -S research/r1d-p2-live -B build-p2-i2
          -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS="-ffp-contract=off -fno-fast-math -frounding-math"
      - name: Configure (Windows MSVC x64)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -S research/r1d-p2-live -B build-p2-i2
          -G "Visual Studio 17 2022" -A x64
      - name: Build actual registry and P2 ABI tests
        run: cmake --build build-p2-i2 --config Release --target r1d_p2_optin_registry_tests r1d_p2_real_processing_chain_tests
      - name: Execute original RGS ProcessingChain and opt-in P2 PCM gates
        run: ctest --test-dir build-p2-i2 -C Release --output-on-failure -R "^r1d_p2_(optin_registry|real_processing_chain)_tests$"
