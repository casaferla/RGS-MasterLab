name: Stereo Imager display label (focused, nonrelease)
on:
  push:
    branches:
      - staging/ui-stereo-imager-label-focused-20261121
permissions:
  contents: read
jobs:
  stereo-imager-display:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check UI copy with no DSP identifier rewrites
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path("app/src/dsp_module_adapter.cpp").read_text(encoding="utf-8")
          qml=Path("ui/qml/StereoMsEditor.qml").read_text(encoding="utf-8")
          vm=Path("app/src/stereo_ms_view_model.cpp").read_text(encoding="utf-8")
          t=Path("tests/unit/app/test_dsp_module_adapter.cpp").read_text(encoding="utf-8")
          assert 'QString StereoMsModuleAdapter::display_name() const { return QStringLiteral("Stereo Imager"); }' in app
          assert 'rgsml.dsp.stereo-ms' in app and '"STEREO_MS"' in app
          assert 'Reset Stereo Imager parameters' in qml
          assert 'Restore all Stereo Imager parameters' in qml
          assert 'Stereo Imager is not present' in vm
          assert 'Unsupported Stereo Imager parameter field' in vm
          assert 'adapter->display_name(), QStringLiteral("Stereo Imager")' in t
          print("STEREO_IMAGER_UI_COPY=PASS; internal DSP types and editor keys unchanged")
          PY
      - name: Prepare Qt on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0" "py7zr==1.1.0"
          if ($LASTEXITCODE -ne 0) { throw 'STEREO_NAME_QT_DEP_FAILED' }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -m qtmultimedia
          if ($LASTEXITCODE -ne 0) { throw 'STEREO_NAME_QT_FAILED' }
      - name: Prepare Qt on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libegl1-mesa-dev libdbus-1-dev
          python3 -m pip install --disable-pip-version-check "aqtinstall==3.3.0" "py7zr==1.1.0"
          python3 -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 -m qtmultimedia
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Build and run Stereo Imager adapter QtTest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'stereo-name-bounded.log'
          cmake -S . -B build-stereo-name -G 'Visual Studio 17 2022' -A x64 -DRGSML_BUILD_TESTS=ON -DRGSML_WARNINGS_AS_ERRORS=ON "-DRGSML_QT_ROOT=$env:GITHUB_WORKSPACE/6.8.3/msvc2022_64" *> $log
          if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 55; throw 'STEREO_NAME_CONFIGURE_FAILED' }
          cmake --build build-stereo-name --config Release --parallel 4 --target rgsml_dsp_module_adapter_tests *> $log
          if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 55; throw 'STEREO_NAME_BUILD_FAILED' }
          $env:PATH="$env:GITHUB_WORKSPACE/6.8.3/msvc2022_64/bin;$env:PATH"
          ctest --test-dir build-stereo-name -C Release --output-on-failure -R '^rgsml_dsp_module_adapter_tests$' *> $log
          if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 65; throw 'STEREO_NAME_NATIVE_TEST_FAILED' }
          Get-Content $log -Tail 7
      - name: Build and run Stereo Imager adapter QtTest (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S . -B build-stereo-name -G Ninja -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/6.8.3/gcc_64" -DRGSML_BUILD_TESTS=ON -DRGSML_WARNINGS_AS_ERRORS=ON > /tmp/stereo-name-bounded.log 2>&1 || { tail -n 55 /tmp/stereo-name-bounded.log; exit 1; }
          cmake --build build-stereo-name --parallel 4 --target rgsml_dsp_module_adapter_tests > /tmp/stereo-name-bounded.log 2>&1 || { tail -n 55 /tmp/stereo-name-bounded.log; exit 1; }
          ctest --test-dir build-stereo-name --output-on-failure -R '^rgsml_dsp_module_adapter_tests$' > /tmp/stereo-name-bounded.log 2>&1 || { tail -n 65 /tmp/stereo-name-bounded.log; exit 1; }
          tail -n 7 /tmp/stereo-name-bounded.log
