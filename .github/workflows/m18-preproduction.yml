# Independent M18-only preproduction CI. No Qt, Ninja, MPFR, FIR/FQ or M17.
# Invoked ONLY by a push to M18's dedicated Draft PR head, or manually.
# This is a compile/smoke gate, never Gate G or M18 integration authority.
name: M18 Independent Preproduction CI

on:
  push:
    branches:
      - experimental/m18-dither-20261102
    paths:
      - 'audio/src/internal/m18_*.hpp'
      - 'tools/qualification/m18/**'
      - 'tests/unit/audio/test_m18_counter_dither_philox.cpp'
      - 'tests/CMakeLists.txt'
      - '.github/workflows/m18-preproduction.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m18-preproduction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-m18:
    name: M18 only · Linux C++20 Debug + Release
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Independently reconstruct M18 RNG/PCM24/Float32 numerical oracles
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qualification/m18/test_m18_independent_reference.py
          python3 tools/qualification/m18/test_m18_wav_reference.py
          python3 tools/qualification/m18/test_m18_wav_candidate_auditor.py
      - name: Verify independent WAV auditor adversarial fixtures · Windows
        shell: pwsh
        run: |
          python tools/qualification/m18/test_m18_wav_candidate_auditor.py
          if ($LASTEXITCODE -ne 0) { throw "M18_WAV_CANDIDATE_AUDIT_FAILED" }

      - name: Compile and run independent M18 oracle · Debug
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++20 -O0 -g -Wall -Wextra -Wpedantic -Werror \
            -I audio/src \
            tools/qualification/m18/m18_portable_selftest.cpp \
            -o "$RUNNER_TEMP/m18-preproduction-debug"
          "$RUNNER_TEMP/m18-preproduction-debug"
      - name: Compile and run independent M18 oracle · Release
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            -I audio/src \
            tools/qualification/m18/m18_portable_selftest.cpp \
            -o "$RUNNER_TEMP/m18-preproduction-release"
          "$RUNNER_TEMP/m18-preproduction-release"

      - name: M18 streaming WAV and private disk transaction · Linux Debug + Release
        shell: bash
        run: |
          set -euo pipefail
          for opts in "-O0 -g" "-O2"; do
            c++ -std=c++20 $opts -Wall -Wextra -Wpedantic -Werror \
              -I audio/src -I core/include \
              tools/qualification/m18/m18_streaming_selftest.cpp \
              core/src/sha256.cpp \
              -o "$RUNNER_TEMP/m18-streaming-linux"
            "$RUNNER_TEMP/m18-streaming-linux"
          done

  windows-m18:
    name: M18 only · Windows MSVC C++20 Debug + Release
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile and run independent M18 oracle · Debug
        shell: pwsh
        run: |
          $debugLog = "$env:RUNNER_TEMP/m18-windows-debug-bounded.txt"
          & cl.exe /nologo /std:c++20 /EHsc /Od /W4 /WX /Zc:__cplusplus /Iaudio/src `
            tools/qualification/m18/m18_portable_selftest.cpp `
            "/Fe:$env:RUNNER_TEMP/m18-preproduction-debug.exe" *> $debugLog
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Add-Content $debugLog "M18_DEBUG_COMPILE_EXIT=$code"
            Get-Content $debugLog -Tail 70
            throw "M18_DEBUG_COMPILE_FAILED"
          }
          & "$env:RUNNER_TEMP/m18-preproduction-debug.exe" *> "$env:RUNNER_TEMP/m18-windows-execution.txt"
          $code = $LASTEXITCODE
          Add-Content $debugLog "M18_DEBUG_RUNTIME_EXIT=$code"
          Get-Content "$env:RUNNER_TEMP/m18-windows-execution.txt" -Tail 16
          if ($code -ne 0) { throw "M18_DEBUG_ORACLE_FAILED_$code" }
      - name: Compile and run independent M18 oracle · Release
        shell: pwsh
        run: |
          & cl.exe /nologo /std:c++20 /EHsc /O2 /W4 /WX /Zc:__cplusplus /Iaudio/src `
            tools/qualification/m18/m18_portable_selftest.cpp `
            "/Fe:$env:RUNNER_TEMP/m18-preproduction-release.exe"
          if ($LASTEXITCODE -ne 0) { throw "M18_RELEASE_COMPILE_FAILED" }
          & "$env:RUNNER_TEMP/m18-preproduction-release.exe"
          if ($LASTEXITCODE -ne 0) { throw "M18_RELEASE_ORACLE_FAILED" }

      - name: M18 streaming WAV and private disk transaction · Windows Debug + Release
        shell: pwsh
        run: |
          $report = "$env:RUNNER_TEMP/m18-streaming-windows-bounded.txt"
          foreach ($mode in @("Debug","Release")) {
            $optimization = if ($mode -eq "Debug") { "/Od" } else { "/O2" }
            & cl.exe /nologo /std:c++20 /EHsc $optimization /W4 /WX /Zc:__cplusplus `
              /Iaudio/src /Icore/include `
              tools/qualification/m18/m18_streaming_selftest.cpp `
              core/src/sha256.cpp `
              "/Fe:$env:RUNNER_TEMP/m18-streaming-$mode.exe" *> $report
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              Add-Content $report "M18_STREAM_COMPILE_${mode}_EXIT=$code"
              Get-Content $report -Tail 70
              throw "M18_STREAM_COMPILE_FAILED_$mode"
            }
            & "$env:RUNNER_TEMP/m18-streaming-$mode.exe" >> $report 2>&1
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              Add-Content $report "M18_STREAM_RUNTIME_${mode}_EXIT=$code"
              Get-Content $report -Tail 40
              throw "M18_STREAM_RUNTIME_FAILED_$mode"
            }
          }

      - name: Upload bounded Windows M18 errors only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-M18-Bounded-Windows-${{ github.run_number }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/m18-windows-debug-bounded.txt
            ${{ runner.temp }}/m18-windows-execution.txt
            ${{ runner.temp }}/m18-streaming-windows-bounded.txt
          if-no-files-found: ignore
          retention-days: 7
