name: M19-M21 GUI and Real Typed QtQuick Convergence Focused (non-FQ)
on:
  push:
    branches:
      - staging/m19-m21-gui-typed-convergence-candidate-20261108
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m19-m21-typed-gui-convergence
  cancel-in-progress: false
jobs:
  linux-ui-projection:
    name: Linux - real PCM into independent QtQuick analysis panels
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Qt 6.8.3 and dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libegl1-mesa-dev libdbus-1-dev
          python3 -m pip install --disable-pip-version-check "aqtinstall==3.3.0" "py7zr==1.1.0"
          python3 -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 -m qtmultimedia
      - name: "Build typed projection and real M21 regression"
        shell: bash
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/rgs-ui-configure.log"
          buildlog="$RUNNER_TEMP/rgs-ui-build.log"
          bounded="$RUNNER_TEMP/rgs-ui-bounded-failure.txt"
          if ! cmake -S . -B build/m21-ui-typed -G Ninja -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/6.8.3/gcc_64" -DRGSML_BUILD_TESTS=ON -DRGSML_WARNINGS_AS_ERRORS=ON >"$cfg" 2>&1; then
            tail -n 50 "$cfg" >"$bounded"
            exit 1
          fi
          if ! cmake --build build/m21-ui-typed --parallel 4 --target rgsml_m21_ui_readonly_projection_candidate_tests rgsml_m21_real_product_metrics_port_tests rgsml_m19_m21_typed_qml_convergence_tests >"$buildlog" 2>&1; then
            tail -n 60 "$buildlog" >"$bounded"
            exit 1
          fi
          tail -n 5 "$buildlog"
      - name: Upload bounded Linux failure (no complete logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-M19-M21-UI-Bounded-Linux
          path: ${{ runner.temp }}/rgs-ui-bounded-failure.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: "Run focused projection and M21 tests"
        shell: bash
        run: |
          set -euo pipefail
          testlog="$RUNNER_TEMP/rgs-ui-ctest.log"
          if ! ctest --test-dir build/m21-ui-typed --output-on-failure -R '^(rgsml_m21_ui_readonly_projection_candidate_tests|rgsml_m21_real_product_metrics_port_tests|rgsml_m19_m21_typed_qml_convergence_tests)$' >"$testlog" 2>&1; then
            tail -n 55 "$testlog" >"$RUNNER_TEMP/rgs-ui-test-bounded.txt"
            exit 1
          fi
          tail -n 7 "$testlog"
      - name: Upload bounded Linux CTest failure only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-M19-M21-UI-CTest-Bounded-Linux
          path: ${{ runner.temp }}/rgs-ui-test-bounded.txt
          if-no-files-found: ignore
          retention-days: 7

  windows-ui-projection:
    name: Windows - real PCM into independent QtQuick analysis panels
    runs-on: windows-2022
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Qt 6.8.3 MSVC
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0" "py7zr==1.1.0" ninja
          if ($LASTEXITCODE -ne 0) { throw 'UI_PROJECTION_TOOL_INSTALL_FAILED' }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -m qtmultimedia
          if ($LASTEXITCODE -ne 0) { throw 'UI_PROJECTION_QT_INSTALL_FAILED' }
      - name: "Build typed projection and real M21 regression"
        shell: pwsh
        run: |
          $qtRoot = "$env:GITHUB_WORKSPACE/6.8.3/msvc2022_64"
          $cfg = "$env:RUNNER_TEMP/rgs-ui-configure.log"
          $buildlog = "$env:RUNNER_TEMP/rgs-ui-build.log"
          $bounded = "$env:RUNNER_TEMP/rgs-ui-bounded-failure.txt"
          cmake -S . -B build/m21-ui-typed -G "Ninja Multi-Config" -DCMAKE_CONFIGURATION_TYPES=Release -DRGSML_BUILD_TESTS=ON -DRGSML_WARNINGS_AS_ERRORS=ON "-DRGSML_QT_ROOT=$qtRoot" *> $cfg
          if ($LASTEXITCODE -ne 0) {
            Get-Content $cfg -Tail 50 | Set-Content $bounded
            throw 'UI_PROJECTION_WINDOWS_CONFIGURE_FAILED'
          }
          cmake --build build/m21-ui-typed --config Release --parallel 4 --target rgsml_m21_ui_readonly_projection_candidate_tests rgsml_m21_real_product_metrics_port_tests rgsml_m19_m21_typed_qml_convergence_tests *> $buildlog
          if ($LASTEXITCODE -ne 0) {
            Get-Content $buildlog -Tail 60 | Set-Content $bounded
            throw 'UI_PROJECTION_WINDOWS_BUILD_FAILED'
          }
          Get-Content $buildlog -Tail 5
      - name: "Build and capture 24 historical independent QtQuick design states"
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          $qtRoot = "$env:GITHUB_WORKSPACE/6.8.3/msvc2022_64"
          $guiBuild = "$env:RUNNER_TEMP/m19m21-gui-design-build"
          $shots = "$env:RUNNER_TEMP/m19m21-gui-design-shots"
          $log = "$env:RUNNER_TEMP/m19m21-gui-design.log"
          $bounded = "$env:RUNNER_TEMP/m19m21-gui-design-bounded.txt"
          cmake -S tools/qualification/m19_m21_gui -B $guiBuild -G Ninja "-DCMAKE_PREFIX_PATH=$qtRoot" *> $log
          if ($LASTEXITCODE -ne 0) {
            Get-Content $log -Tail 50 | Set-Content $bounded
            throw 'CONVERGENCE_QML_DESIGN_CONFIGURE_FAILED'
          }
          cmake --build $guiBuild --parallel 3 *> $log
          if ($LASTEXITCODE -ne 0) {
            Get-Content $log -Tail 60 | Set-Content $bounded
            throw 'CONVERGENCE_QML_DESIGN_BUILD_FAILED'
          }
          $env:PATH = "$qtRoot/bin;$env:PATH"
          & "$guiBuild/rgsml_analysis_workbench_screenshot.exe" $shots *> $log
          if ($LASTEXITCODE -ne 0) {
            Get-Content $log -Tail 60 | Set-Content $bounded
            throw 'CONVERGENCE_QML_DESIGN_CAPTURE_FAILED'
          }
          $pngs = @(Get-ChildItem $shots -Filter '*.png')
          if ($pngs.Count -ne 24) {throw "CONVERGENCE_DESIGN_EXPECTED_24_FOUND_$($pngs.Count)"}
          foreach ($png in $pngs) {
            if ($png.Length -lt 14000) {throw "CONVERGENCE_DESIGN_BLANK_$($png.Name)"}
          }
          Get-Content $log -Tail 7
      - name: Preserve bounded Windows Qt design diagnostic only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-Convergence-QtDesign-Bounded-Windows
          path: ${{ runner.temp }}/m19m21-gui-design-bounded.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload 24 real QtQuick design screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-Convergence-24-QtQuick-Design-Screenshots
          path: ${{ runner.temp }}/m19m21-gui-design-shots/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Upload bounded Windows failure (no complete logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-M19-M21-UI-Bounded-Windows
          path: ${{ runner.temp }}/rgs-ui-bounded-failure.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: "Run actual QtQuick, typed UI, and M21 regression tests"
        shell: pwsh
        env:
          RGSML_TYPED_QT_SCREENSHOT_DIR: ${{ runner.temp }}/m19m21-typed-real-pcm-shots
        run: |
          $testlog = "$env:RUNNER_TEMP/rgs-ui-ctest.log"
          $bounded = "$env:RUNNER_TEMP/rgs-ui-test-bounded.txt"
          ctest --test-dir build/m21-ui-typed -C Release --output-on-failure -R '^(rgsml_m21_ui_readonly_projection_candidate_tests|rgsml_m21_real_product_metrics_port_tests|rgsml_m19_m21_typed_qml_convergence_tests)$' *> $testlog
          if ($LASTEXITCODE -ne 0) {
            Get-Content $testlog -Tail 55 | Set-Content $bounded
            throw 'UI_PROJECTION_WINDOWS_TESTS_FAILED'
          }
          Get-Content $testlog -Tail 7
      - name: Upload genuine typed real-PCM QtQuick screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-Convergence-Real-PCM-QtQuick-Screenshots
          path: ${{ runner.temp }}/m19m21-typed-real-pcm-shots/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Upload bounded Windows CTest failure only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-M19-M21-UI-CTest-Bounded-Windows
          path: ${{ runner.temp }}/rgs-ui-test-bounded.txt
          if-no-files-found: ignore
          retention-days: 7
