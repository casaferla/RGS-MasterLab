        run: |
          python tools/ci/summarize_focused_tests.py --ctest-dir build/windows-focused-debug-ui/Testing/Temporary --qt-smoke-log "$env:RUNNER_TEMP/rgsml-focused-debug-ui-smoke.txt" --output "$env:RUNNER_TEMP/rgsml-focused-debug-ui-smoke-bounded.txt"
          if ($LASTEXITCODE -ne 0) { throw 'FOCUSED_DEBUG_UI_SUMMARY_FAILED' }
      - name: Upload bounded Windows Debug UI Smoke assertions
        if: ${{ failure() && steps.focused_debug_ui_smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: RGS-Focused-Debug-UI-Errors-Windows-${{ github.run_number }}-${{ github.sha }}
