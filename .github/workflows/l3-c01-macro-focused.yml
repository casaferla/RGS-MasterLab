name: L3 C01 macro-lot focused gate (nonrelease)
on:
  push:
    branches:
      - staging/l3-m01-c01-focused-20261121
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Qt Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0" "py7zr==1.1.0"
          if ($LASTEXITCODE -ne 0) { throw 'L3_QT_DEP_FAILED' }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -m qtmultimedia
          if ($LASTEXITCODE -ne 0) { throw 'L3_QT_FAILED' }
      - name: Install Qt Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libegl1-mesa-dev libdbus-1-dev
          python3 -m pip install --disable-pip-version-check "aqtinstall==3.3.0" "py7zr==1.1.0"
          python3 -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 -m qtmultimedia
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Compile and test macro suite Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'l3-macro.log'
          cmake -S . -B build-l3 -G 'Visual Studio 17 2022' -A x64 -DRGSML_BUILD_TESTS=ON -DRGSML_WARNINGS_AS_ERRORS=ON "-DRGSML_QT_ROOT=$env:GITHUB_WORKSPACE/6.8.3/msvc2022_64" *> $log
          if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 70; throw 'L3_CONFIGURE_FAILED' }
          cmake --build build-l3 --config Release --parallel 4 --target rgsml_dsp_transient_shaper_c00_tests rgsml_dsp_transient_shaper_imodule_tests rgsml_l3_transient_shaper_product_tests rgsml_l3_m10_frozen_coordinate_refiner_tests rgsml_l3_m07_frozen_registry_tests rgsml_l3_m08_frozen_amount_tests rgsml_l3_m09_exact_candidate_dedup_tests rgsml_l3_m09_frozen_gaussian_grid_tests rgsml_l3_m09_p02_macro_reduction_tests rgsml_l3_m05m06_real_analysis_port_tests rgsml_basic_level_analyzer_tests rgsml_streamed_reference_analyzer_tests rgsml_dsp_dynamic_eq_parameters_tests rgsml_dsp_dynamic_eq_c01_coefficients_tests rgsml_dsp_dynamic_eq_c01_engine_tests rgsml_dsp_dynamic_eq_imodule_tests rgsml_dsp_dynamic_eq_static_equivalence_tests rgsml_dsp_dynamic_eq_perf_measure_tests rgsml_m21_real_product_metrics_port_tests rgsml_l3_dynamic_eq_canonical_render_tests rgsml_module_parameter_codec_tests rgsml_app *> $log
          if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 95; throw 'L3_BUILD_FAILED' }
          $env:PATH="$env:GITHUB_WORKSPACE/6.8.3/msvc2022_64/bin;$env:PATH"
          ctest --test-dir build-l3 -C Release --output-on-failure -V -R '^(rgsml_dsp_dynamic_eq_(parameters|c01_coefficients|c01_engine|imodule|static_equivalence|perf_measure)_tests|rgsml_m21_real_product_metrics_port_tests|rgsml_l3_dynamic_eq_canonical_render_tests|rgsml_module_parameter_codec_tests|rgsml_dsp_transient_shaper_c00_tests|rgsml_dsp_transient_shaper_imodule_tests|rgsml_l3_transient_shaper_product_tests|rgsml_l3_m10_frozen_coordinate_refiner_tests|rgsml_l3_m07_frozen_registry_tests|rgsml_l3_m08_frozen_amount_tests|rgsml_l3_m09_exact_candidate_dedup_tests|rgsml_l3_m09_frozen_gaussian_grid_tests|rgsml_l3_m09_p02_macro_reduction_tests|rgsml_l3_m05m06_real_analysis_port_tests|rgsml_basic_level_analyzer_tests|rgsml_streamed_reference_analyzer_tests)$' *> $log
          if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 220; throw 'L3_TEST_FAILED' }
          Get-Content $log -Tail 24
      - name: Compile and test macro suite Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S . -B build-l3 -G Ninja -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/6.8.3/gcc_64" -DRGSML_BUILD_TESTS=ON -DRGSML_WARNINGS_AS_ERRORS=ON > /tmp/l3-macro.log 2>&1 || { tail -n 70 /tmp/l3-macro.log; exit 1; }
          cmake --build build-l3 --parallel 4 --target rgsml_dsp_transient_shaper_c00_tests rgsml_dsp_transient_shaper_imodule_tests rgsml_l3_transient_shaper_product_tests rgsml_l3_m10_frozen_coordinate_refiner_tests rgsml_l3_m07_frozen_registry_tests rgsml_l3_m08_frozen_amount_tests rgsml_l3_m09_exact_candidate_dedup_tests rgsml_l3_m09_frozen_gaussian_grid_tests rgsml_l3_m09_p02_macro_reduction_tests rgsml_l3_m05m06_real_analysis_port_tests rgsml_basic_level_analyzer_tests rgsml_streamed_reference_analyzer_tests rgsml_dsp_dynamic_eq_parameters_tests rgsml_dsp_dynamic_eq_c01_coefficients_tests rgsml_dsp_dynamic_eq_c01_engine_tests rgsml_dsp_dynamic_eq_imodule_tests rgsml_dsp_dynamic_eq_static_equivalence_tests rgsml_dsp_dynamic_eq_perf_measure_tests rgsml_m21_real_product_metrics_port_tests rgsml_l3_dynamic_eq_canonical_render_tests rgsml_module_parameter_codec_tests > /tmp/l3-macro.log 2>&1 || { tail -n 95 /tmp/l3-macro.log; exit 1; }
          ctest --test-dir build-l3 --output-on-failure -V -R '^(rgsml_dsp_dynamic_eq_(parameters|c01_coefficients|c01_engine|imodule|static_equivalence|perf_measure)_tests|rgsml_m21_real_product_metrics_port_tests|rgsml_l3_dynamic_eq_canonical_render_tests|rgsml_module_parameter_codec_tests|rgsml_dsp_transient_shaper_c00_tests|rgsml_dsp_transient_shaper_imodule_tests|rgsml_l3_transient_shaper_product_tests|rgsml_l3_m10_frozen_coordinate_refiner_tests|rgsml_l3_m07_frozen_registry_tests|rgsml_l3_m08_frozen_amount_tests|rgsml_l3_m09_exact_candidate_dedup_tests|rgsml_l3_m09_frozen_gaussian_grid_tests|rgsml_l3_m09_p02_macro_reduction_tests|rgsml_l3_m05m06_real_analysis_port_tests|rgsml_basic_level_analyzer_tests|rgsml_streamed_reference_analyzer_tests)$' > /tmp/l3-macro.log 2>&1 || { tail -n 220 /tmp/l3-macro.log; exit 1; }
          tail -n 24 /tmp/l3-macro.log
