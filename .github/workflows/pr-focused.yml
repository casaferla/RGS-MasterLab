      - name: Upload bounded M17 block partition probe (Windows)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-M17-Partition-Windows-${{ github.run_number }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/rgs-m17-partition-windows.csv
          retention-days: 7
