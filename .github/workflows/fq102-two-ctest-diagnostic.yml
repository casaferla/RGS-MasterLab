name: FQ102 exact two-test diagnostic (NON-FQ)
on:
  push:
    branches:
      - diagnostic/fq102-two-ctest-20261121
permissions:
  contents: read
jobs:
  windows-exact-two-test:
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install FQ-identical Qt 6.8.3
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0" "py7zr==1.1.0"
          if ($LASTEXITCODE -ne 0) { throw "FQ102_DIAG_DEPENDENCY_INSTALL_FAILED" }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -m qtmultimedia
          if ($LASTEXITCODE -ne 0) { throw "FQ102_DIAG_QT_INSTALL_FAILED" }
      - name: Configure native Debug target using canonical VS compiler
        shell: pwsh
        run: |
          $qt=Join-Path $env:GITHUB_WORKSPACE "6.8.3/msvc2022_64"
          $log=Join-Path $env:RUNNER_TEMP "fq102-diag-configure.txt"
          cmake -S . -B build/fq102-diag -G "Visual Studio 17 2022" -A x64 `
            -DRGSML_BUILD_TESTS=ON -DRGSML_WARNINGS_AS_ERRORS=ON `
            -DRGSML_PROVENANCE_TYPE=CI `
            "-DRGSML_QT_ROOT=$qt" *> $log
          if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 55; throw "FQ102_DIAG_CONFIGURE_FAILED" }
      - name: Compile only two FQ failed native test targets
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP "fq102-diag-build.txt"
          cmake --build build/fq102-diag --config Debug --parallel 4 --target `
            rgsml_terminal_product_activation_tests rgsml_mastering_chain_state_tests *> $log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path $log -Pattern 'error C[0-9]+','error LNK[0-9]+','fatal error','FAILED:' |
              Select-Object -First 25 | ForEach-Object { Write-Host $_.Line.Substring(0,[Math]::Min(260,$_.Line.Length)) }
            Get-Content $log -Tail 12
            throw "FQ102_DIAG_BUILD_FAILED"
          }
          Write-Host "FQ102_DIAG_DEBUG_BUILD=PASS"
      - name: Run QtTest with explicit output files and publish bounded assertions
        shell: pwsh
        run: |
          $qt=Join-Path $env:GITHUB_WORKSPACE "6.8.3/msvc2022_64"
          $env:PATH="$qt/bin;$env:PATH"
          $summary=Join-Path $env:RUNNER_TEMP "fq102-two-test-assertions.txt"
          "FQ102 two-test diagnostic; exact production source baseline: 1e4f1fc3d5403fb0c62648393c16ee1e02cb2692" | Set-Content $summary
          $failed=0
          $cases=@(
            @{name="rgsml_terminal_product_activation_tests";dir="build/fq102-diag";exe="Debug/rgsml_terminal_product_activation_tests.exe"},
            @{name="rgsml_mastering_chain_state_tests";dir="build/fq102-diag/tests";exe="Debug/rgsml_mastering_chain_state_tests.exe"}
          )
          foreach ($case in $cases) {
            $dir=Join-Path $env:GITHUB_WORKSPACE $case.dir
            $exe=Join-Path $dir $case.exe
            $out=Join-Path $env:RUNNER_TEMP ($case.name+".txt")
            Add-Content $summary ("BEGIN "+$case.name)
            Push-Location $dir
            try {
              & $exe -o "$out,txt"
              $code=$LASTEXITCODE
            } finally { Pop-Location }
            if ($code -ne 0) { $failed++ }
            Add-Content $summary ("EXIT="+$code)
            if (Test-Path $out) {
              $data=Get-Content $out
              Add-Content $summary ("QT_TEST_LOG_LINES="+$data.Count)
              $matches=@(Select-String -Path $out -Pattern 'FAIL!','QFATAL','ASSERT','Fatal error','Totals:','XPASS','XFAIL','SKIP' -Context 1,5 | Select-Object -First 20)
              foreach ($hit in $matches) {
                $slice=@($hit.Context.PreContext) + @($hit.Line) + @($hit.Context.PostContext)
                foreach ($line in $slice) { Add-Content $summary $line.Substring(0,[Math]::Min(250,$line.Length)) }
              }
              if($matches.Count -eq 0) { Add-Content $summary "NO_QT_FAIL_MARKER" }
            } else { Add-Content $summary "NO_QT_LOG_FILE" }
            Add-Content $summary ("END "+$case.name)
          }
          Get-Content $summary | Select-Object -First 115
          if ($failed -ne 0) { throw "FQ102_DIAG_NATIVE_TESTS_FAILED_COUNT=$failed" }
      - name: Upload bounded two-test assertions only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-FQ102-Two-Test-Bounded
          path: ${{ runner.temp }}/fq102-two-test-assertions.txt
          if-no-files-found: warn
