name: M23 Evidence + Real Failure Matrix (nonrelease)
on:
  push:
    branches:
      - staging/m23-failure-matrix-focused-ci-20261108
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m23-evidence-single-candidate-20261108
  cancel-in-progress: false
jobs:
  linux-reconciliation:
    name: Linux - M23 source/gap audit and real portable CTest
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: M23 nonrelease selftest and 20-category source inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qualification/m23/test_audit_failure_matrix.py >"$RUNNER_TEMP/m23-static.log" 2>&1 || {
            tail -n 45 "$RUNNER_TEMP/m23-static.log" | tee "$RUNNER_TEMP/m23-failure-bounded.txt"
            exit 1
          }
          if ! python3 tools/qualification/m19_m21_gui/test_product_navigation_guards.py >>"$RUNNER_TEMP/m23-static.log" 2>&1; then
            tail -n 45 "$RUNNER_TEMP/m23-static.log" >"$RUNNER_TEMP/m23-failure-bounded.txt"
            exit 1
          fi
          if ! python3 tools/qualification/m23/guard_fq99_frozen_gui.py >>"$RUNNER_TEMP/m23-static.log" 2>&1; then
            tail -n 45 "$RUNNER_TEMP/m23-static.log" >"$RUNNER_TEMP/m23-failure-bounded.txt"
            exit 1
          fi
          tail -n 5 "$RUNNER_TEMP/m23-static.log"
      - name: FQ98 regression - compile and execute relocated M22 disk export harness on Linux
        shell: bash
        run: |
          set -euo pipefail
          if ! g++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror -fno-fast-math -ffp-contract=off -Irender/src/internal -Iaudio/src -Icore/include tools/qualification/m22/m22_real_m18_wav_export_selftest.cpp core/src/sha256.cpp -o "$RUNNER_TEMP/m23-m22-disk" >"$RUNNER_TEMP/m23-m22-disk.log" 2>&1; then
            tail -n 45 "$RUNNER_TEMP/m23-m22-disk.log" >"$RUNNER_TEMP/m23-failure-bounded.txt"
            exit 1
          fi
          if ! "$RUNNER_TEMP/m23-m22-disk" >"$RUNNER_TEMP/m23-m22-disk.log" 2>&1; then
            tail -n 45 "$RUNNER_TEMP/m23-m22-disk.log" >"$RUNNER_TEMP/m23-failure-bounded.txt"
            exit 1
          fi
          tail -n 3 "$RUNNER_TEMP/m23-m22-disk.log"
      - name: Install Qt 6.8.3 for real CTest
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libegl1-mesa-dev libdbus-1-dev
          python3 -m pip install --disable-pip-version-check "aqtinstall==3.3.0" "py7zr==1.1.0"
          python3 -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 -m qtmultimedia
      - name: Build exact existing render/project M23 evidence suites
        shell: bash
        run: |
          set -euo pipefail
          if ! cmake -S . -B build/m23-native -G Ninja -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/6.8.3/gcc_64" -DRGSML_BUILD_TESTS=ON -DRGSML_WARNINGS_AS_ERRORS=ON >"$RUNNER_TEMP/m23-cmake.log" 2>&1; then
            tail -n 55 "$RUNNER_TEMP/m23-cmake.log" >"$RUNNER_TEMP/m23-failure-bounded.txt"
            exit 1
          fi
          # rgsml_app + UI smoke link native Win32 rgsml_platform. On Linux
          # compile and execute only genuine portable suites, never fake them.
          if ! cmake --build build/m23-native --parallel 4 --target rgsml_audio_wav_writer_tests rgsml_render_preview_tests rgsml_project_package_tests rgsml_project_json_tests rgsml_m23_alpha_diagnostic_tests rgsml_dsp_module_adapter_tests >"$RUNNER_TEMP/m23-build.log" 2>&1; then
            tail -n 65 "$RUNNER_TEMP/m23-build.log" >"$RUNNER_TEMP/m23-failure-bounded.txt"
            exit 1
          fi
          tail -n 5 "$RUNNER_TEMP/m23-build.log"
      - name: Execute actual Qt M23 partial evidence and bind CTest JUnit
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          set -euo pipefail
          if ! ctest --test-dir build/m23-native --output-on-failure --output-junit "$RUNNER_TEMP/m23-ctest-linux.xml" -R '^(rgsml_audio_wav_writer_tests|rgsml_render_preview_tests|rgsml_project_package_tests|rgsml_project_json_tests|rgsml_m23_alpha_diagnostic_tests|render_forbidden_public_contract|rgsml_dsp_module_adapter_tests)$' >"$RUNNER_TEMP/m23-ctest.log" 2>&1; then
            tail -n 55 "$RUNNER_TEMP/m23-ctest.log" >"$RUNNER_TEMP/m23-failure-bounded.txt"
            exit 1
          fi
          python3 tools/qualification/m23/audit_failure_matrix.py --platform linux --expected-source-sha "$GITHUB_SHA" --require-existing-executed --junit "$RUNNER_TEMP/m23-ctest-linux.xml" --out "$RUNNER_TEMP/m23-receipt-linux.json" >"$RUNNER_TEMP/m23-audit.log" 2>&1 || {
            tail -n 55 "$RUNNER_TEMP/m23-audit.log" >"$RUNNER_TEMP/m23-failure-bounded.txt"
            exit 1
          }
          tail -n 8 "$RUNNER_TEMP/m23-ctest.log"
          python3 -c "import json,os;d=json.load(open(os.environ['RUNNER_TEMP']+'/m23-receipt-linux.json'));assert d['status']=='RECONCILED_NOT_FOR_RELEASE' and d['m23_closed'] is False and not d['unresolved_categories'] and d['exact_source_sha_verified'] is True and d['exact_source_sha']==os.environ['GITHUB_SHA'] and all(not c['qualified'] for c in d['cases'])"
      - name: Publish bounded M23 Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-M23-Bounded-Linux
          path: |
            ${{ runner.temp }}/m23-receipt-linux.json
            ${{ runner.temp }}/m23-failure-bounded.txt
          if-no-files-found: ignore
          retention-days: 7
  windows-reconciliation:
    name: Windows - M23 true file faults, alias, epoch and persistence
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: M23 source-contract selftest before Qt
        shell: pwsh
        run: |
          python tools/qualification/m23/test_audit_failure_matrix.py *> "$env:RUNNER_TEMP/m23-static.log"
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:RUNNER_TEMP/m23-static.log" -Tail 45 | Set-Content "$env:RUNNER_TEMP/m23-failure-bounded.txt"
            throw 'M23_FAILURE_MATRIX_SELFTEST_FAILED'
          }
          python tools/qualification/m19_m21_gui/test_product_navigation_guards.py *>> "$env:RUNNER_TEMP/m23-static.log"
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:RUNNER_TEMP/m23-static.log" -Tail 45 | Set-Content "$env:RUNNER_TEMP/m23-failure-bounded.txt"
            throw 'M19_M21_PRODUCT_NAVIGATION_GUARD_FAILED'
          }
          python tools/qualification/m23/guard_fq99_frozen_gui.py *>> "$env:RUNNER_TEMP/m23-static.log"
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:RUNNER_TEMP/m23-static.log" -Tail 45 | Set-Content "$env:RUNNER_TEMP/m23-failure-bounded.txt"
            throw 'FQ99_QUALIFIED_GUI_MODIFIED'
          }
          Get-Content "$env:RUNNER_TEMP/m23-static.log" -Tail 5
      - name: FQ98 regression - compile and execute relocated M22 disk export harness on Windows
        shell: pwsh
        run: |
          & cl.exe /nologo /std:c++20 /EHsc /O2 /W4 /WX /fp:strict /Zc:__cplusplus /Irender/src/internal /Iaudio/src /Icore/include tools/qualification/m22/m22_real_m18_wav_export_selftest.cpp core/src/sha256.cpp "/Fe:$env:RUNNER_TEMP/m23-m22-disk.exe" *> "$env:RUNNER_TEMP/m23-m22-disk.log"
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:RUNNER_TEMP/m23-m22-disk.log" -Tail 45 | Set-Content "$env:RUNNER_TEMP/m23-failure-bounded.txt"
            throw 'M23_RELOCATED_M22_DISK_BUILD_FAILED'
          }
          & "$env:RUNNER_TEMP/m23-m22-disk.exe" *> "$env:RUNNER_TEMP/m23-m22-disk.log"
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:RUNNER_TEMP/m23-m22-disk.log" -Tail 45 | Set-Content "$env:RUNNER_TEMP/m23-failure-bounded.txt"
            throw 'M23_RELOCATED_M22_DISK_RUN_FAILED'
          }
          Get-Content "$env:RUNNER_TEMP/m23-m22-disk.log" -Tail 3
      - name: Install native Qt 6.8.3 MSVC
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0" "py7zr==1.1.0" ninja
          if ($LASTEXITCODE -ne 0) { throw 'M23_DEPENDENCIES_FAILED' }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -m qtmultimedia
          if ($LASTEXITCODE -ne 0) { throw 'M23_QT_FAILED' }
      - name: Build genuine Windows export, readback, project and render fault suites
        shell: pwsh
        run: |
          $qtRoot = "$env:GITHUB_WORKSPACE/6.8.3/msvc2022_64"
          cmake -S . -B build/m23-native -G "Ninja Multi-Config" -DCMAKE_CONFIGURATION_TYPES=Release -DRGSML_BUILD_TESTS=ON -DRGSML_WARNINGS_AS_ERRORS=ON "-DRGSML_QT_ROOT=$qtRoot" *> "$env:RUNNER_TEMP/m23-cmake.log"
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:RUNNER_TEMP/m23-cmake.log" -Tail 55 | Set-Content "$env:RUNNER_TEMP/m23-failure-bounded.txt"
            throw 'M23_CONFIGURE_FAILED'
          }
          cmake --build build/m23-native --config Release --parallel 4 --target rgsml_audio_wav_writer_tests rgsml_transactional_audio_export_tests rgsml_m18_windows_candidate_delivery_tests rgsml_project_session_tests rgsml_project_package_tests rgsml_project_json_tests rgsml_render_preview_tests rgsml_m23_alpha_diagnostic_tests rgsml_app rgsml_dsp_module_adapter_tests rgsml_source_metadata_panel_smoke *> "$env:RUNNER_TEMP/m23-build.log"
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:RUNNER_TEMP/m23-build.log" -Tail 65 | Set-Content "$env:RUNNER_TEMP/m23-failure-bounded.txt"
            throw 'M23_BUILD_FAILED'
          }
          Get-Content "$env:RUNNER_TEMP/m23-build.log" -Tail 5
      - name: Controlled FQ99/candidate native Qt GUI A1/A2/B1/B2 matrix (diagnostic, nonrelease)
        shell: pwsh
        run: |
          # Critical: ALL arms run the FULL Qt smoke with the SAME -v2/-o
          # args and a fresh process. Only revision and screenshot variable
          # change. No production QML, layout hint or CTest assertion altered.
          $qtRoot="$env:GITHUB_WORKSPACE/6.8.3/msvc2022_64"
          & pwsh -NoProfile -File tools/qualification/m23/probe_fq99_candidate_controlled_matrix.ps1 -QtRoot $qtRoot -BoundedReceipt "$env:RUNNER_TEMP/m23-controlled-matrix.txt"
          if ($LASTEXITCODE -ne 0) {
            Add-Content "$env:RUNNER_TEMP/m23-controlled-matrix.txt" "MATRIX_PROBE=INCONCLUSIVE_SCRIPT_EXIT_$LASTEXITCODE"
          }
          # Diagnostic does not substitute for the strict CTest gate below.
          if (Test-Path "$env:RUNNER_TEMP/m23-controlled-matrix.txt") {
            Get-Content "$env:RUNNER_TEMP/m23-controlled-matrix.txt" -Tail 18
          }
      - name: Execute real Qt fault suites with machine-readable M23 receipt
        shell: pwsh
        run: |
          # The FQ99-qualified Windows Qt smoke runs on the native Windows
          # QPA/render backend, with this Qt DLL/QML search path. The prior
          # offscreen+software override used a DIFFERENT layout engine and
          # must not drive regressions in FQ-qualified production DSP editors.
          # Keep the exact real CTest inventory, assertion count and JUnit
          # receipt; remove only the noncanonical QPA/backend overrides.
          $qtRoot="$env:GITHUB_WORKSPACE/6.8.3/msvc2022_64"
          $env:PATH="$qtRoot/bin;$env:PATH"
          $env:QML2_IMPORT_PATH="$qtRoot/qml"
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QUICK_BACKEND -ErrorAction SilentlyContinue
          ctest --test-dir build/m23-native -C Release --output-on-failure --output-junit "$env:RUNNER_TEMP/m23-ctest-windows.xml" -R '^(rgsml_audio_wav_writer_tests|rgsml_transactional_audio_export_tests|rgsml_m18_windows_candidate_delivery_tests|rgsml_project_session_tests|rgsml_project_package_tests|rgsml_project_json_tests|rgsml_render_preview_tests|rgsml_m23_alpha_diagnostic_tests|render_forbidden_public_contract|rgsml_dsp_module_adapter_tests|rgsml_source_metadata_panel_smoke)$' *> "$env:RUNNER_TEMP/m23-ctest.log"
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:RUNNER_TEMP/m23-ctest.log" -Tail 60 | Set-Content "$env:RUNNER_TEMP/m23-failure-bounded.txt"
            # The Qt wrapper emits bounded QT_LINE_* failure neighborhoods;
            # preserve the lines AFTER FAIL! (actual/expected/source) too.
            # Do not archive or download the complete verbose Qt log.
            Get-Content "$env:RUNNER_TEMP/m23-ctest.log" |
              Select-String -Pattern 'QT_LINE_[0-9]+: FAIL!' -Context 2,14 |
              Select-Object -First 12 | Out-String -Width 240 |
              Add-Content "$env:RUNNER_TEMP/m23-failure-bounded.txt"
            # The old one-case/screenshots-on A/B was NOT controlled.
            # Retain real candidate failure; controlled matrix has its
            # separate bounded artifact and cannot greenwash this gate.
            throw 'M23_REAL_FAULT_CTEST_FAILED'
          }
          python tools/qualification/m23/audit_failure_matrix.py --platform windows --expected-source-sha "$env:GITHUB_SHA" --require-existing-executed --junit "$env:RUNNER_TEMP/m23-ctest-windows.xml" --out "$env:RUNNER_TEMP/m23-receipt-windows.json" *> "$env:RUNNER_TEMP/m23-audit.log"
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$env:RUNNER_TEMP/m23-audit.log" -Tail 55 | Set-Content "$env:RUNNER_TEMP/m23-failure-bounded.txt"
            throw 'M23_EVIDENCE_CONTRACT_FAILED'
          }
          $report=Get-Content "$env:RUNNER_TEMP/m23-receipt-windows.json" -Raw | ConvertFrom-Json
          if ($report.m23_closed -ne $false -or $report.release_qualified -ne $false -or @($report.unresolved_categories).Count -ne 0 -or $report.exact_source_sha_verified -ne $true -or $report.exact_source_sha -ne $env:GITHUB_SHA) {
            throw 'M23_FOCUSED_CI_CANNOT_SELF_CERTIFY_GATE'
          }
          Get-Content "$env:RUNNER_TEMP/m23-ctest.log" -Tail 8
      - name: Publish bounded M23 Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-M23-Bounded-Windows
          path: |
            ${{ runner.temp }}/m23-receipt-windows.json
            ${{ runner.temp }}/m23-failure-bounded.txt
            ${{ runner.temp }}/m23-controlled-matrix.txt
          if-no-files-found: ignore
          retention-days: 7
