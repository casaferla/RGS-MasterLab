name: M20 Qt Screenshot Evidence (Isolated)
on:
  push:
    branches:
      - evidence/m20-qt-screenshot-20261103
    paths:
      - 'tools/qualification/m20/qt_preview/**'
      - '.github/workflows/m20-qt-screenshot-evidence.yml'
permissions:
  contents: read
jobs:
  screenshot-windows:
    runs-on: windows-2022
    name: Genuine M20 original Qt QML capture · Windows
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Qt 6.8.3
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0" "py7zr==1.1.0" ninja
          if ($LASTEXITCODE -ne 0) { throw "M20_EVIDENCE_PIP" }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O "$env:RUNNER_TEMP/m20qt"
          if ($LASTEXITCODE -ne 0) { throw "M20_EVIDENCE_QT" }
      - name: Run actual M20 QML smoke and save screenshot
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
          M20_SCREENSHOT_PATH: ${{ runner.temp }}/m20-original-windows-qt-demo.png
        run: |
          cmake -S tools/qualification/m20/qt_preview -B "$env:RUNNER_TEMP/m20-qt-build" -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:RUNNER_TEMP/m20qt/6.8.3/msvc2022_64"
          if ($LASTEXITCODE -ne 0) { throw "M20_EVIDENCE_CMAKE" }
          cmake --build "$env:RUNNER_TEMP/m20-qt-build" --config Release --parallel 3
          if ($LASTEXITCODE -ne 0) { throw "M20_EVIDENCE_COMPILE" }
          $env:PATH = "$env:RUNNER_TEMP/m20qt/6.8.3/msvc2022_64/bin;$env:PATH"
          & "$env:RUNNER_TEMP/m20-qt-build/m20_qt_preview_smoke.exe"
          if ($LASTEXITCODE -ne 0) { throw "M20_EVIDENCE_QML_CAPTURE" }
      - name: Archive genuine Windows Qt QML PNG
        uses: actions/upload-artifact@v4
        with:
          name: M20-original-QML-Windows-Qt-Demo
          path: ${{ runner.temp }}/m20-original-windows-qt-demo.png
          if-no-files-found: error
          retention-days: 14
