name: PR Focused CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-portable-dsp:
    name: Linux Portable DSP Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head (B2b qualification provenance)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Phase-11 exact Q0 mathematics; does not assert MPFR assets, Q1-Q6
      # spectral qualification or release readiness. No Qt/MPFR required.
      - name: Phase-11 Final SRC exact Q0 preflight (Linux)
        run: |
          python tools/qualification/final_src/test_phase11_math_preflight.py
          python tools/qualification/final_src/phase3_exact_model_q0_nonrelease.py

      # Independent conceptual zero-stuffed exact-dyadic reference checks;
      # NOT the full MPFR spectral oracle or release qualification.
      - name: Phase-11 Final SRC exact dyadic + strict-scalar independent oracles (Linux)
        run: |
          python tools/qualification/final_src/test_exact_dyadic_zero_stuff_oracle.py
          python tools/qualification/final_src/test_strict_scalar_polyphase_reference.py

      # Offline all-14 candidate-asset assembly is too expensive for every
      # Focused run; fast synthetic tests cover atomicity and fail-closed.
      - name: Phase-11 Final SRC candidate manifest atomicity (Linux)
        run: |
          python tools/qualification/final_src/test_build_candidate_manifest.py
          # Synthetic checkpoints only; exercises resumable two-run work
          # recovery and no-release all-14 atomic finalization, NOT MPFR proof.
          python tools/qualification/final_src/test_build_resumable_real_candidates.py
          # Audited CI-to-offline-workstation Q0 artifact import: all four
          # hashes/receipts/real-ratio geometries are checked before a
          # resumable checkpoint can be seeded. These lifecycle fixtures
          # are SYNTHETIC; do not imply an all-14 genuine campaign ran.
          python tools/qualification/final_src/test_import_audited_ci_q0_checkpoints.py
          # Strict lifecycle of one resumable Q0 campaign using four
          # audited CI seeds and ten missing ratios. SYNTHETIC orchestration
          # checks only; expensive MPFR all-14 stays offline/on workstation.
          python tools/qualification/final_src/test_run_offline_all14_q0_campaign.py
          # Read-only 14-ratio checkpoint inventory and original 4 CI pins.
          # Synthetic fast tests only; never assume real remaining 10 ran.
          python tools/qualification/final_src/test_audit_q0_checkpoint_progress.py
          # Fail closed on syntax errors in the real-archive-to-native-Q1
          # handoff tool; no expensive 14-asset payload in Focused CI.
          python -m py_compile tools/qualification/final_src/prepare_real_q1_36_native_rehearsal.py
          python -m py_compile tools/qualification/final_src/run_native_q1_36_real_offline.py
          python tools/qualification/final_src/test_run_native_q1_36_real_offline.py
          # Static regression for the actual optional Qt method: one Q0 folder,
          # one SHA-pinned Q1 folder, no obsolete second env/QSKIP shortcut.
          python tools/qualification/final_src/test_native_q1_36_fixture_contract.py
          python tools/qualification/final_src/test_run_four_genuine_q0_native_ci.py
          python -m py_compile tools/qualification/final_src/run_four_genuine_q0_native_ci.py
          python -m py_compile tools/qualification/final_src/qualify_q2_real_36_partition_rehearsal.py
          # Private Work Phase3 ZIP is NOT in CI: bounded synthetic NONRELEASE tests.
          python -m py_compile tools/qualification/final_src/audit_work_phase3_handoff_nonrelease.py
          python tools/qualification/final_src/test_audit_work_phase3_handoff_nonrelease.py
          python tools/qualification/final_src/test_audit_work_phase3_frozen_math_nonrelease.py

      # Independent high-precision numeric crosscheck and sampled FFT
      # NEGATIVE SCREEN on a GENUINE MPFR candidate; Python tools only.
      # No new product/runtime dependency or Windows build stage.
      - name: Install independent SRC numerical screening (Linux)
        run: python -m pip install --disable-pip-version-check mpmath==1.3.0 numpy==2.3.5

      # Complete PRIVATE 14/36 asset ZIPs are never installed on routine
      # public PR CI. This tests atomic fail-closed control flow and
      # enforces the native 15-alias named method contract, NOT full Q1.
      - name: Phase-11 genuine private bulk Q1 Q2 alias atomic-negative tests (Linux)
        run: |
          python -m py_compile tools/qualification/final_src/run_phase11_private_m17_bulk_gate.py
          python tools/qualification/final_src/test_run_phase11_private_m17_bulk_gate.py


      # Small Q0 canary: directed MPFR intervals + TWO complete 1025-tap
      # RGSMSR1 reproductions; not a 14-asset release qualification.
      # Linux only to avoid adding another expensive Windows build stage.
      - name: Phase-11 Final SRC MPFR exact-zero and reproducibility canary (Linux)
        env:
          RGSML_MPFR_FULL_SRC_SMOKE: "1"
          # Reuses the genuine MPFR twice-generated kernel + independent
          # Python strict-scalar oracle in later native C++ full-resource test.
          # Ephemeral test fixture only, NEVER a released asset/manifest.
          RGSML_PHASE11_REAL_CANARY_OUT: ${{ runner.temp }}/rgsml-phase11-real-mpfr-48to96.bin
          RGSML_PHASE11_CANDIDATE_PR_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/qualification/final_src/test_phase11_mpfr_ziv.py

      # Preserve REAL twice-reproduced MPFR/Ziv candidate plus verified
      # 2^20 sampled FFT screens of canonical+alias SRC and exact-rational
      # DC/Nyquist anchors in the Q0 receipt (NOT certified continuum DTFT).
      # Python strict-scalar expected PCM bytes also included for C++ test.
      # NONRELEASE Q0 diagnostic only: no frozen SHA authority, DTFT or Q1-Q6.
      # Keeps artifacts out of the product/repository assets and cannot
      # affect M17 admission by itself.
      - name: Retain genuine Phase-11 ratio-2-to-1 MPFR candidate evidence (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: RGS-Phase11-REAL-Q0-2to1-NONRELEASE-${{ github.run_number }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/rgsml-phase11-real-mpfr-48to96.bin
            ${{ runner.temp }}/rgsml-phase11-real-mpfr-48to96.bin.expected.f64le
            ${{ runner.temp }}/rgsml-phase11-real-mpfr-48to96.bin.receipt.json
          retention-days: 30
          if-no-files-found: error

      # Second GENUINE reduced-ratio candidate, now exercising DOWNsampling
      # L/M=1/2, with two actual directed-MPFR/Ziv reproductions and an
      # independently implemented high precision Python oracle.
      # The candidate is never installed or authorized in product M17.
      - name: Phase-11 REAL 1-to-2 MPFR downsample canary (Linux)
        env:
          RGSML_MPFR_FULL_SRC_SMOKE: "1"
          RGSML_PHASE11_REAL_DOWNSAMPLE_OUT: ${{ runner.temp }}/rgsml-phase11-real-mpfr-88kto44k.bin
          RGSML_PHASE11_CANDIDATE_PR_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/qualification/final_src/test_phase11_real_downsample_canary.py

      - name: Retain genuine Phase-11 ratio-1-to-2 MPFR candidate evidence (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: RGS-Phase11-REAL-Q0-1to2-NONRELEASE-${{ github.run_number }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/rgsml-phase11-real-mpfr-88kto44k.bin
            ${{ runner.temp }}/rgsml-phase11-real-mpfr-88kto44k.bin.expected.f64le
            ${{ runner.temp }}/rgsml-phase11-real-mpfr-88kto44k.bin.receipt.json
          retention-days: 30
          if-no-files-found: error

      # Two additional distinct REAL MPFR/Ziv reduced ratios, L/M=1/4 and
      # 4/1, jointly generated twice and independently screened before
      # writing ephemeral fixtures. These are Q0 candidates, NOT product FIRs.
      - name: Phase-11 REAL 1-to-4 and 4-to-1 MPFR candidates (Linux)
        env:
          RGSML_MPFR_FULL_SRC_SMOKE: "1"
          RGSML_PHASE11_REAL_POW4_OUT_DIR: ${{ runner.temp }}/rgsml-phase11-real-pow4
          RGSML_PHASE11_CANDIDATE_PR_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/qualification/final_src/test_phase11_real_fourfold_canary.py

      - name: Retain genuine Phase-11 fourfold MPFR Q0 candidate evidence (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: RGS-Phase11-REAL-Q0-FOURFOLD-NONRELEASE-${{ github.run_number }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/rgsml-phase11-real-pow4/ratio_L1_M4.bin
            ${{ runner.temp }}/rgsml-phase11-real-pow4/ratio_L1_M4.bin.expected.f64le
            ${{ runner.temp }}/rgsml-phase11-real-pow4/ratio_L1_M4.bin.receipt.json
            ${{ runner.temp }}/rgsml-phase11-real-pow4/ratio_L4_M1.bin
            ${{ runner.temp }}/rgsml-phase11-real-pow4/ratio_L4_M1.bin.expected.f64le
            ${{ runner.temp }}/rgsml-phase11-real-pow4/ratio_L4_M1.bin.receipt.json
          retention-days: 30
          if-no-files-found: error

      # Sound interval coverage of continuous frequency BOXES (not mere FFT
      # samples). This fast synthetic proof harness is NOT a 14-kernel
      # continuum certificate, Q1-Q6 approval, or product SRC admission.
      # The complete 15 downsample alias probe numerical screen is run
      # offline with private 14 Q0 assets. Focused tests only adversarial
      # fail-closed behavior and ONE authentic SHA-pinned downsampling kernel;
      # never claim all 15 or continuous stopband from Focused CI.
      - name: Phase-11 genuine 1-to-2 and adversarial alias probe screen (Linux)
        env:
          RGSML_PHASE11_REAL_DOWNSAMPLE_PATH: ${{ runner.temp }}/rgsml-phase11-real-mpfr-88kto44k.bin
        run: python tools/qualification/final_src/test_screen_real_15_downsample_alias_probe.py

      - name: Phase-11 Final SRC MPFR DTFT interval proof precursor (Linux)
        run: |
          python tools/qualification/final_src/test_mpfr_dtft_interval_preflight.py
          python tools/qualification/final_src/test_screen_real_candidate_family_dtft.py
          # Second-order MPFR continuum proof harness: exact binary64 taps,
          # directed slope and exact rational curvature; NEVER full-band Q0.
          python tools/qualification/final_src/test_dtft_second_order_rigorous.py
          python tools/qualification/final_src/dtft_second_order_rigorous.py ${{ runner.temp }}/rgsml-phase11-real-mpfr-48to96.bin \
            --fin 48000 --fout 96000 \
            --pinned-sha256 6fb38a7d62859283e4061a18d23f354a8308d5b22ff55623e8b1c9a245e8b00c \
            --lo 3000 --hi 3001 --kind passband --max-boxes 32 \
            --report ${{ github.workspace }}/rgsml-phase11-real-q0-mpfr-subband-pass.json
          python tools/qualification/final_src/dtft_second_order_rigorous.py ${{ runner.temp }}/rgsml-phase11-real-mpfr-48to96.bin \
            --fin 48000 --fout 96000 \
            --pinned-sha256 6fb38a7d62859283e4061a18d23f354a8308d5b22ff55623e8b1c9a245e8b00c \
            --lo 34000 --hi 34001 --kind stopband --max-boxes 256 \
            --report ${{ github.workspace }}/rgsml-phase11-real-q0-mpfr-subband-stop.json
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          root = Path(os.environ['GITHUB_WORKSPACE'])
          for band in ('pass', 'stop'):
              p = root / f'rgsml-phase11-real-q0-mpfr-subband-{band}.json'
              v = json.loads(p.read_text())
              assert v['status'] == 'CONTINUUM_SUBBAND_PROVEN_NONRELEASE'
              assert v['remaining_boxes'] == 0
              assert v['full_passband_and_stopband_proven'] is False
              assert v['product_admission_authorized'] is False
          PY
          # Reuse every genuine Q0 canary already generated in this job:
          # the other three real ratios and eight 1-Hz continuous subbands.
          # A skipped/missing/falsely hashed asset is a hard CI FAILURE.
          python tools/qualification/final_src/prove_original_four_mpfr_subbands.py \
            --two ${{ runner.temp }}/rgsml-phase11-real-mpfr-48to96.bin \
            --one ${{ runner.temp }}/rgsml-phase11-real-mpfr-88kto44k.bin \
            --fourfold-dir ${{ runner.temp }}/rgsml-phase11-real-pow4 \
            --report ${{ runner.temp }}/rgsml-phase11-original-four-8subbands-NONRELEASE.json

      # Keep existing 2nd-order/4-original CI gate intact. Break the NEW
      # 3rd-order stage into independently named steps: no whole job log
      # download needed to diagnose Python/unit vs genuine/MPFR vs assertion.
      - name: Phase-11 MPFR third-order adversarial unit proof (Linux)
        run: |
          set -o pipefail
          python tools/qualification/final_src/test_dtft_third_order_rigorous.py 2>&1 | tail -n 32

      # Synthetic checkpoint adversarial tests only; the full 14-asset
      # interval campaign stays private/offline, NOT per-PR Focused CI.
      - name: Phase-11 MPFR resumable 14-ratio checkpoint regression (Linux)
        run: |
          set -o pipefail
          python tools/qualification/final_src/test_run_resumable_14_mpfr_continuum.py 2>&1 | tail -n 32

      - name: Phase-11 MPFR real14 private checkpoint transport regression (Linux)
        run: |
          set -o pipefail
          python tools/qualification/final_src/test_archive_real14_mpfr_continuum_checkpoints.py 2>&1 | tail -n 32

      - name: Phase-11 MPFR third-order real 20Hz continuum proof (Linux)
        run: |
          set -o pipefail
          python tools/qualification/final_src/dtft_third_order_rigorous.py ${{ runner.temp }}/rgsml-phase11-real-mpfr-48to96.bin \
            --fin 48000 --fout 96000 \
            --pinned-sha256 6fb38a7d62859283e4061a18d23f354a8308d5b22ff55623e8b1c9a245e8b00c \
            --lo 34000 --hi 34020 --kind stopband --max-boxes 128 \
            --report ${{ github.workspace }}/rgsml-phase11-mpfr-thirdorder-real-20hz-stop-NONRELEASE.json 2>&1 | tail -n 32

      - name: Phase-11 MPFR third-order honest nonrelease result (Linux)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import os
          x=json.loads((Path(os.environ["GITHUB_WORKSPACE"])/"rgsml-phase11-mpfr-thirdorder-real-20hz-stop-NONRELEASE.json").read_text())
          assert x["status"] == "CONTINUUM_SUBBAND_PROVEN_NONRELEASE"
          assert x["visited_boxes"] > 0 and x["remaining_boxes"] == 0
          assert x["hi_hz"] == "34020" and x["lo_hz"] == "34000"
          assert x["full_passband_and_stopband_proven"] is False
          assert x["q1_q6_passed"] is False
          assert x["release_qualified"] is False
          assert x["product_admission_authorized"] is False
          PY

      # Exact Python MPFR toolkit archived once per immutable CI SHA:
      # enables an offline all-14 campaign using the same tested source,
      # without repeatedly generating all kernels in Focused CI. Python
      # scripts are qualification tooling, never product runtime assets.
      - name: Retain Phase-11 offline MPFR Q0 workstation toolkit (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: RGS-Phase11-Q0-TOOLKIT-NONRELEASE-${{ github.run_number }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: tools/qualification/final_src/
          retention-days: 14
          if-no-files-found: error

      - name: Install system dependencies & Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libegl1-mesa-dev libdbus-1-dev

      - name: Install Qt 6.8.3 via aqtinstall
        run: |
          pip install "aqtinstall==3.3.0" "py7zr==1.1.0"
          python -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 -m qtmultimedia

      - name: Configure CMake (Portable DSP)
        run: |
          if cmake -B build-linux -G Ninja \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/6.8.3/gcc_64" \
            -DRGSML_BUILD_TESTS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DRGSML_WARNINGS_AS_ERRORS=ON \
            -DRGSML_PROVENANCE_TYPE=PR \
            -DRGSML_PROVENANCE_PR_NUMBER=${{ github.event.pull_request.number }} \
            -DRGSML_PROVENANCE_RUN_NUMBER=${{ github.run_number }} \
            -DRGSML_PROVENANCE_GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }} \
            > "$RUNNER_TEMP/rgsml-linux-configure-full-local.log" 2>&1; then
            echo "CMAKE_PORTABLE_CONFIGURE_PASS"
          else
            python tools/ci/summarize_cmake_configure_failure.py \
              --input "$RUNNER_TEMP/rgsml-linux-configure-full-local.log" \
              --output "$RUNNER_TEMP/rgsml-linux-configure-bounded.txt"
            cat "$RUNNER_TEMP/rgsml-linux-configure-bounded.txt"
            exit 1
          fi

      - name: Upload bounded CMake configuration errors (Linux)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-Bounded-CMake-Linux-${{ github.run_number }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/rgsml-linux-configure-bounded.txt
          retention-days: 7
          if-no-files-found: ignore

      # B2f: inspect Ninja's true compile command for each production object.
      - name: Verify Linux True Peak scoped strict FP flags
        run: |
          python tools/qualification/true_peak/verify_fp_build_flags.py \
            --platform linux --build-dir build-linux \
            --source-sha '${{ github.event.pull_request.head.sha || github.sha }}' \
            --run-id '${{ github.run_id }}' \
            --output "${RUNNER_TEMP}/B2f_linux_fp_compile_attestation.json"

      # B2i: protected code blobs and negative product qualification transitions.
      # No extra maths/DSP change; the result MUST remain UNQUALIFIED.
      - name: M16 B2i Gate G conservative evidence guard (Linux)
        run: |
          python tools/qualification/true_peak/verify_gate_g_evidence.py \
            --matrix tools/qualification/true_peak/b2g_gate_g_coverage_matrix.json \
            --expected-head '${{ github.event.pull_request.head.sha || github.sha }}' \
            --output "${RUNNER_TEMP}/B2i_linux_evidence_guard.json"

      # B3: exact locked CMake blob + explicit nonqualifying adapter binding.
      - name: M16 B3 CMake blob-lock and adapter boundary (Linux)
        run: |
          python tools/qualification/true_peak/verify_b3_adapter_boundary.py

      # Minor Fix G1: QML source-only contract; physical visual gate is separate.
      - name: Minor Fix G1 Compressor QML static regression (Linux)
        run: |
          python tools/qualification/ui/verify_compressor_minor_fix_g1.py

      - name: Minor Fix G2 GR identity and lane topology contract (Linux)
        run: |
          python tools/qualification/ui/verify_compressor_minor_fix_g2.py

      - name: Minor Fix G3 UI static guard (Linux)
        run: |
          python tools/qualification/ui/verify_minor_fix_g3.py

      # Cross-DSP tooltip policy: QML source evidence, not a manual UI gate.
      - name: Global stationary tooltip policy (Linux)
        run: |
          python tools/qualification/ui/verify_stationary_tooltips.py

      # Both M16 and M17 reuse this physical scale; minimum-size source
      # geometry is guarded, physical Windows raster remains a separate gate.
      - name: M16 M17 zero marker compact-scale regression (Linux)
        run: |
          python tools/qualification/ui/verify_true_peak_min_scale_zero.py

      - name: Build Focused DSP Targets
        run: |
          cmake --build build-linux --target \
            rgsml_dsp_module_descriptor_tests \
            rgsml_dsp_module_registry_tests \
            rgsml_dsp_processing_chain_tests \
            rgsml_dsp_structural_integration_tests \
            rgsml_gain_tests \
            rgsml_true_peak_itu4x_coefficients_tests \
            rgsml_true_peak_itu4x_channel_stream_tests \
            rgsml_true_peak_full_resource_tests \
            rgsml_true_peak_measurement_tests \
            rgsml_true_peak_static_binding_tests \
            rgsml_true_peak_gate_g_edge_tests \
            rgsml_true_peak_chunk_invariance_tests \
            rgsml_true_peak_b2b_probe \
            rgsml_stereo_ms_parameters_tests \
            rgsml_stereo_ms_module_tests \
            rgsml_stereo_ms_crossover_tests \
            rgsml_stereo_ms_crossover_runtime_tests \
            rgsml_stereo_ms_module_streaming_tests \
            rgsml_stereo_ms_checkpoint_tests \
            rgsml_stereo_ms_independent_math_tests \
            rgsml_stereo_ms_long_resume_tests \
            rgsml_stereo_ms_gate_g_spatial_evidence_tests \
            rgsml_stereo_ms_no_alloc_tests \
            rgsml_stereo_ms_width_tests \
            rgsml_stereo_ms_width_response_tests \
            rgsml_stereo_ms_signature_tests \
            rgsml_stereo_ms_view_model_tests \
            rgsml_stereo_ms_audible_resolver_tests \
            rgsml_gain_golden_tests \
            rgsml_compressor_tests \
            rgsml_compressor_gate_g_tests \
            rgsml_compressor_no_alloc_tests \
            rgsml_module_parameter_codec_tests \
            rgsml_parametric_eq_tests \
            rgsml_parametric_eq_golden_tests \
            rgsml_parametric_eq_response_tests \
            rgsml_eq_view_model_tests \
            rgsml_gain_view_model_tests \
            rgsml_compressor_view_model_tests \
            rgsml_mastering_chain_state_tests \
            rgsml_master_output_rate_state_tests \
            rgsml_master_output_rate_codec_tests \
            rgsml_terminal_private_gr_projection_tests \
            rgsml_mastering_preview_controller_tests \
            rgsml_dsp_module_adapter_tests \
            rgsml_render_preview_tests \
            rgsml_playback_src_tests \
            rgsml_external_playback_fir_assets_tests \
            rgsml_playback_engine_portable_tests \
            > "$RUNNER_TEMP/rgsml-focused-linux-build.log" 2>&1
          echo "FOCUSED_BUILD_LINUX_SUCCESS"

      - name: Capture bounded Linux compiler errors
        if: failure()
        run: |
          python tools/ci/summarize_focused_build.py --input "$RUNNER_TEMP/rgsml-focused-linux-build.log" --output "$RUNNER_TEMP/rgsml-focused-linux-summary.txt" --platform linux
          cat "$RUNNER_TEMP/rgsml-focused-linux-summary.txt"

      - name: Attach bounded Linux compile diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-Focused-Errors-Linux-${{ github.run_number }}-${{ github.sha }}
          path: ${{ runner.temp }}/rgsml-focused-linux-summary.txt
          retention-days: 7
          if-no-files-found: error

      - name: Run Focused DSP Tests
        env:
          RGSML_PHASE11_REAL_CANARY_PATH: ${{ runner.temp }}/rgsml-phase11-real-mpfr-48to96.bin
          RGSML_PHASE11_REAL_DOWNSAMPLE_PATH: ${{ runner.temp }}/rgsml-phase11-real-mpfr-88kto44k.bin
          RGSML_PHASE11_REAL_POW4_PATH: ${{ runner.temp }}/rgsml-phase11-real-pow4
          RGS_M17_CPU_PROBE_FILE: ${{ runner.temp }}/rgs-m17-cpu-linux.csv
          RGS_M17_PARTITION_PROBE_FILE: ${{ runner.temp }}/rgs-m17-partition-linux.csv
          RGS_M17_LOOKAHEAD_PROBE_FILE: ${{ runner.temp }}/rgs-m17-lookahead-linux.csv
          RGS_M17_BOUND_PROBE_FILE: ${{ runner.temp }}/rgs-m17-bound-linux.csv
        run: |
          ctest --test-dir build-linux -R "^(rgsml_dsp_|rgsml_gain_|rgsml_true_peak_itu4x_coefficients_tests|rgsml_true_peak_itu4x_channel_stream_tests|rgsml_true_peak_full_resource_tests|rgsml_true_peak_measurement_tests|rgsml_true_peak_static_binding_tests|rgsml_true_peak_gate_g_edge_tests|rgsml_true_peak_chunk_invariance_tests|rgsml_true_peak_b2b_probe_selftest|rgsml_stereo_ms_parameters_tests|rgsml_stereo_ms_module_tests|rgsml_stereo_ms_crossover_tests|rgsml_stereo_ms_crossover_runtime_tests|rgsml_stereo_ms_module_streaming_tests|rgsml_stereo_ms_checkpoint_tests|rgsml_stereo_ms_independent_math_tests|rgsml_stereo_ms_long_resume_tests|rgsml_stereo_ms_gate_g_spatial_evidence_tests|rgsml_stereo_ms_no_alloc_tests|rgsml_stereo_ms_width_tests|rgsml_stereo_ms_width_response_tests|rgsml_stereo_ms_signature_tests|rgsml_stereo_ms_view_model_tests|rgsml_stereo_ms_audible_resolver_tests|rgsml_compressor_|rgsml_module_parameter_codec_tests|rgsml_parametric_eq_|rgsml_eq_view_model_|rgsml_mastering_chain_state_tests|rgsml_master_output_rate_state_tests|rgsml_master_output_rate_codec_tests|rgsml_terminal_private_gr_projection_tests|rgsml_mastering_preview_controller_tests|rgsml_render_preview_tests|rgsml_playback_src_tests|rgsml_external_playback_fir_assets_tests|rgsml_playback_engine_portable_tests|render_public_headers_standalone|render_dependency_rule_positive_fixture|toolchain_manifest_)" --output-on-failure

      # These four REAL private canaries were generated and SHA-checked
      # earlier in this same Linux runner. CTest alone does not prove that
      # asset-dependent Qt methods actually ran rather than SKIPped.
      # No private 14-file ZIP transfer and no product Final SRC admission.
      - name: Phase-11 original four genuine MPFR Q0 native Qt PASS unskipped (Linux)
        run: |
          python tools/qualification/final_src/run_four_genuine_q0_native_ci.py \
            --build-dir build-linux \
            --two ${{ runner.temp }}/rgsml-phase11-real-mpfr-48to96.bin \
            --one ${{ runner.temp }}/rgsml-phase11-real-mpfr-88kto44k.bin \
            --fourfold-dir ${{ runner.temp }}/rgsml-phase11-real-pow4 \
            --report ${{ runner.temp }}/rgsml-original4-real-native-q0-NONRELEASE.json

      - name: Archive original four genuine native Qt nonrelease report (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: RGS-Phase11-REAL-Q0-NATIVE4-NONRELEASE-${{ github.run_number }}-${{ github.sha }}
          path: ${{ runner.temp }}/rgsml-original4-real-native-q0-NONRELEASE.json
          retention-days: 30
          if-no-files-found: error

      # REAL compiled Qt test executable; NO proprietary Q0 FIR binaries or
      # Q1 reference vectors are transferred to Actions or uploaded here.
      # Run this build later against the existing PRIVATE frozen ZIPs on
      # an authorized offline host, avoiding a new Qt build for each gate.
      - name: Phase11 portable REAL Qt native test packaging negative gates (Linux)
        run: |
          python tools/qualification/final_src/test_pack_private_offline_qt_test_bundle.py

      - name: Pack exact compiled Linux Qt SRC native test for private offline 14/36 gate
        run: |
          python tools/qualification/final_src/pack_private_offline_qt_test_bundle.py \
            --build-dir build-linux \
            --output ${{ runner.temp }}/RGS-Phase11-NATIVE-QT-OFFLINE-NONRELEASE.tar.gz
          python tools/qualification/final_src/pack_private_offline_qt_test_bundle.py \
            --verify-only \
            --output ${{ runner.temp }}/RGS-Phase11-NATIVE-QT-OFFLINE-NONRELEASE.tar.gz

      - name: Archive real Qt native offline test executable without any private assets (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: RGS-Phase11-REAL-NATIVE-QT-EXE-NONRELEASE-${{ github.run_number }}-${{ github.sha }}
          path: ${{ runner.temp }}/RGS-Phase11-NATIVE-QT-OFFLINE-NONRELEASE.tar.gz
          retention-days: 14
          if-no-files-found: error

      - name: Upload bounded M17 CPU probe (Linux)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-M17-CPU-Linux-${{ github.run_number }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/rgs-m17-cpu-linux.csv
          retention-days: 7
          if-no-files-found: error

      # Six non-gating Windows/Linux-comparable rows, no complete job logs.
      - name: Upload bounded M17 block partition probe (Linux)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-M17-Partition-Linux-${{ github.run_number }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/rgs-m17-partition-linux.csv
          retention-days: 7
          if-no-files-found: error

      - name: Upload bounded M17 lookahead cache experiment (Linux)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-M17-Lookahead-Linux-${{ github.run_number }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/rgs-m17-lookahead-linux.csv
          retention-days: 7
          if-no-files-found: error

      - name: Upload bounded M17 group-bound experiment (Linux)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-M17-Bound-Linux-${{ github.run_number }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/rgs-m17-bound-linux.csv
          retention-days: 7
          if-no-files-found: error

      # Failure-only diagnostics filtered ON RUNNER; never transfer full logs.
      - name: Capture bounded Linux failing-test assertions
        if: failure()
        run: |
          python tools/ci/summarize_focused_tests.py --ctest-dir build-linux/Testing/Temporary --output "$RUNNER_TEMP/rgsml-focused-linux-test-summary.txt"
      - name: Attach bounded Linux test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-Focused-Test-Errors-Linux-${{ github.run_number }}-${{ github.sha }}
          path: ${{ runner.temp }}/rgsml-focused-linux-test-summary.txt
          retention-days: 7
          if-no-files-found: error

      - name: Upload Linux FP compile attestation (no audio)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-M16-B2f-Linux-FP-Attestation-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/B2f_linux_fp_compile_attestation.json
          retention-days: 7
          if-no-files-found: error

  windows-focused-dsp:
    name: Windows Focused DSP
    runs-on: windows-2022
    env:
      RGSML_QT_ROOT: ${{ github.workspace }}/6.8.3/msvc2022_64
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: "rgsml-msvc2022-qt683-strict-ninja-v1"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "true"
    steps:
      - name: Checkout exact PR head (B2b qualification provenance)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enter VS2022 x64 toolchain for Ninja/MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Same integer/rational evidence independently executed on Windows.
      - name: Phase-11 Final SRC exact Q0 preflight (Windows)
        run: |
          python tools/qualification/final_src/test_phase11_math_preflight.py
          python tools/qualification/final_src/phase3_exact_model_q0_nonrelease.py
          python tools/qualification/final_src/test_audit_work_phase3_frozen_math_nonrelease.py

      # Independent conceptual zero-stuffed exact-dyadic reference checks;
      # NOT the full MPFR spectral oracle or release qualification.
      - name: Phase-11 Final SRC exact dyadic + strict-scalar independent oracles (Windows)
        run: |
          python tools/qualification/final_src/test_exact_dyadic_zero_stuff_oracle.py
          python tools/qualification/final_src/test_strict_scalar_polyphase_reference.py

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Expose GHA cache runtime credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Qt 6.8.3 and Ninja
        run: |
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0" "py7zr==1.1.0" ninja
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_TOOL_INSTALL_FAILED' }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -m qtmultimedia
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_QT_INSTALL_FAILED' }
          ninja --version

      # Preserve the original M16 B2f attestation source unchanged: configure
      # Visual Studio only to inspect source-scoped .vcxproj, NEVER MSBuild.
      - name: Configure Visual Studio only for frozen M16 B2f evidence
        shell: pwsh
        run: |
          $configureLog = Join-Path $env:RUNNER_TEMP 'rgsml-windows-configure-full-local.log'
          & cmake --preset windows-msvc `
            -DRGSML_PROVENANCE_TYPE=PR `
            -DRGSML_PROVENANCE_PR_NUMBER=${{ github.event.pull_request.number }} `
            -DRGSML_PROVENANCE_RUN_NUMBER=${{ github.run_number }} `
            -DRGSML_PROVENANCE_GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }} *> $configureLog
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            python tools/ci/summarize_cmake_configure_failure.py --input "$configureLog" --output "$env:RUNNER_TEMP/rgsml-windows-configure-bounded.txt"
            Get-Content "$env:RUNNER_TEMP/rgsml-windows-configure-bounded.txt"
            throw 'VS_B2F_CONFIGURATION_FAILED'
          }
          Write-Host 'CMAKE_VISUAL_STUDIO_CONFIGURE_PASS'

      - name: Upload bounded CMake configuration errors (Windows)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-Bounded-CMake-Windows-${{ github.run_number }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/rgsml-windows-configure-bounded.txt
          retention-days: 7
          if-no-files-found: ignore

      # Product CI now compiles with Microsoft cl.exe, Ninja Multi-Config and
      # sccache; Visual Studio generator above is evidence-only.
      - name: Configure canonical Windows MSVC with Ninja Multi-Config
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B build/windows-ninja-cache -G "Ninja Multi-Config" `
            -DCMAKE_CONFIGURATION_TYPES=Release `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW `
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DRGSML_BUILD_TESTS=ON `
            -DRGSML_WARNINGS_AS_ERRORS=ON `
            -DRGSML_PROVENANCE_TYPE=PR `
            -DRGSML_PROVENANCE_PR_NUMBER=${{ github.event.pull_request.number }} `
            -DRGSML_PROVENANCE_RUN_NUMBER=${{ github.run_number }} `
            -DRGSML_PROVENANCE_GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }} `
            -DRGSML_QT_ROOT="$env:RGSML_QT_ROOT"
          if ($LASTEXITCODE -ne 0) { throw 'NINJA_MSVC_CONFIGURATION_FAILED' }

      # B2f: assert source-scoped strict FP in generated MSBuild project.
      - name: Verify Windows True Peak scoped strict FP flags
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/qualification/true_peak/verify_fp_build_flags.py --platform windows --build-dir build/windows-msvc --source-sha '${{ github.event.pull_request.head.sha || github.sha }}' --run-id '${{ github.run_id }}' --output "$env:RUNNER_TEMP\B2f_windows_fp_compile_attestation.json"
          if ($LASTEXITCODE -ne 0) { throw 'B2F_WINDOWS_SOURCE_FP_FLAG_CHECK_FAILED' }

      # Additional fail-closed source-scoped evidence from the REAL Ninja
      # compiler command; not a replacement for frozen M16 B2f attestation.
      - name: Verify effective Ninja strict-FP compilation flags (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $commands = Get-Content build/windows-ninja-cache/compile_commands.json -Raw | ConvertFrom-Json
          foreach ($source in @('true_peak_itu4x_channel_stream.cpp', 'true_peak_full_resource.cpp', 'true_peak_limiter_module.cpp')) {
            $match = @($commands | Where-Object { $_.file.Replace([char]92,[char]47).EndsWith("/" + $source, [System.StringComparison]::OrdinalIgnoreCase) })
            if ($match.Count -ne 1) { throw "NINJA_STRICT_FP_MISSING_OR_DUPLICATED: $source count=$($match.Count)" }
            $command = [string]$match[0].command
            if ($command -notmatch '(?i)(?<!\w)/fp:strict(?![\w-])' -or
                $command -match '(?i)/fp:(fast|contract)\b') {
              throw "NINJA_STRICT_FP_FLAGS_INVALID: $source"
            }
            Write-Host "NINJA_SCOPED_STRICT_FP_CONFIRMED: $source"
          }

      # B2i: independent negative falsification guard for status evidence.
      - name: M16 B2i Gate G conservative evidence guard (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/qualification/true_peak/verify_gate_g_evidence.py --matrix tools/qualification/true_peak/b2g_gate_g_coverage_matrix.json --expected-head '${{ github.event.pull_request.head.sha || github.sha }}' --output "$env:RUNNER_TEMP\B2i_windows_evidence_guard.json"
          if ($LASTEXITCODE -ne 0) { throw 'B2I_GATE_G_PROVENANCE_AND_STATUS_RECONCILIATION_FAILED' }

      - name: M16 B3 CMake blob-lock and adapter boundary (Windows)
        shell: pwsh
        run: |
          python tools/qualification/true_peak/verify_b3_adapter_boundary.py
          if ($LASTEXITCODE -ne 0) { throw 'B3_CMAKE_SOURCE_BOUNDARY_REGRESSION' }

      # Minor Fix G1: additional QML source contract (not a visual substitute).
      - name: Minor Fix G1 Compressor QML static regression (Windows)
        shell: pwsh
        run: |
          python tools/qualification/ui/verify_compressor_minor_fix_g1.py
          if ($LASTEXITCODE -ne 0) { throw 'MINOR_FIX_G1_STATIC_QML_REGRESSION' }

      - name: Minor Fix G2 GR identity and lane topology contract (Windows)
        shell: pwsh
        run: |
          python tools/qualification/ui/verify_compressor_minor_fix_g2.py
          if ($LASTEXITCODE -ne 0) { throw 'MINOR_FIX_G2_STATIC_PROVENANCE_REGRESSION' }

      - name: Minor Fix G3 UI static guard (Windows)
        shell: pwsh
        run: |
          python tools/qualification/ui/verify_minor_fix_g3.py
          if ($LASTEXITCODE -ne 0) { throw 'MINOR_FIX_G3_STATIC_UI_REGRESSION' }

      - name: Build Focused DSP Targets (Release) — Ninja + sccache
        run: |
          sccache --zero-stats
          $buildTimer = [System.Diagnostics.Stopwatch]::StartNew()
          cmake --build build/windows-ninja-cache --config Release --parallel 4 --target `
            rgsml_dsp_module_descriptor_tests `
            rgsml_dsp_module_registry_tests `
            rgsml_dsp_processing_chain_tests `
            rgsml_dsp_structural_integration_tests `
            rgsml_gain_tests `
            rgsml_true_peak_itu4x_coefficients_tests `
            rgsml_true_peak_itu4x_channel_stream_tests `
            rgsml_true_peak_full_resource_tests `
            rgsml_true_peak_measurement_tests `
            rgsml_true_peak_static_binding_tests `
            rgsml_true_peak_gate_g_edge_tests `
            rgsml_true_peak_chunk_invariance_tests `
            rgsml_true_peak_b2b_probe `
            rgsml_stereo_ms_parameters_tests `
            rgsml_stereo_ms_module_tests `
            rgsml_stereo_ms_crossover_tests `
            rgsml_stereo_ms_crossover_runtime_tests `
            rgsml_stereo_ms_module_streaming_tests `
            rgsml_stereo_ms_checkpoint_tests `
            rgsml_stereo_ms_independent_math_tests `
            rgsml_stereo_ms_long_resume_tests `
            rgsml_stereo_ms_gate_g_spatial_evidence_tests `
            rgsml_stereo_ms_no_alloc_tests `
            rgsml_stereo_ms_width_tests `
            rgsml_stereo_ms_width_response_tests `
            rgsml_stereo_ms_signature_tests `
            rgsml_stereo_ms_view_model_tests `
            rgsml_stereo_ms_audible_resolver_tests `
            rgsml_gain_golden_tests `
            rgsml_compressor_tests `
            rgsml_compressor_gate_g_tests `
            rgsml_compressor_no_alloc_tests `
            rgsml_compressor_listening_gate `
            rgsml_module_parameter_codec_tests `
            rgsml_parametric_eq_tests `
            rgsml_parametric_eq_golden_tests `
            rgsml_parametric_eq_response_tests `
            rgsml_eq_view_model_tests `
            rgsml_gain_view_model_tests `
            rgsml_compressor_view_model_tests `
            rgsml_mastering_chain_state_tests `
            rgsml_master_output_rate_state_tests `
            rgsml_master_output_rate_codec_tests `
            rgsml_terminal_private_gr_projection_tests `
            rgsml_terminal_product_activation_tests `
            rgsml_mastering_preview_controller_tests `
            rgsml_dsp_module_adapter_tests `
            rgsml_render_preview_tests `
            rgsml_audition_source_selector_tests `
            rgsml_playback_src_tests `
            rgsml_external_playback_fir_assets_tests `
            rgsml_playback_support_tests `
            rgsml_source_metadata_panel_smoke `
            rgsml_project_session_tests `
            rgsml_app *> "$env:RUNNER_TEMP/rgsml-focused-windows-build.log"
          $buildExit = $LASTEXITCODE
          $buildTimer.Stop()
          if ($buildExit -ne 0) { throw "NINJA_FOCUSED_BUILD_FAILED_$buildExit" }
          Write-Host "WINDOWS_NINJA_COMPILE_SECONDS=$([math]::Round($buildTimer.Elapsed.TotalSeconds,1))"
          sccache --show-stats
          if ($LASTEXITCODE -ne 0) { throw 'SCCACHE_STATISTICS_UNAVAILABLE' }

      - name: Capture bounded Windows compiler errors
        if: failure()
        shell: pwsh
        run: |
          python tools/ci/summarize_focused_build.py --input "$env:RUNNER_TEMP/rgsml-focused-windows-build.log" --output "$env:RUNNER_TEMP/rgsml-focused-windows-summary.txt" --platform windows
          if ($LASTEXITCODE -ne 0) { throw 'FOCUSED_DIAGNOSTIC_EXTRACTION_FAILED' }
          Get-Content "$env:RUNNER_TEMP/rgsml-focused-windows-summary.txt"

      - name: Attach bounded Windows compile diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-Focused-Errors-Windows-${{ github.run_number }}-${{ github.sha }}
          path: ${{ runner.temp }}/rgsml-focused-windows-summary.txt
          retention-days: 7
          if-no-files-found: error

      # Pure-Python regression: ensure direct QtTest failure reports are
      # bounded and never upload the full UI smoke or GitHub job logs.
      - name: Verify runner-filtered Qt smoke diagnostics
        run: python tools/ci/test_summarize_focused_tests.py

      - name: Run Windows UI Smoke Diagnostic
        env:
          RGSML_GUI01_EVIDENCE_DIR: ${{ github.workspace }}\build\visual-evidence
        run: |
          $env:PATH = "$env:RGSML_QT_ROOT\bin;$env:PATH"
          $env:QML2_IMPORT_PATH = "$env:RGSML_QT_ROOT\qml"
          $log = "$env:GITHUB_WORKSPACE\m12b-smoke.txt"
          & build/windows-ninja-cache/Release/rgsml_source_metadata_panel_smoke.exe -v2 -o "$log,txt"
          $exitCode = $LASTEXITCODE
          if (Test-Path $log) {
              # Never print the whole QtTest log to GitHub Actions. Keep
              # high-priority FAIL!/QFATAL assertions (max 8) on the runner;
              # the failure-only artifact is generated independently later.
              $critical = @(Select-String -Path $log -Pattern 'FAIL!', 'QFATAL', 'ASSERT', 'Fatal error' | Select-Object -First 8)
              foreach ($hit in $critical) {
                  Write-Host ("QT_SMOKE_CRITICAL_LINE_{0}: {1}" -f $hit.LineNumber, $hit.Line.Substring(0, [Math]::Min(200, $hit.Line.Length)))
              }
              if ($critical.Count -eq 0) { Write-Host "QT_SMOKE_NO_CRITICAL_ASSERTION" }
          } else {
              Write-Host "M12B_SMOKE_LOG_NOT_CREATED"
          }
          if ($exitCode -ne 0) {
              exit $exitCode
          }

      # Actual production Qt Main capture, not an isolated component fixture.
      # Windows runner uses explicit 150% Qt scaling; the app verifies DPR,
      # 1184x688 logical size and the written PNG. PO physical Gate remains separate.
      - name: Capture actual M17 Main Qt at 1184x688 and 150 percent
        shell: pwsh
        env:
          QT_SCALE_FACTOR: '1.5'
          RGSML_M17_MAIN_EVIDENCE_PATH: ${{ github.workspace }}\build\visual-evidence\m17_real_main_1184x688_dpr150.png
        run: |
          $env:PATH = "$env:RGSML_QT_ROOT\bin;$env:PATH"
          $env:QML2_IMPORT_PATH = "$env:RGSML_QT_ROOT\qml"
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\build\visual-evidence" | Out-Null
          # WIN32_EXECUTABLE is a GUI-subsystem process. PowerShell's bare
          # '&' may return before it has exited: its $LASTEXITCODE is NOT a
          # trustworthy completion witness (CI #858 saved a real 1776x1032
          # PNG but the old check still reported failure). Wait on process.
          $process = Start-Process -FilePath "build/windows-ninja-cache/Release/RGSMasterLab.exe" -ArgumentList "--rgsml-m17-ui-evidence" -Wait -PassThru
          Write-Host "M17_REAL_MAIN_APP_EXIT_CODE=$($process.ExitCode)"
          if (-not (Test-Path "$env:RGSML_M17_MAIN_EVIDENCE_PATH")) {
            throw 'M17_REAL_MAIN_QT_PNG_MISSING'
          }
          if ($process.ExitCode -ne 0) { throw 'M17_REAL_MAIN_QT_150_APP_FAILURE' }

      # The official cold FQ uses canonical Visual Studio/MSVC Debug,
      # while the existing Focused UI smoke uses Ninja/MSVC Release.
      # The isolated Debug probe MUST also use the Visual Studio generator:
      # audio/playback_sample_rate_adapter.cpp has deliberate Debug /O2 and
      # VS_SETTINGS=BasicRuntimeChecks=Default; Ninja ignores VS_SETTINGS
      # and combines /O2 with incompatible /RTC1 (CI #849). Never weaken
      # the frozen audio per-source optimization just to make this probe pass.
      # Use its OWN VS build directory: the pre-existing windows-msvc B2f
      # attestation generator stays configure-only and untouched.
      - name: Configure isolated Windows Debug UI diagnostic
        shell: pwsh
        run: |
          cmake -S . -B build/windows-focused-debug-ui -G "Visual Studio 17 2022" -A x64 `
            -DRGSML_BUILD_TESTS=ON `
            -DRGSML_WARNINGS_AS_ERRORS=ON `
            -DRGSML_PROVENANCE_TYPE=PR `
            -DRGSML_PROVENANCE_PR_NUMBER=${{ github.event.pull_request.number }} `
            -DRGSML_PROVENANCE_RUN_NUMBER=${{ github.run_number }} `
            -DRGSML_PROVENANCE_GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }} `
            -DRGSML_QT_ROOT="$env:RGSML_QT_ROOT"
          if ($LASTEXITCODE -ne 0) { throw 'FOCUSED_DEBUG_UI_CONFIG_FAILED' }
      - name: Build isolated Windows Debug UI diagnostic
        shell: pwsh
        run: |
          $raw = "$env:RUNNER_TEMP/rgsml-focused-debug-ui-build.log"
          cmake --build build/windows-focused-debug-ui --config Debug `
            --target rgsml_source_metadata_panel_smoke --parallel 4 *> $raw
          if ($LASTEXITCODE -ne 0) { throw 'FOCUSED_DEBUG_UI_BUILD_FAILED' }
