# OFFICIAL FQ — adopted from successful isolated Windows Ninja Pilot #8.
# The cold path uses canonical Visual Studio Debug, uncached Ninja Release
# and independent Tests-OFF plus parity, FP and standalone deploy evidence.
# warm is strictly nonqualifying performance comparison.
# This workflow is manual-only; it NEVER authorizes a PR merge or replaces
# PO physical Gate M/L. Dispatch requires exact candidate SHA.
name: Windows Full Qualification

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: "Exact 40-char SHA to qualify; must match dispatch SHA"
        required: true
        type: string
      cache_mode:
        description: "cold authoritative, warm performance-only"
        type: choice
        options: [cold, warm]
        default: cold
permissions:
  contents: read
jobs:
  windows-fq-ninja:
    name: Canonical VS Debug + Ninja Release/TestsOFF (candidate)
    runs-on: windows-2022
    env:
      RGSML_QT_ROOT: ${{ github.workspace }}/6.8.3/msvc2022_64
      RGSML_FQ_SHA: ${{ github.sha }}
      RGSML_FQ_CACHE_MODE: ${{ inputs.cache_mode }}
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: "rgsml-fq-msvc2022-qt683-strict-ninja-v1"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "true"
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Enforce exact FQ source SHA before toolchain setup
        shell: pwsh
        run: |
          $requested = '${{ inputs.expected_source_sha }}'.Trim().ToLowerInvariant()
          $actual = "$env:RGSML_FQ_SHA".Trim().ToLowerInvariant()
          if ($requested -notmatch '^[0-9a-f]{40}$') { throw "FQ_EXPECTED_SOURCE_SHA_INVALID" }
          if ($requested -ne $actual) { throw "FQ_WRONG_SOURCE_SHA: expected=$requested actual=$actual" }
          if ($env:RGSML_FQ_CACHE_MODE -notin @('cold','warm')) { throw "FQ_CACHE_MODE_INVALID" }
          Write-Host "FQ_EXACT_SHA_VERIFIED=$actual"
          if ($env:RGSML_FQ_CACHE_MODE -eq 'warm') {
            Write-Host "FQ_WARM_PERFORMANCE_ONLY_NOT_AUTHORITATIVE"
          }

      - name: Enter Visual Studio x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"
      - name: Expose Actions cache runtime credentials
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Install Qt 6.8.3 and Ninja
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0" "py7zr==1.1.0" ninja
          if ($LASTEXITCODE -ne 0) { throw "FQ_DEPS_FAILED" }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -m qtmultimedia
          if ($LASTEXITCODE -ne 0) { throw "FQ_QT_FAILED" }
          ninja --version
          if ($LASTEXITCODE -ne 0) { throw "FQ_NINJA_FAILED" }
      - name: Configure original Visual Studio generator only for frozen B2f attestation
        shell: pwsh
        run: |
          $args = @('--preset','windows-msvc','-DRGSML_PROVENANCE_TYPE=FQ',
            '-DRGSML_PROVENANCE_RUN_NUMBER=${{ github.run_number }}',
            "-DRGSML_PROVENANCE_GIT_SHA=$env:RGSML_FQ_SHA")
          & cmake @args
          if ($LASTEXITCODE -ne 0) { throw "FQ_B2F_CONFIG_FAILED" }
          python tools/qualification/true_peak/verify_fp_build_flags.py --platform windows --build-dir build/windows-msvc --source-sha "$env:RGSML_FQ_SHA" --run-id '${{ github.run_id }}' --output "$env:RUNNER_TEMP\pilot_b2f_attestation.json"
          if ($LASTEXITCODE -ne 0) { throw "FQ_B2F_ATTESTATION_FAILED" }
      - name: Configure Release-only Ninja and enforce strict source FP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RGSML_FQ_CACHE_MODE -notin @('warm','cold')) { throw "INVALID_FQ_CACHE_MODE" }
          $launcher = if ($env:RGSML_FQ_CACHE_MODE -eq 'warm') { 'sccache' } else { '' }
          Write-Host "FQ_FQ_CACHE_MODE=$env:RGSML_FQ_CACHE_MODE"
          $args = @('-S','.','-B','build/windows-fq-ninja','-G','Ninja Multi-Config',
            '-DCMAKE_CONFIGURATION_TYPES=Release',
            '-DCMAKE_EXPORT_COMPILE_COMMANDS=ON',
            '-DCMAKE_POLICY_DEFAULT_CMP0141=NEW',
            '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded',
            "-DCMAKE_C_COMPILER_LAUNCHER=$launcher",
            "-DCMAKE_CXX_COMPILER_LAUNCHER=$launcher",
            '-DRGSML_BUILD_TESTS=ON','-DRGSML_WARNINGS_AS_ERRORS=ON',
            '-DRGSML_PROVENANCE_TYPE=FQ',
            '-DRGSML_PROVENANCE_RUN_NUMBER=${{ github.run_number }}',
            "-DRGSML_PROVENANCE_GIT_SHA=$env:RGSML_FQ_SHA",
            "-DRGSML_QT_ROOT=$env:RGSML_QT_ROOT")
          & cmake @args
          if ($LASTEXITCODE -ne 0) { throw "FQ_NINJA_CONFIG_FAILED" }
          $commands = Get-Content build/windows-fq-ninja/compile_commands.json -Raw | ConvertFrom-Json
          # One Release compile command per protected translation unit;
          # Debug is deliberately built by the frozen VS/MSBuild generator.
          foreach ($source in @('true_peak_itu4x_channel_stream.cpp','true_peak_full_resource.cpp')) {
            $matches = @($commands | Where-Object { $_.file.Replace([char]92,[char]47).EndsWith("/" + $source,[System.StringComparison]::OrdinalIgnoreCase) })
            if ($matches.Count -ne 1) { throw "STRICT_FP_COVERAGE_INVALID: $source count=$($matches.Count)" }
            foreach ($row in $matches) {
              if ($row.command -notmatch '(?i)(?<!\w)/fp:strict(?![\w-])' -or $row.command -match '(?i)/fp:(fast|contract)\b') { throw "STRICT_FP_INVALID: $source" }
            }
          }
      - name: Clean-build Debug with canonical Visual Studio (timed)
        shell: pwsh
        run: |
          if ($env:RGSML_FQ_CACHE_MODE -eq 'warm') { sccache --zero-stats }
          $sw=[System.Diagnostics.Stopwatch]::StartNew()
          cmake --build --preset windows-msvc-debug-clean
          $code=$LASTEXITCODE
          $sw.Stop()
          "FQ_DEBUG_CLEAN_BUILD_SECONDS=$([int]$sw.Elapsed.TotalSeconds)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          if ($code -ne 0) { throw "FQ_DEBUG_BUILD_FAILED" }
      - name: Debug Qt UI smoke (canonical diagnostic)
        id: fq_debug_ui_smoke
        shell: pwsh
        env:
          RGSML_GUI01_EVIDENCE_DIR: ${{ github.workspace }}/build/fq-adoption-visual-debug
        run: |
          $env:PATH="$env:RGSML_QT_ROOT\bin;$env:PATH"
          $env:QML2_IMPORT_PATH="$env:RGSML_QT_ROOT\qml"
          $log="$env:GITHUB_WORKSPACE\fq-debug-ui-smoke.txt"
          & build/windows-msvc/Debug/rgsml_source_metadata_panel_smoke.exe -v2 -o "$log,txt"
          $code=$LASTEXITCODE
          # Never print the complete QtTest log; retain only bounded fail markers.
          if (Test-Path $log) {
            $critical=@(Select-String -Path $log -Pattern 'FAIL!', 'QFATAL', 'ASSERT', 'Fatal error' | Select-Object -First 8)
            foreach ($hit in $critical) {
              Write-Host ("FQ_DEBUG_QT_CRITICAL_LINE_{0}: {1}" -f $hit.LineNumber, $hit.Line.Substring(0,[Math]::Min(200,$hit.Line.Length)))
            }
          }
          if ($code -ne 0) { throw "FQ_DEBUG_UI_FAILED" }
      - name: Capture bounded FQ Debug UI Smoke assertions
        if: ${{ failure() && steps.fq_debug_ui_smoke.outcome == 'failure' }}
        shell: pwsh
        run: |
          python tools/ci/summarize_focused_tests.py --ctest-dir build/windows-msvc/Testing/Temporary --qt-smoke-log "$env:GITHUB_WORKSPACE\fq-debug-ui-smoke.txt" --output "$env:RUNNER_TEMP/rgsml-fq-debug-ui-bounded.txt"
          if ($LASTEXITCODE -ne 0) { throw "FQ_DEBUG_UI_SUMMARY_FAILED" }
      - name: Upload bounded FQ Debug UI Smoke assertions
        if: ${{ failure() && steps.fq_debug_ui_smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: RGS-FQ-Debug-UI-Errors-${{ github.run_number }}-${{ github.sha }}
          path: ${{ runner.temp }}/rgsml-fq-debug-ui-bounded.txt
          retention-days: 7
          if-no-files-found: error
      - name: Full Debug CTest (canonical VS generator and exclusions)
        id: fq_debug_ctest
        shell: pwsh
        run: |
          ctest --preset windows-msvc-debug --output-on-failure -LE "playback_device|ui_smoke"
          if ($LASTEXITCODE -ne 0) { throw "FQ_DEBUG_CTEST_FAILED" }
      # Keep full runner logs local: only bounded, failure-specific CTest
      # assertions are uploaded for diagnosis of a red official cold FQ.
      - name: Capture bounded FQ Debug CTest diagnostics
        if: ${{ failure() && steps.fq_debug_ctest.outcome == 'failure' }}
        shell: pwsh
        run: |
          python tools/ci/summarize_focused_tests.py --ctest-dir build/windows-msvc/Testing/Temporary --output "$env:RUNNER_TEMP/rgsml-fq-debug-test-summary.txt"
          if ($LASTEXITCODE -ne 0) { throw "FQ_DEBUG_DIAGNOSTIC_EXTRACTION_FAILED" }
      - name: Upload bounded FQ Debug CTest diagnostics
        if: ${{ failure() && steps.fq_debug_ctest.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: RGS-FQ-Debug-Test-Errors-${{ github.run_number }}-${{ github.sha }}
          path: ${{ runner.temp }}/rgsml-fq-debug-test-summary.txt
          retention-days: 7
          if-no-files-found: error
      - name: Clean-build Release (Ninja, timed)
        shell: pwsh
        run: |
          $sw=[System.Diagnostics.Stopwatch]::StartNew()
          cmake --build build/windows-fq-ninja --config Release --clean-first --parallel 4
          $code=$LASTEXITCODE
          $sw.Stop()
          "FQ_RELEASE_CLEAN_BUILD_SECONDS=$([int]$sw.Elapsed.TotalSeconds)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          if ($code -ne 0) { throw "FQ_RELEASE_BUILD_FAILED" }
      - name: Release Qt UI smoke (canonical diagnostic)
        id: fq_release_ui_smoke
        shell: pwsh
        env:
          RGSML_GUI01_EVIDENCE_DIR: ${{ github.workspace }}/build/fq-adoption-visual-release
        run: |
          $env:PATH="$env:RGSML_QT_ROOT\bin;$env:PATH"
          $env:QML2_IMPORT_PATH="$env:RGSML_QT_ROOT\qml"
          $log="$env:GITHUB_WORKSPACE\fq-release-ui-smoke.txt"
          & build/windows-fq-ninja/Release/rgsml_source_metadata_panel_smoke.exe -v2 -o "$log,txt"
          $code=$LASTEXITCODE
          # Never print the complete QtTest log; retain only bounded fail markers.
          if (Test-Path $log) {
            $critical=@(Select-String -Path $log -Pattern 'FAIL!', 'QFATAL', 'ASSERT', 'Fatal error' | Select-Object -First 8)
            foreach ($hit in $critical) {
              Write-Host ("FQ_RELEASE_QT_CRITICAL_LINE_{0}: {1}" -f $hit.LineNumber, $hit.Line.Substring(0,[Math]::Min(200,$hit.Line.Length)))
            }
          }
          if ($code -ne 0) { throw "FQ_RELEASE_UI_FAILED" }
      - name: Capture bounded FQ Release UI Smoke assertions
        if: ${{ failure() && steps.fq_release_ui_smoke.outcome == 'failure' }}
        shell: pwsh
        run: |
          python tools/ci/summarize_focused_tests.py --ctest-dir build/windows-fq-ninja/Testing/Temporary --qt-smoke-log "$env:GITHUB_WORKSPACE\fq-release-ui-smoke.txt" --output "$env:RUNNER_TEMP/rgsml-fq-release-ui-bounded.txt"
          if ($LASTEXITCODE -ne 0) { throw "FQ_RELEASE_UI_SUMMARY_FAILED" }
      - name: Upload bounded FQ Release UI Smoke assertions
        if: ${{ failure() && steps.fq_release_ui_smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: RGS-FQ-Release-UI-Errors-${{ github.run_number }}-${{ github.sha }}
          path: ${{ runner.temp }}/rgsml-fq-release-ui-bounded.txt
          retention-days: 7
          if-no-files-found: error
      - name: Full Release CTest (canonical exclusions)
        id: fq_release_ctest
        shell: pwsh
        run: |
          ctest --test-dir build/windows-fq-ninja -C Release --output-on-failure -LE "playback_device|ui_smoke"
          if ($LASTEXITCODE -ne 0) { throw "FQ_RELEASE_CTEST_FAILED" }
      # Keep full runner logs local: only bounded, failure-specific CTest
      # assertions are uploaded for diagnosis of a red official cold FQ.
      - name: Capture bounded FQ Release CTest diagnostics
        if: ${{ failure() && steps.fq_release_ctest.outcome == 'failure' }}
        shell: pwsh
        run: |
          python tools/ci/summarize_focused_tests.py --ctest-dir build/windows-fq-ninja/Testing/Temporary --output "$env:RUNNER_TEMP/rgsml-fq-release-test-summary.txt"
          if ($LASTEXITCODE -ne 0) { throw "FQ_RELEASE_DIAGNOSTIC_EXTRACTION_FAILED" }
      - name: Upload bounded FQ Release CTest diagnostics
        if: ${{ failure() && steps.fq_release_ctest.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: RGS-FQ-Release-Test-Errors-${{ github.run_number }}-${{ github.sha }}
          path: ${{ runner.temp }}/rgsml-fq-release-test-summary.txt
          retention-days: 7
          if-no-files-found: error
      - name: Assert Debug/Release test inventory parity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          # UI smoke runs separately on Debug and Release; inherited headless
          # exclusions remain identical for the two CTest inventories.
          $debugInventory=@(ctest --test-dir build/windows-msvc -C Debug -N -LE "playback_device|ui_smoke")
          if ($LASTEXITCODE -ne 0) { throw "FQ_DEBUG_TEST_INVENTORY_ERROR" }
          $releaseInventory=@(ctest --test-dir build/windows-fq-ninja -C Release -N -LE "playback_device|ui_smoke")
          if ($LASTEXITCODE -ne 0) { throw "FQ_RELEASE_TEST_INVENTORY_ERROR" }
          $findTests={
            param($lines)
            @($lines | ForEach-Object {
              if ($_ -match '^\s*Test\s+#\s*\d+:\s*(.+?)\s*$') { $Matches[1] }
            } | Sort-Object -Unique)
          }
          $debugTests=@(& $findTests $debugInventory)
          $releaseTests=@(& $findTests $releaseInventory)
          if ($debugTests.Count -eq 0 -or $releaseTests.Count -eq 0) { throw "FQ_EMPTY_TEST_INVENTORY" }
          $delta=@(Compare-Object -ReferenceObject $debugTests -DifferenceObject $releaseTests)
          if ($delta.Count -ne 0) {
            $delta | Format-Table | Out-String | Write-Host
            throw "FQ_DEBUG_RELEASE_INVENTORY_MISMATCH"
          }
          Write-Host "FQ_TEST_PARITY_PASS=$($debugTests.Count)"
          "FQ_TEST_PARITY_COUNT=$($debugTests.Count)" | Out-File $env:GITHUB_STEP_SUMMARY -Append

      - name: Configure independent Tests-OFF Ninja Release tree
        shell: pwsh
        run: |
          $launcher=if ($env:RGSML_FQ_CACHE_MODE -eq 'warm') { 'sccache' } else { '' }
          $args=@('-S','.','-B','build/windows-fq-ninja-tests-off',
            '-G','Ninja Multi-Config','-DCMAKE_CONFIGURATION_TYPES=Release',
            '-DCMAKE_POLICY_DEFAULT_CMP0141=NEW',
            '-DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded',
            "-DCMAKE_C_COMPILER_LAUNCHER=$launcher",
            "-DCMAKE_CXX_COMPILER_LAUNCHER=$launcher",
            '-DRGSML_BUILD_TESTS=OFF','-DRGSML_WARNINGS_AS_ERRORS=ON',
            '-DRGSML_PROVENANCE_TYPE=FQ',
            '-DRGSML_PROVENANCE_RUN_NUMBER=${{ github.run_number }}',
            "-DRGSML_PROVENANCE_GIT_SHA=$env:RGSML_FQ_SHA",
            "-DRGSML_QT_ROOT=$env:RGSML_QT_ROOT")
          & cmake @args
          if ($LASTEXITCODE -ne 0) { throw "FQ_TESTS_OFF_CONFIG_FAILED" }
      - name: Build Tests-OFF Release (timed)
        shell: pwsh
        run: |
          $sw=[System.Diagnostics.Stopwatch]::StartNew()
          cmake --build build/windows-fq-ninja-tests-off --config Release --parallel 4
          $code=$LASTEXITCODE
          $sw.Stop()
          "FQ_TESTS_OFF_BUILD_SECONDS=$([int]$sw.Elapsed.TotalSeconds)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          if ($code -ne 0) { throw "FQ_TESTS_OFF_BUILD_FAILED" }
      - name: Verify cold compiler-cache exclusion and write adoption evidence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $mode=$env:RGSML_FQ_CACHE_MODE
          if ($mode -notin @('warm','cold')) { throw "FQ_INVALID_CACHE_MODE" }
          $expected=if ($mode -eq 'warm') { 'sccache' } else { '' }
          $entries=@()
          foreach ($tree in @('build/windows-fq-ninja','build/windows-fq-ninja-tests-off')) {
            foreach ($key in @('CMAKE_C_COMPILER_LAUNCHER','CMAKE_CXX_COMPILER_LAUNCHER')) {
              $matching=@(Get-Content "$tree/CMakeCache.txt" | Where-Object { $_ -match "^$($key):[^=]*=" })
              if ($matching.Count -ne 1) { throw "FQ_COMPILER_LAUNCHER_ENTRY_MISSING" }
              $value=($matching[0] -split '=',2)[1]
              if ($value -ne $expected) { throw "FQ_COMPILER_LAUNCHER_NOT_$mode" }
              $entries += [ordered]@{ tree=$tree; key=$key; launcher=$value }
            }
          }
          New-Item -ItemType Directory -Path build/fq-adoption-evidence -Force | Out-Null
          [ordered]@{
            evidence_type='FQ_NINJA_ADOPTION_CANDIDATE'
            source_sha=$env:RGSML_FQ_SHA
            cache_mode=$mode
            uncached_ninja_release=($mode -eq 'cold')
            canonical_debug='Visual Studio 17 2022'
            release='Ninja Multi-Config'
            launcher_checks=$entries
            parity='DEBUG_RELEASE_TEST_INVENTORY_CHECK_PASSED'
            qualification=($(if ($mode -eq 'cold') { 'COLD_AUTOMATED_FQ_CANDIDATE_PENDING_PO_GATES' } else { 'WARM_NONAUTHORITATIVE' }))
            physical_audio='NOT_QUALIFIED'
          } | ConvertTo-Json -Depth 6 | Set-Content 'build/fq-adoption-evidence/fq-qualification-evidence.json' -Encoding utf8
          Write-Host "FQ_CACHE_LAUNCHER_PROVENANCE_PASS=$mode"

      - name: Install staged Release
        shell: pwsh
        run: |
          cmake --install build/windows-fq-ninja --config Release --prefix build/windows-fq-ninja/stage/CI/Release
          if ($LASTEXITCODE -ne 0) { throw "FQ_INSTALL_FAILED" }
      # Full FQ cannot pass as 2 + a SHA-only 14-file catalog. The exact
      # deployed ZIP must have 16 real binary files at ONE flat relative root
      # with unchanged frozen SHA pins and NO Python/end-user installer.
      - name: Verify installed 16 authentic FIR files in one flat package
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'build/windows-fq-ninja/stage/CI/Release/bin/resources/fir'
          python tools/qualification/playback_src/verify_installed_16_firs.py --fir-root "$root"
          if ($LASTEXITCODE -ne 0) { throw "FQ_ALL_16_FIR_PACKAGE_GATE_FAILED" }
          Write-Host "FQ_FLAT_16_FIRS_PINNED_SHA256_VERIFIED"
      - name: Run isolated staged deploy smoke with failure evidence
        shell: pwsh
        run: |
          # Do NOT put Qt/bin on PATH: a staged deployment must be standalone.
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'build/windows-fq-ninja/stage/CI/Release'
          $exe = Join-Path $stage 'bin/RGSMasterLab.exe'
          $plugin = Join-Path $stage 'plugins/platforms/qwindows.dll'
          $manifest = Join-Path $stage 'share/RGSMasterLab/ToolchainManifest.json'
          foreach ($required in @($exe,$plugin,$manifest)) {
            if (-not (Test-Path -LiteralPath $required)) {
              throw "FQ_STAGED_REQUIRED_FILE_MISSING: $required"
            }
          }
          $outLog = Join-Path $env:RUNNER_TEMP 'fq-deploy-smoke.stdout.txt'
          $errLog = Join-Path $env:RUNNER_TEMP 'fq-deploy-smoke.stderr.txt'
          $process = Start-Process -FilePath $exe -ArgumentList '--rgsml-deploy-smoke' -PassThru -Wait -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          $code = $process.ExitCode
          Write-Host "FQ_DEPLOY_EXIT_DECIMAL=$code"
          Write-Host "FQ_DEPLOY_EXIT_HEX=$(([System.BitConverter]::ToUInt32([System.BitConverter]::GetBytes([int]$code),0)).ToString('X8'))"
          foreach ($log in @($outLog,$errLog)) {
            if (Test-Path $log) {
              Write-Host "FQ_DEPLOY_LOG=$log"
              Get-Content $log
            }
          }
          if ($code -ne 0) {
            # A debug retry collects information; it CANNOT override failure.
            $env:QT_DEBUG_PLUGINS = '1'
            $traceOut = Join-Path $env:RUNNER_TEMP 'fq-qt-debug.stdout.txt'
            $traceErr = Join-Path $env:RUNNER_TEMP 'fq-qt-debug.stderr.txt'
            try {
              $trace = Start-Process -FilePath $exe -ArgumentList '--rgsml-deploy-smoke' -PassThru -Wait -RedirectStandardOutput $traceOut -RedirectStandardError $traceErr
              Write-Host "FQ_QT_TRACE_EXIT=$($trace.ExitCode)"
              if (Test-Path $traceOut) { Get-Content $traceOut | Select-Object -Last 120 }
              if (Test-Path $traceErr) { Get-Content $traceErr | Select-Object -Last 160 }
            } catch {
              Write-Host "FQ_QT_TRACE_EXCEPTION=$($_.Exception.Message)"
            }
            throw "FQ_DEPLOY_FAILED_EXIT_$code"
          }
          Write-Host 'FQ_STAGED_DEPLOY_SMOKE_PASS'
      # An authentic complete app must refuse a cold EXE-local missing FIR
      # even if a developer environment variable points at a valid private
      # source folder. Temporarily move ONE staged asset, restore it in a
      # finally block and reverify the pristine 16-file release bank.
      - name: Cold deploy negative — no private FIR fallback on missing Q0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'build/windows-fq-ninja/stage/CI/Release'
          $exe = Join-Path $stage 'bin/RGSMasterLab.exe'
          $root = Join-Path $stage 'bin/resources/fir'
          $original = Join-Path $root 'RGSMSR1_L1_M2.bin'
          $hold = "$original.fq-negative-hold"
          if (-not (Test-Path -LiteralPath $original) -or
              (Test-Path -LiteralPath $hold)) {
            throw 'FQ_NEGATIVE_REQUIRES_PRISTINE_ORIGINAL_Q0'
          }
          # A correct build must ignore this developer override in deploy
          # smoke mode; without the EXE-local original, fail closed.
          $env:RGSML_FINAL_SRC_Q0_PRIVATE_DIR = Join-Path $env:GITHUB_WORKSPACE 'resources/fir'
          try {
            Move-Item -LiteralPath $original -Destination $hold
            $out = Join-Path $env:RUNNER_TEMP 'fq-missing-q0.stdout.txt'
            $err = Join-Path $env:RUNNER_TEMP 'fq-missing-q0.stderr.txt'
            $probe = Start-Process -FilePath $exe -ArgumentList '--rgsml-deploy-smoke' -PassThru -Wait -RedirectStandardOutput $out -RedirectStandardError $err
            if ($probe.ExitCode -eq 0) {
              throw 'FQ_MISSING_Q0_EXE_FALSIFIED_STANDALONE_SUCCESS'
            }
            $message = Get-Content -LiteralPath $err -Raw
            if (-not $message.Contains('FQ_DEPLOY_EXE_LOCAL_14_Q0_FIR_UNAVAILABLE')) {
              throw 'FQ_MISSING_Q0_FAILED_FOR_UNEXPECTED_REASON'
            }
            Write-Host 'FQ_MISSING_Q0_EXE_LOCAL_FAIL_CLOSED_PASS'
          } finally {
            Remove-Item Env:RGSML_FINAL_SRC_Q0_PRIVATE_DIR -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $hold) {
              Move-Item -LiteralPath $hold -Destination $original
            }
          }
          python tools/qualification/playback_src/verify_installed_16_firs.py --fir-root "$root"
          if ($LASTEXITCODE -ne 0) {
            throw 'FQ_PACKAGE_NOT_PRISTINE_AFTER_NEGATIVE_TEST'
          }

      # A SHA-pinned original with only ONE payload bit altered must fail
      # the real deployed EXE's standalone resource admission, not merely
      # the external source-tree Python verifier. Restore and re-pin all 16.
      - name: Cold deploy negative — reject one-bit corrupt original FIR
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'build/windows-fq-ninja/stage/CI/Release'
          $exe = Join-Path $stage 'bin/RGSMasterLab.exe'
          $root = Join-Path $stage 'bin/resources/fir'
          $original = Join-Path $root 'RGSMSR1_L1_M2.bin'
          $backup = Join-Path $env:RUNNER_TEMP 'rgsml-fq-q0-bitflip-backup.bin'
          if (-not (Test-Path -LiteralPath $original) -or
              (Test-Path -LiteralPath $backup)) {
            throw 'FQ_BITFLIP_REQUIRES_PRISTINE_ORIGINAL_Q0'
          }
          Copy-Item -LiteralPath $original -Destination $backup
          try {
            $bytes = [System.IO.File]::ReadAllBytes($original)
            if ($bytes.Length -lt 32) { throw 'FQ_Q0_BITFLIP_INPUT_TOO_SHORT' }
            # Mutate a real coefficient payload byte, not the file header,
            # then leave the installed manifest untouched (strict SHA test).
            $last = $bytes.Length - 1
            $bytes[$last] = [byte]($bytes[$last] -bxor 1)
            [System.IO.File]::WriteAllBytes($original, $bytes)
            $out = Join-Path $env:RUNNER_TEMP 'fq-corrupt-q0.stdout.txt'
            $err = Join-Path $env:RUNNER_TEMP 'fq-corrupt-q0.stderr.txt'
            $probe = Start-Process -FilePath $exe -ArgumentList '--rgsml-deploy-smoke' -PassThru -Wait -RedirectStandardOutput $out -RedirectStandardError $err
            if ($probe.ExitCode -eq 0) {
              throw 'FQ_CORRUPT_Q0_EXE_FALSIFIED_STANDALONE_SUCCESS'
            }
            $message = Get-Content -LiteralPath $err -Raw
            if (-not $message.Contains('FQ_DEPLOY_EXE_LOCAL_14_Q0_FIR_UNAVAILABLE')) {
              throw 'FQ_CORRUPT_Q0_FAILED_FOR_UNEXPECTED_REASON'
            }
            Write-Host 'FQ_CORRUPT_Q0_SINGLE_BIT_FAIL_CLOSED_PASS'
          } finally {
            Copy-Item -LiteralPath $backup -Destination $original -Force
            Remove-Item -LiteralPath $backup -ErrorAction SilentlyContinue
          }
          python tools/qualification/playback_src/verify_installed_16_firs.py --fir-root "$root"
          if ($LASTEXITCODE -ne 0) {
            throw 'FQ_PACKAGE_NOT_PRISTINE_AFTER_BITFLIP_NEGATIVE'
          }

      # Confirm the deployed application actually resolves its executable-
      # relative FIR and Qt resources when moved to a real non-ASCII path.
      # No network, installed developer profile or manual FIR selection.
      - name: Cold deployed EXE moved to Unicode path still authenticates Q0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'build/windows-fq-ninja/stage/CI/Release'
          $moved = Join-Path $env:RUNNER_TEMP 'RGS MasterLab trasferito à Ω 中文'
          New-Item -Path $moved -ItemType Directory -Force | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $moved -Recurse -Force
          $exe = Join-Path $moved 'bin/RGSMasterLab.exe'
          $fir = Join-Path $moved 'bin/resources/fir'
          python tools/qualification/playback_src/verify_installed_16_firs.py --fir-root "$fir"
          if ($LASTEXITCODE -ne 0) {
            throw 'FQ_UNICODE_MOVED_16_FIR_PACKAGE_FAILED'
          }
          $out = Join-Path $env:RUNNER_TEMP 'fq-relocated-unicode.stdout.txt'
          $err = Join-Path $env:RUNNER_TEMP 'fq-relocated-unicode.stderr.txt'
          $probe = Start-Process -FilePath $exe -ArgumentList '--rgsml-deploy-smoke' -PassThru -Wait -RedirectStandardOutput $out -RedirectStandardError $err
          if ($probe.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $err) {
              Get-Content -LiteralPath $err | Select-Object -Last 80
            }
            throw "FQ_UNICODE_MOVED_EXE_FAILED_$($probe.ExitCode)"
          }
          Write-Host 'FQ_UNICODE_MOVED_EXE_LOCAL_16_FIR_QT_SMOKE_PASS'

      # The deployed EXE must READ its pinned FIR assets and must never
      # try to rewrite the bank or manifest when the install is read-only.
      # This is a cold deployment property, not a Windows developer-profile
      # override. Restore file attributes even if the assertion fails.
      - name: Cold deploy with read-only authenticated FIR assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'build/windows-fq-ninja/stage/CI/Release'
          $exe = Join-Path $stage 'bin/RGSMasterLab.exe'
          $root = Join-Path $stage 'bin/resources/fir'
          python tools/qualification/playback_src/verify_installed_16_firs.py --fir-root "$root"
          if ($LASTEXITCODE -ne 0) { throw 'FQ_READONLY_PRISTINE_FIRS_REQUIRED' }
          $files = @(Get-ChildItem -LiteralPath $root -File)
          if ($files.Count -ne 17) { throw 'FQ_READONLY_EXPECTED_16_FIR_AND_MANIFEST' }
          try {
            foreach ($file in $files) { $file.IsReadOnly = $true }
            $out = Join-Path $env:RUNNER_TEMP 'fq-readonly-fir.stdout.txt'
            $err = Join-Path $env:RUNNER_TEMP 'fq-readonly-fir.stderr.txt'
            $probe = Start-Process -FilePath $exe -ArgumentList '--rgsml-deploy-smoke' -PassThru -Wait -RedirectStandardOutput $out -RedirectStandardError $err
            if ($probe.ExitCode -ne 0) {
              throw "FQ_READONLY_FIR_EXE_FAILED_$($probe.ExitCode)"
            }
            Write-Host 'FQ_READONLY_EXE_LOCAL_16_FIR_PASS'
          } finally {
            foreach ($file in $files) { $file.IsReadOnly = $false }
          }
          python tools/qualification/playback_src/verify_installed_16_firs.py --fir-root "$root"
          if ($LASTEXITCODE -ne 0) { throw 'FQ_READONLY_RESTORE_FIR_SHA_MISMATCH' }

      - name: Cache statistics and cold/warm evidence classification
        if: always()
        shell: pwsh
        run: |
          Write-Host "FQ_SHA=$env:RGSML_FQ_SHA MODE=$env:RGSML_FQ_CACHE_MODE"
          if ($env:RGSML_FQ_CACHE_MODE -eq 'warm') { sccache --show-stats }
          if ($env:RGSML_FQ_CACHE_MODE -eq 'cold') {
            Write-Host 'FQ_COLD_AUTOMATED_CHECKS_PASSED_PENDING_PO_GATES'
          } else {
            Write-Host 'FQ_WARM_PERFORMANCE_ONLY_NOT_AUTHORITATIVE'
          }
      - name: Upload FQ cold/warm provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-FQ-Ninja-Adoption-Evidence-${{ github.run_number }}-${{ github.sha }}
          path: build/fq-adoption-evidence/*.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload staged FQ candidate artifact (cold only)
        if: ${{ success() && inputs.cache_mode == 'cold' }}
        uses: actions/upload-artifact@v4
        with:
          name: RGS-MasterLab-Windows-FQ-${{ github.run_number }}-${{ github.sha }}
          path: build/windows-fq-ninja/stage/CI/Release/**
          retention-days: 7
          if-no-files-found: error
