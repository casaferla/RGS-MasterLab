name: L2 minimal AutoMatch evidence bridge (focused, nonrelease)
on:
  push:
    branches:
      - staging/l2-minimal-automatch-evidence-focused-20261121
permissions:
  contents: read
jobs:
  native-l2-bridge:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Qt on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0" "py7zr==1.1.0"
          if ($LASTEXITCODE -ne 0) { throw 'L2_QT_DEP_FAILED' }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -m qtmultimedia
          if ($LASTEXITCODE -ne 0) { throw 'L2_QT_FAILED' }
      - name: Prepare Qt on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build qt6-base-dev qt6-declarative-dev qt6-multimedia-dev libgl1-mesa-dev libxkbcommon-dev libegl1-mesa-dev libdbus-1-dev
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Build and run authentic M21/L2 QtTest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'l2-native-bounded.log'
          cmake -S . -B build-l2 -G 'Visual Studio 17 2022' -A x64 -DRGSML_BUILD_TESTS=ON -DRGSML_WARNINGS_AS_ERRORS=ON "-DRGSML_QT_ROOT=$env:GITHUB_WORKSPACE/6.8.3/msvc2022_64" *> $log
          if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 55; throw 'L2_CONFIGURE_FAILED' }
          cmake --build build-l2 --config Release --parallel 4 --target rgsml_m21_real_product_metrics_port_tests *> $log
          if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 55; throw 'L2_BUILD_FAILED' }
          $env:PATH="$env:GITHUB_WORKSPACE/6.8.3/msvc2022_64/bin;$env:PATH"
          ctest --test-dir build-l2 -C Release --output-on-failure -R '^rgsml_m21_real_product_metrics_port_tests$' *> $log
          if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 65; throw 'L2_NATIVE_TEST_FAILED' }
          Get-Content $log -Tail 7
      - name: Build and run authentic M21/L2 QtTest (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S . -B build-l2 -G Ninja -DRGSML_BUILD_TESTS=ON -DRGSML_WARNINGS_AS_ERRORS=ON > /tmp/l2-native-bounded.log 2>&1 || { tail -n 55 /tmp/l2-native-bounded.log; exit 1; }
          cmake --build build-l2 --parallel 4 --target rgsml_m21_real_product_metrics_port_tests > /tmp/l2-native-bounded.log 2>&1 || { tail -n 55 /tmp/l2-native-bounded.log; exit 1; }
          ctest --test-dir build-l2 --output-on-failure -R '^rgsml_m21_real_product_metrics_port_tests$' > /tmp/l2-native-bounded.log 2>&1 || { tail -n 65 /tmp/l2-native-bounded.log; exit 1; }
          tail -n 7 /tmp/l2-native-bounded.log
