      # Failure-only CTest assertions filtered ON RUNNER; no raw logs uploaded.
      - name: Capture bounded Windows failing-test assertions
        if: failure()
        shell: pwsh
        run: |
          python tools/ci/summarize_focused_tests.py --ctest-dir build/windows-ninja-cache/Testing/Temporary --output "$env:RUNNER_TEMP/rgsml-focused-windows-test-summary.txt" --qt-smoke-log "$env:GITHUB_WORKSPACE/m12b-smoke.txt"
          if ($LASTEXITCODE -ne 0) { throw 'FOCUSED_TEST_DIAGNOSTIC_FAILED' }
      - name: Attach bounded Windows test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-Focused-Test-Errors-Windows-${{ github.run_number }}-${{ github.sha }}
