          retention-days: 7
          if-no-files-found: error

      - name: Run Focused DSP Tests (Release)
        env:
          RGSML_GUI01_EVIDENCE_DIR: ${{ github.workspace }}\build\visual-evidence
          RGS_M17_CPU_PROBE_FILE: ${{ runner.temp }}/rgs-m17-cpu-windows.csv
          RGS_M17_PARTITION_PROBE_FILE: ${{ runner.temp }}/rgs-m17-partition-windows.csv
          RGS_M17_LOOKAHEAD_PROBE_FILE: ${{ runner.temp }}/rgs-m17-lookahead-windows.csv
          RGS_M17_BOUND_PROBE_FILE: ${{ runner.temp }}/rgs-m17-bound-windows.csv
        run: |
          $env:PATH = "$env:RGSML_QT_ROOT\bin;$env:PATH"
          $env:QML2_IMPORT_PATH = "$env:RGSML_QT_ROOT\qml"
          ctest --test-dir build/windows-ninja-cache -C Release -R "^(rgsml_dsp_|rgsml_gain_|rgsml_true_peak_itu4x_coefficients_tests|rgsml_true_peak_itu4x_channel_stream_tests|rgsml_true_peak_full_resource_tests|rgsml_true_peak_measurement_tests|rgsml_true_peak_static_binding_tests|rgsml_true_peak_gate_g_edge_tests|rgsml_true_peak_chunk_invariance_tests|rgsml_true_peak_b2b_probe_selftest|rgsml_stereo_ms_parameters_tests|rgsml_stereo_ms_module_tests|rgsml_stereo_ms_crossover_tests|rgsml_stereo_ms_crossover_runtime_tests|rgsml_stereo_ms_module_streaming_tests|rgsml_stereo_ms_checkpoint_tests|rgsml_stereo_ms_independent_math_tests|rgsml_stereo_ms_long_resume_tests|rgsml_stereo_ms_gate_g_spatial_evidence_tests|rgsml_stereo_ms_no_alloc_tests|rgsml_stereo_ms_width_tests|rgsml_stereo_ms_width_response_tests|rgsml_stereo_ms_signature_tests|rgsml_stereo_ms_view_model_tests|rgsml_stereo_ms_audible_resolver_tests|rgsml_compressor_|rgsml_module_parameter_codec_tests|rgsml_parametric_eq_|rgsml_eq_view_model_|rgsml_mastering_chain_state_tests|rgsml_master_output_rate_state_tests|rgsml_master_output_rate_codec_tests|rgsml_terminal_private_gr_projection_tests|rgsml_terminal_product_activation_tests|rgsml_mastering_preview_controller_tests|rgsml_render_preview_tests|rgsml_audition_source_selector_tests|rgsml_source_metadata_panel_smoke|rgsml_project_session_tests|rgsml_playback_src_tests|rgsml_external_playback_fir_assets_tests|rgsml_playback_support_tests|render_public_headers_standalone|render_dependency_rule_positive_fixture|toolchain_manifest_)" --output-on-failure --verbose

      # One PR Focused CI, with a tiny Windows-only M17 product scenario
      # report. The portable Linux DSP job remains independently authoritative;
      # neither job is an offline FQ or Windows physical-audio qualification.
      - name: Produce bounded M17 adversarial matrix report (Windows)
        if: always()
        shell: pwsh
        run: |
          python tools/ci/test_summarize_m17_edge_matrix.py
          if ($LASTEXITCODE -ne 0) { throw 'M17_EDGE_MATRIX_FILTER_SELFTEST_FAILED' }
          # Directly replay ONLY the finite 36x36 matrix QtTest function.
          # Its raw local output is never uploaded and never requested from
          # GitHub Actions. Exit code and one positive post-assertion marker
          # are summarized into the bounded 4-KiB artifact.
          $exe = "build/windows-ninja-cache/Release/rgsml_terminal_product_activation_tests.exe"
          $rawGrid = "$env:RUNNER_TEMP/rgsml-direct-rate-grid-local.txt"
          $gridExit = 127
          if (Test-Path $exe) {
            $env:PATH = "$env:RGSML_QT_ROOT\bin;$env:PATH"
            # Direct QtTest bypasses CTest ENVIRONMENT_MODIFICATION:
            # supply the same already-produced exact frozen external FIRs.
            $env:RGSML_PLAYBACK_FIR_ROOT = (Join-Path $env:GITHUB_WORKSPACE 'build/windows-ninja-cache/generated/rgsml/fir/playback')
            & $exe sixSourceBySixTargetOfflineMasterAndDeviceRateMatrix -v1 -o "$rawGrid,txt" 2>&1 | Out-Null
            $gridExit = $LASTEXITCODE
          }
          python tools/ci/summarize_m17_edge_matrix.py --ctest-log "build/windows-ninja-cache/Testing/Temporary/LastTest.log" --direct-qtest-log "$rawGrid" --direct-exit-code $gridExit --output "$env:RUNNER_TEMP/rgsml-m17-edge-matrix.txt" --sha '${{ github.event.pull_request.head.sha || github.sha }}'
          if ($LASTEXITCODE -ne 0) { throw 'M17_EDGE_MATRIX_FILTER_FAILED' }
          if ($gridExit -ne 0) { throw "M17_RATE_GRID_DIRECT_TEST_FAILED_$gridExit" }
          # An ordinary CTest PASS without the exact counted rate-grid
          # marker is not a positive attestation. Fail this Focused gate.
          $bounded = Get-Content "$env:RUNNER_TEMP/rgsml-m17-edge-matrix.txt" -Raw -ErrorAction SilentlyContinue
          if ($bounded -notmatch 'RATE_GRID_36_MASTER_36_WAV_36_DEVICE=CONFIRMED') {
            throw 'M17_RATE_GRID_36X36_POSITIVE_PROOF_MISSING'
          }

      - name: Attach bounded M17 adversarial matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-M17-Edge-Matrix-Windows-${{ github.run_number }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/rgsml-m17-edge-matrix.txt
          retention-days: 7
          if-no-files-found: warn

      # Scoped failure-only probe: never request entire GitHub job logs.
      # QtTest can abort before CTest emits an assertion; retain the exact
      # native process exit and at most the last 36 lines for this one test.
      - name: Capture terminal activation crash boundary (Windows only)
        if: failure()
        shell: pwsh
        continue-on-error: true
        run: |
          $env:PATH = "$env:RGSML_QT_ROOT\bin;$env:PATH"
          $exe = "build/windows-ninja-cache/Release/rgsml_terminal_product_activation_tests.exe"
          $raw = "$env:RUNNER_TEMP/rgsml-terminal-activation-qt.txt"
          $dest = "$env:RUNNER_TEMP/rgsml-terminal-activation-bounded.txt"
          $result = [System.Collections.Generic.List[string]]::new()
          $result.Add("RGS M17 TERMINAL ACTIVATION FAIL-ONLY DIAGNOSTIC")
          $result.Add("No raw QtTest or GitHub workflow log is uploaded.")
          if (Test-Path $exe) {
            & $exe -v1 -o "$raw,txt" 2>&1 | Out-Null
            $code = $LASTEXITCODE
            $result.Add("PROCESS_EXIT_CODE=$code")
            if (Test-Path $raw) {
              # Do NOT upload the full QtTest output. The chronological
              # tail may omit the first FAILED assertion in a multi-test
              # executable. Capture up to four bounded FAIL contexts FIRST.
              $lines = @(Get-Content $raw -ErrorAction SilentlyContinue)
              $failures = 0
              for ($i = 0; $i -lt $lines.Count -and $failures -lt 4; $i++) {
                if ($lines[$i] -match '^(FAIL!|QFATAL|FAIL\s*:)') {
                  $failures++
                  $result.Add("ASSERTION_CONTEXT_$failures")
                  for ($offset = 0; $offset -le 3 -and ($i + $offset) -lt $lines.Count; $offset++) {
                    $line = [string]$lines[$i + $offset]
                    $result.Add($line.Substring(0,[Math]::Min($line.Length,220)))
                  }
                }
              }
              if ($failures -eq 0) { $result.Add("ASSERTION_CONTEXT_NOT_EMITTED") }
              $tail = @(Get-Content $raw -Tail 18 -ErrorAction SilentlyContinue)
              foreach ($line in $tail) { $result.Add($line.Substring(0,[Math]::Min($line.Length,180))) }
            } else {
              $result.Add("QTTEST_FILE_NOT_CREATED")
            }
          } else {
            $result.Add("TARGET_EXE_NOT_FOUND")
          }
          ($result -join "`n").Substring(0,[Math]::Min(($result -join "`n").Length,7000)) | Set-Content $dest -Encoding utf8
      - name: Upload bounded M17 terminal crash diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RGS-M17-Terminal-Fail-Windows-${{ github.run_number }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/rgsml-terminal-activation-bounded.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Upload bounded M17 CPU probe (Windows)
        if: success()
