# M22 private only; does NOT qualify M22, activate product code or authorize merge.
name: M22 Independent Preproduction CI
on:
  push:
    branches:
      - experimental/m22-full-manual-chain-20261104
    paths:
      - 'render/src/internal/m22_*.hpp'
      - 'tools/qualification/m22/**'
      - 'docs/architecture/M22_PARALLEL_PREPRODUCTION_BRANCH_CONTRACT_20261104.md'
      - '.github/workflows/m22-preproduction.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m22-private-preproduction-only
  cancel-in-progress: false
jobs:
  linux-m22:
    name: M22 private · Linux GCC C++20 Debug + Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scope guard
        run: python3 tools/qualification/m22/test_m22_scope_guard.py
      - name: Immutable intent, ordered plan, frame origin, fail-closed · GCC
        shell: bash
        run: |
          set -euo pipefail
          for opt in '-O0 -g' '-O2'; do
            g++ -std=c++20 $opt -Wall -Wextra -Wpedantic -Werror -fno-fast-math -ffp-contract=off -Irender/src/internal tools/qualification/m22/m22_request_plan_selftest.cpp -o "$RUNNER_TEMP/m22-plan"
            "$RUNNER_TEMP/m22-plan"
          done
      - name: Actual M18 private PCM24/Float32 codec · crop, Philox absolute frame, chunk matrix · GCC
        shell: bash
        run: |
          set -euo pipefail
          for opt in '-O0 -g' '-O2'; do
            g++ -std=c++20 $opt -Wall -Wextra -Wpedantic -Werror -fno-fast-math -ffp-contract=off -Irender/src/internal -Iaudio/src/internal tools/qualification/m22/m22_real_m18_terminal_crop_selftest.cpp -o "$RUNNER_TEMP/m22-m18"
            "$RUNNER_TEMP/m22-m18"
          done
      - name: Stateful history + true programme EOS adversarial oracle · GCC
        shell: bash
        run: |
          set -euo pipefail
          for opt in '-O0 -g' '-O2'; do
            g++ -std=c++20 $opt -Wall -Wextra -Wpedantic -Werror -fno-fast-math -ffp-contract=off -Irender/src/internal tools/qualification/m22/m22_state_history_oracle_selftest.cpp -o "$RUNNER_TEMP/m22-state"
            "$RUNNER_TEMP/m22-state"
          done
      - name: Actual typed ProcessingChain/ModuleExecutionBinding adapter · GCC syntax-only
        shell: bash
        run: |
          set -euo pipefail
          for opt in '-O0' '-O2'; do
            g++ -std=c++20 $opt -Wall -Wextra -Wpedantic -Werror -fno-fast-math -ffp-contract=off -fsyntax-only -Irender/src/internal -Idsp/include -Iaudio/include -Icore/include -Ianalysis/include tools/qualification/m22/m22_canonical_chain_port_compile.cpp
          done
      - name: Existing M18 transactional WAV export · M22 frozen plan Full/Preview · GCC Debug+Release
        shell: bash
        run: |
          set -euo pipefail
          for opt in '-O0 -g' '-O2'; do
            g++ -std=c++20 $opt -Wall -Wextra -Wpedantic -Werror -fno-fast-math -ffp-contract=off -Irender/src/internal -Iaudio/src -Icore/include tools/qualification/m22/m22_real_m18_wav_export_selftest.cpp core/src/sha256.cpp -o "$RUNNER_TEMP/m22-disk"
            "$RUNNER_TEMP/m22-disk"
          done
      - name: Genuine M17 checked/nonconforming variant · fail-closed M22 admission · GCC
        shell: bash
        run: |
          set -euo pipefail
          for opt in '-O0 -g' '-O2'; do
            g++ -std=c++20 $opt -Wall -Wextra -Wpedantic -Werror -fno-fast-math -ffp-contract=off -Irender/src/internal -Irender/include -Idsp/include -Iaudio/include -Ianalysis/include -Icore/include tools/qualification/m22/m22_m17_admission_selftest.cpp -o "$RUNNER_TEMP/m22-m17"
            "$RUNNER_TEMP/m22-m17"
          done
      - name: Stale M22 epoch cancellation with REAL M18 transactional disk writer · GCC
        shell: bash
        run: |
          set -euo pipefail
          for opt in '-O0 -g' '-O2'; do
            g++ -std=c++20 $opt -Wall -Wextra -Wpedantic -Werror -fno-fast-math -ffp-contract=off -pthread -Irender/src/internal -Iaudio/src -Icore/include tools/qualification/m22/m22_stale_m18_transaction_selftest.cpp core/src/sha256.cpp -o "$RUNNER_TEMP/m22-stale"
            "$RUNNER_TEMP/m22-stale"
          done
  windows-m22:
    name: M22 private · Windows 2022 MSVC Debug + Release
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Scope guard
        shell: pwsh
        run: python tools/qualification/m22/test_m22_scope_guard.py
      - name: Immutable intent, ordered plan, frame origin, fail-closed · MSVC
        shell: pwsh
        run: |
          foreach ($mode in @("Debug", "Release")) {
            $opt = if ($mode -eq "Debug") { "/Od" } else { "/O2" }
            $log = "$env:RUNNER_TEMP/m22-plan-$mode.log"
            & cl.exe /nologo /std:c++20 /EHsc $opt /W4 /WX /fp:strict /Zc:__cplusplus /Irender/src/internal tools/qualification/m22/m22_request_plan_selftest.cpp "/Fe:$env:RUNNER_TEMP/m22-plan-$mode.exe" *> $log
            if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 60; throw "M22_PLAN_COMPILE_FAILED_$mode" }
            & "$env:RUNNER_TEMP/m22-plan-$mode.exe"
            if ($LASTEXITCODE -ne 0) { throw "M22_PLAN_TEST_FAILED_$mode" }
          }
      - name: Actual M18 private PCM24/Float32 codec · crop, Philox absolute frame, chunk matrix · MSVC
        shell: pwsh
        run: |
          foreach ($mode in @("Debug", "Release")) {
            $opt = if ($mode -eq "Debug") { "/Od" } else { "/O2" }
            $log = "$env:RUNNER_TEMP/m22-m18-$mode.log"
            & cl.exe /nologo /std:c++20 /EHsc $opt /W4 /WX /fp:strict /Zc:__cplusplus /Irender/src/internal /Iaudio/src/internal tools/qualification/m22/m22_real_m18_terminal_crop_selftest.cpp "/Fe:$env:RUNNER_TEMP/m22-m18-$mode.exe" *> $log
            if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 60; throw "M22_M18_BUILD_FAILED_$mode" }
            & "$env:RUNNER_TEMP/m22-m18-$mode.exe"
            if ($LASTEXITCODE -ne 0) { throw "M22_M18_TEST_FAILED_$mode" }
          }
      - name: Stateful history + true programme EOS adversarial oracle · MSVC
        shell: pwsh
        run: |
          foreach ($mode in @("Debug", "Release")) {
            $opt = if ($mode -eq "Debug") { "/Od" } else { "/O2" }
            $log = "$env:RUNNER_TEMP/m22-state-$mode.log"
            & cl.exe /nologo /std:c++20 /EHsc $opt /W4 /WX /fp:strict /Zc:__cplusplus /Irender/src/internal tools/qualification/m22/m22_state_history_oracle_selftest.cpp "/Fe:$env:RUNNER_TEMP/m22-state-$mode.exe" *> $log
            if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 60; throw "M22_STATE_BUILD_FAILED_$mode" }
            & "$env:RUNNER_TEMP/m22-state-$mode.exe"
            if ($LASTEXITCODE -ne 0) { throw "M22_STATE_TEST_FAILED_$mode" }
          }
      - name: Actual typed ProcessingChain/ModuleExecutionBinding adapter · MSVC syntax-only
        shell: pwsh
        run: |
          foreach ($mode in @("Debug", "Release")) {
            $opt = if ($mode -eq "Debug") { "/Od" } else { "/O2" }
            $log = "$env:RUNNER_TEMP/m22-port-$mode.log"
            & cl.exe /nologo /std:c++20 /Zs /EHsc $opt /W4 /WX /fp:strict /Zc:__cplusplus /Irender/src/internal /Idsp/include /Iaudio/include /Icore/include /Ianalysis/include tools/qualification/m22/m22_canonical_chain_port_compile.cpp *> $log
            if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 60; throw "M22_CANONICAL_PORT_COMPILE_FAILED_$mode" }
          }
      - name: Existing M18 transactional WAV export · M22 frozen plan Full/Preview · MSVC Debug+Release
        shell: pwsh
        run: |
          foreach ($mode in @("Debug", "Release")) {
            $opt = if ($mode -eq "Debug") { "/Od" } else { "/O2" }
            $log = "$env:RUNNER_TEMP/m22-disk-$mode.log"
            & cl.exe /nologo /std:c++20 /EHsc $opt /W4 /WX /fp:strict /Zc:__cplusplus /Irender/src/internal /Iaudio/src /Icore/include tools/qualification/m22/m22_real_m18_wav_export_selftest.cpp core/src/sha256.cpp "/Fe:$env:RUNNER_TEMP/m22-disk-$mode.exe" *> $log
            if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 70; throw "M22_M18_DISK_COMPILE_FAILED_$mode" }
            & "$env:RUNNER_TEMP/m22-disk-$mode.exe"
            if ($LASTEXITCODE -ne 0) { throw "M22_M18_DISK_TEST_FAILED_$mode" }
          }
      - name: Genuine M17 checked/nonconforming variant · fail-closed M22 admission · MSVC
        shell: pwsh
        run: |
          foreach ($mode in @("Debug", "Release")) {
            $opt = if ($mode -eq "Debug") { "/Od" } else { "/O2" }
            $log = "$env:RUNNER_TEMP/m22-m17-$mode.log"
            & cl.exe /nologo /std:c++20 /EHsc $opt /W4 /WX /fp:strict /Zc:__cplusplus /Irender/src/internal /Irender/include /Idsp/include /Iaudio/include /Ianalysis/include /Icore/include tools/qualification/m22/m22_m17_admission_selftest.cpp "/Fe:$env:RUNNER_TEMP/m22-m17-$mode.exe" *> $log
            if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 70; throw "M22_M17_ADMISSION_COMPILE_FAILED_$mode" }
            & "$env:RUNNER_TEMP/m22-m17-$mode.exe"
            if ($LASTEXITCODE -ne 0) { throw "M22_M17_ADMISSION_TEST_FAILED_$mode" }
          }
      - name: Stale M22 epoch cancellation with REAL M18 transactional disk writer · MSVC
        shell: pwsh
        run: |
          foreach ($mode in @("Debug", "Release")) {
            $opt = if ($mode -eq "Debug") { "/Od" } else { "/O2" }
            $log = "$env:RUNNER_TEMP/m22-stale-$mode.log"
            & cl.exe /nologo /std:c++20 /EHsc $opt /W4 /WX /fp:strict /Zc:__cplusplus /Irender/src/internal /Iaudio/src /Icore/include tools/qualification/m22/m22_stale_m18_transaction_selftest.cpp core/src/sha256.cpp "/Fe:$env:RUNNER_TEMP/m22-stale-$mode.exe" *> $log
            if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 70; throw "M22_STALE_COMPILE_FAILED_$mode" }
            & "$env:RUNNER_TEMP/m22-stale-$mode.exe"
            if ($LASTEXITCODE -ne 0) { throw "M22_STALE_TEST_FAILED_$mode" }
          }
