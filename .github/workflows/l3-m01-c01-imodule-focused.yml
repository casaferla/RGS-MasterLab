name: L3-M01 Dynamic EQ C01 IModule/checkpoint (focused, nonrelease)
on:
  push:
    branches:
      - staging/l3-m01-c01-focused-20261121
permissions:
  contents: read
jobs:
  native-l2-bridge:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Qt on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0" "py7zr==1.1.0"
          if ($LASTEXITCODE -ne 0) { throw 'L3_QT_DEP_FAILED' }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -m qtmultimedia
          if ($LASTEXITCODE -ne 0) { throw 'L3_QT_FAILED' }
      - name: Prepare Qt on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev libegl1-mesa-dev libdbus-1-dev
          python3 -m pip install --disable-pip-version-check "aqtinstall==3.3.0" "py7zr==1.1.0"
          python3 -m aqt install-qt linux desktop 6.8.3 linux_gcc_64 -m qtmultimedia
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Build and run frozen Dynamic EQ IModule QtTest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $log=Join-Path $env:RUNNER_TEMP 'l3-dyn-bounded.log'
          cmake -S . -B build-dyn -G 'Visual Studio 17 2022' -A x64 -DRGSML_BUILD_TESTS=ON -DRGSML_WARNINGS_AS_ERRORS=ON "-DRGSML_QT_ROOT=$env:GITHUB_WORKSPACE/6.8.3/msvc2022_64" *> $log
          if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 55; throw 'L3_CONFIGURE_FAILED' }
          cmake --build build-dyn --config Release --parallel 4 --target rgsml_dsp_dynamic_eq_imodule_tests *> $log
          if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 55; throw 'L3_BUILD_FAILED' }
          $env:PATH="$env:GITHUB_WORKSPACE/6.8.3/msvc2022_64/bin;$env:PATH"
          ctest --test-dir build-dyn -C Release --output-on-failure -R '^rgsml_dsp_dynamic_eq_imodule_tests$' *> $log
          if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 65; throw 'L3_NATIVE_TEST_FAILED' }
          Get-Content $log -Tail 7
      - name: Build and run frozen Dynamic EQ IModule QtTest (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S . -B build-dyn -G Ninja -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/6.8.3/gcc_64" -DRGSML_BUILD_TESTS=ON -DRGSML_WARNINGS_AS_ERRORS=ON > /tmp/l3-dyn-bounded.log 2>&1 || { tail -n 55 /tmp/l3-dyn-bounded.log; exit 1; }
          cmake --build build-dyn --parallel 4 --target rgsml_dsp_dynamic_eq_imodule_tests > /tmp/l3-dyn-bounded.log 2>&1 || { tail -n 55 /tmp/l3-dyn-bounded.log; exit 1; }
          ctest --test-dir build-dyn --output-on-failure -R '^rgsml_dsp_dynamic_eq_imodule_tests$' > /tmp/l3-dyn-bounded.log 2>&1 || { tail -n 65 /tmp/l3-dyn-bounded.log; exit 1; }
          tail -n 7 /tmp/l3-dyn-bounded.log
