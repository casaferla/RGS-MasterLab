# Only M20 private preproduction. No M20 merge, production package, Qt, FQ, FIR, M17/M18/M19 gate.
name: M20 Independent Preproduction CI
on:
  push:
    branches:
      - experimental/m20-tonal-stereo-20261103
    paths:
      - 'analysis/src/internal/m20_*.hpp'
      - 'tools/qualification/m20/**'
      - 'docs/architecture/M20_PARALLEL_PREPRODUCTION_BRANCH_CONTRACT_20261103.md'
      - '.github/workflows/m20-preproduction.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m20-preproduction-only
  cancel-in-progress: false
jobs:
  linux-m20:
    name: M20 only · Linux GCC C++20 Debug + Release
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independent Python rational/Decimal oracle
        shell: bash
        run: python3 tools/qualification/m20/test_m20_independent_reference.py
      - name: Private C++20 tonal/stereo and REAL shared FFT/Hann/PSD · both modes
        shell: bash
        run: |
          set -euo pipefail
          for opts in "-O0 -g" "-O2"; do
            g++ -std=c++20 $opts -Wall -Wextra -Wpedantic -Werror -fno-fast-math -ffp-contract=off -Ianalysis/src tools/qualification/m20/m20_portable_selftest.cpp -o "$RUNNER_TEMP/m20-portable"
            "$RUNNER_TEMP/m20-portable"
            g++ -std=c++20 $opts -Wall -Wextra -Wpedantic -Werror -fno-fast-math -ffp-contract=off -Ianalysis/src -Ianalysis/include tools/qualification/m20/m20_actual_spectral_reuse_selftest.cpp analysis/src/fft.cpp analysis/src/hann.cpp analysis/src/psd.cpp -o "$RUNNER_TEMP/m20-real"
            "$RUNNER_TEMP/m20-real"
          done
          echo M20_LINUX_PREPRODUCTION_PASS_NOT_U_OR_G
      - name: Real canonical six-rate scope spectrum / externally supplied gate mask · both modes
        shell: bash
        run: |
          set -euo pipefail
          for opts in "-O0 -g" "-O2"; do
            g++ -std=c++20 $opts -Wall -Wextra -Wpedantic -Werror -fno-fast-math -ffp-contract=off -Ianalysis/src -Ianalysis/include tools/qualification/m20/m20_scope_spectrum_selftest.cpp analysis/src/fft.cpp analysis/src/hann.cpp analysis/src/psd.cpp -o "$RUNNER_TEMP/m20-scope"
            "$RUNNER_TEMP/m20-scope"
          done
          echo M20_REAL_SCOPE_LINUX_PASS_NOT_GATE_G
      - name: M20 independent exact Fraction/Decimal profile reference
        shell: bash
        run: python3 tools/qualification/m20/test_m20_profile_reference.py
      - name: M20 six-rate normalized profile/common bandwidth · REAL FFT · Debug + Release
        shell: bash
        run: |
          set -euo pipefail
          for opts in "-O0 -g" "-O2"; do
            g++ -std=c++20 $opts -Wall -Wextra -Wpedantic -Werror -fno-fast-math -ffp-contract=off -Ianalysis/src -Ianalysis/include tools/qualification/m20/m20_normalized_profile_selftest.cpp analysis/src/fft.cpp analysis/src/hann.cpp analysis/src/psd.cpp -o "$RUNNER_TEMP/m20-profile"
            "$RUNNER_TEMP/m20-profile"
          done
      - name: M20 actual AudioBufferView scope and frame-domain integration · both modes
        shell: bash
        run: |
          set -euo pipefail
          for opts in "-O0 -g" "-O2"; do
            g++ -std=c++20 $opts -Wall -Wextra -Wpedantic -Werror -fno-fast-math -ffp-contract=off -Ianalysis/src -Ianalysis/include -Iaudio/include -Icore/include tools/qualification/m20/m20_real_audio_scope_selftest.cpp analysis/src/fft.cpp analysis/src/hann.cpp analysis/src/psd.cpp audio/src/audio_buffer.cpp audio/src/audio_format.cpp core/src/checked_integer.cpp core/src/frame_time.cpp core/src/rational.cpp core/src/error.cpp -o "$RUNNER_TEMP/m20-audioscope"
            "$RUNNER_TEMP/m20-audioscope"
          done
      - name: M20 independent exact stereo temporal/union reference
        shell: bash
        run: python3 tools/qualification/m20/test_m20_stereo_reference.py
      - name: Six-rate stereo correlation, Width, active union and range adversaries · both modes
        shell: bash
        run: |
          set -euo pipefail
          for opts in "-O0 -g" "-O2"; do
            g++ -std=c++20 $opts -Wall -Wextra -Wpedantic -Werror -fno-fast-math -ffp-contract=off -Ianalysis/src tools/qualification/m20/m20_stereo_adversarial_selftest.cpp -o "$RUNNER_TEMP/m20-stereo-adv" >"$RUNNER_TEMP/m20-stereo-diagnostic.log" 2>&1 || { tail -n 40 "$RUNNER_TEMP/m20-stereo-diagnostic.log" >"$RUNNER_TEMP/m20-stereo-bounded.txt"; exit 1; }
            "$RUNNER_TEMP/m20-stereo-adv" >>"$RUNNER_TEMP/m20-stereo-diagnostic.log" 2>&1 || { tail -n 40 "$RUNNER_TEMP/m20-stereo-diagnostic.log" >"$RUNNER_TEMP/m20-stereo-bounded.txt"; exit 1; }
          done
      - name: Preserve ONLY bounded Linux failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: M20-Linux-bounded-diagnostic
          path: ${{ runner.temp }}/m20-stereo-bounded.txt
          if-no-files-found: ignore
      - name: Actual M19 candidate snapshot + Phase-6 gate proof boundary · both modes
        shell: bash
        run: |
          set -euo pipefail
          for opts in "-O0 -g" "-O2"; do
            g++ -std=c++20 $opts -Wall -Wextra -Wpedantic -Werror -fno-fast-math -ffp-contract=off -Ianalysis/src -Ianalysis/include -Iaudio/include -Icore/include tools/qualification/m20/m20_m19_phase6_port_selftest.cpp analysis/src/fft.cpp analysis/src/hann.cpp analysis/src/psd.cpp -o "$RUNNER_TEMP/m20-phase6-port"
            "$RUNNER_TEMP/m20-phase6-port"
          done
  windows-m20:
    name: M20 only · Windows 2022 MSVC Debug + Release
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Independent Python rational/Decimal oracle
        shell: pwsh
        run: python tools/qualification/m20/test_m20_independent_reference.py
      - name: Private C++20 tonal/stereo and REAL shared FFT/Hann/PSD · both modes
        shell: pwsh
        run: |
          foreach ($mode in @("Debug","Release")) {
            $opt = if ($mode -eq "Debug") { "/Od" } else { "/O2" }
            $log = "$env:RUNNER_TEMP/m20-native-$mode.log"
            & cl.exe /nologo /std:c++20 /EHsc $opt /W4 /WX /fp:strict /Zc:__cplusplus /Ianalysis/src tools/qualification/m20/m20_portable_selftest.cpp "/Fe:$env:RUNNER_TEMP/m20-native-$mode.exe" *> $log
            if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 80; throw "M20_PRIVATE_COMPILE_FAILED_$mode" }
            & "$env:RUNNER_TEMP/m20-native-$mode.exe"
            if ($LASTEXITCODE -ne 0) { throw "M20_PRIVATE_TEST_FAILED_$mode" }
            $log = "$env:RUNNER_TEMP/m20-real-$mode.log"
            & cl.exe /nologo /std:c++20 /EHsc $opt /W4 /WX /fp:strict /Zc:__cplusplus /Ianalysis/src /Ianalysis/include tools/qualification/m20/m20_actual_spectral_reuse_selftest.cpp analysis/src/fft.cpp analysis/src/hann.cpp analysis/src/psd.cpp "/Fe:$env:RUNNER_TEMP/m20-real-$mode.exe" *> $log
            if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 80; throw "M20_REAL_FFT_COMPILE_FAILED_$mode" }
            & "$env:RUNNER_TEMP/m20-real-$mode.exe"
            if ($LASTEXITCODE -ne 0) { throw "M20_REAL_FFT_TEST_FAILED_$mode" }
          }
          Write-Output M20_WINDOWS_PREPRODUCTION_PASS_NOT_U_OR_G
      - name: Real canonical six-rate scope spectrum / externally supplied gate mask · both modes
        shell: pwsh
        run: |
          foreach ($mode in @("Debug","Release")) {
            $opt = if ($mode -eq "Debug") { "/Od" } else { "/O2" }
            $log = "$env:RUNNER_TEMP/m20-scope-$mode.log"
            & cl.exe /nologo /std:c++20 /EHsc $opt /W4 /WX /fp:strict /Zc:__cplusplus /Ianalysis/src /Ianalysis/include tools/qualification/m20/m20_scope_spectrum_selftest.cpp analysis/src/fft.cpp analysis/src/hann.cpp analysis/src/psd.cpp "/Fe:$env:RUNNER_TEMP/m20-scope-$mode.exe" *> $log
            if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 80; throw "M20_SCOPE_COMPILE_FAILED_$mode" }
            & "$env:RUNNER_TEMP/m20-scope-$mode.exe"
            if ($LASTEXITCODE -ne 0) { throw "M20_SCOPE_TEST_FAILED_$mode" }
          }
          Write-Output M20_REAL_SCOPE_WINDOWS_PASS_NOT_GATE_G
      - name: M20 independent exact Fraction/Decimal profile reference
        shell: pwsh
        run: python tools/qualification/m20/test_m20_profile_reference.py
      - name: M20 six-rate normalized profile/common bandwidth · REAL FFT · Debug + Release
        shell: pwsh
        run: |
          foreach ($mode in @("Debug","Release")) {
            $opt = if ($mode -eq "Debug") { "/Od" } else { "/O2" }
            $log = "$env:RUNNER_TEMP/m20-profile-$mode.log"
            & cl.exe /nologo /std:c++20 /EHsc $opt /W4 /WX /fp:strict /Zc:__cplusplus /Ianalysis/src /Ianalysis/include tools/qualification/m20/m20_normalized_profile_selftest.cpp analysis/src/fft.cpp analysis/src/hann.cpp analysis/src/psd.cpp "/Fe:$env:RUNNER_TEMP/m20-profile-$mode.exe" *> $log
            if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 80; throw "M20_PROFILE_COMPILE_FAILED_$mode" }
            & "$env:RUNNER_TEMP/m20-profile-$mode.exe"
            if ($LASTEXITCODE -ne 0) { throw "M20_PROFILE_TEST_FAILED_$mode" }
          }
          Write-Output M20_PROFILE_WINDOWS_PASS_NOT_GATE_G
      - name: M20 actual AudioBufferView scope and frame-domain integration · both modes
        shell: pwsh
        run: |
          foreach ($mode in @("Debug","Release")) {
            $opt = if ($mode -eq "Debug") { "/Od" } else { "/O2" }
            $log = "$env:RUNNER_TEMP/m20-audioscope-$mode.log"
            & cl.exe /nologo /std:c++20 /EHsc $opt /W4 /WX /fp:strict /Zc:__cplusplus /Ianalysis/src /Ianalysis/include /Iaudio/include /Icore/include tools/qualification/m20/m20_real_audio_scope_selftest.cpp analysis/src/fft.cpp analysis/src/hann.cpp analysis/src/psd.cpp audio/src/audio_buffer.cpp audio/src/audio_format.cpp core/src/checked_integer.cpp core/src/frame_time.cpp core/src/rational.cpp core/src/error.cpp "/Fe:$env:RUNNER_TEMP/m20-audioscope-$mode.exe" *> $log
            if ($LASTEXITCODE -ne 0) {
              Get-Content $log -Tail 60 | Set-Content "$env:RUNNER_TEMP/m20-audioscope-bounded.txt"
              throw "M20_AUDIOBUFFER_SCOPE_COMPILE_FAILED_$mode"
            }
            $runtime = "$env:RUNNER_TEMP/m20-audioscope-runtime-$mode.log"
            & "$env:RUNNER_TEMP/m20-audioscope-$mode.exe" *> $runtime
            if ($LASTEXITCODE -ne 0) {
              Get-Content $runtime -Tail 60 | Set-Content "$env:RUNNER_TEMP/m20-audioscope-bounded.txt"
              throw "M20_AUDIOBUFFER_SCOPE_TEST_FAILED_$mode"
            }
          }
          Write-Output M20_REAL_AUDIOBUFFER_SCOPE_WINDOWS_PASS_NOT_GATE_G
      - name: M20 independent exact stereo temporal/union reference
        shell: pwsh
        run: python tools/qualification/m20/test_m20_stereo_reference.py
      - name: Six-rate stereo correlation, Width, active union and range adversaries · both modes
        shell: pwsh
        run: |
          foreach ($mode in @("Debug","Release")) {
            $opt = if ($mode -eq "Debug") { "/Od" } else { "/O2" }
            $log = "$env:RUNNER_TEMP/m20-stereo-adv-$mode.log"
            & cl.exe /nologo /std:c++20 /EHsc $opt /W4 /WX /fp:strict /Zc:__cplusplus /Ianalysis/src tools/qualification/m20/m20_stereo_adversarial_selftest.cpp "/Fe:$env:RUNNER_TEMP/m20-stereo-adv-$mode.exe" *> $log
            if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 90; throw "M20_STEREO_ADV_COMPILE_FAILED_$mode" }
            & "$env:RUNNER_TEMP/m20-stereo-adv-$mode.exe"
            if ($LASTEXITCODE -ne 0) { throw "M20_STEREO_ADV_TEST_FAILED_$mode" }
          }
          Write-Output M20_STEREO_ADVERSARIAL_WINDOWS_PASS_NOT_GATE_G
      - name: Actual M19 candidate snapshot + Phase-6 gate proof boundary · both modes
        shell: pwsh
        run: |
          foreach ($mode in @("Debug","Release")) {
            $opt = if ($mode -eq "Debug") { "/Od" } else { "/O2" }
            $log = "$env:RUNNER_TEMP/m20-phase6-port-$mode.log"
            & cl.exe /nologo /std:c++20 /EHsc $opt /W4 /WX /fp:strict /Zc:__cplusplus /Ianalysis/src /Ianalysis/include /Iaudio/include /Icore/include tools/qualification/m20/m20_m19_phase6_port_selftest.cpp analysis/src/fft.cpp analysis/src/hann.cpp analysis/src/psd.cpp "/Fe:$env:RUNNER_TEMP/m20-phase6-port-$mode.exe" *> $log
            if ($LASTEXITCODE -ne 0) { Get-Content $log -Tail 45; throw "M20_PHASE6_PORT_COMPILE_FAILED_$mode" }
            & "$env:RUNNER_TEMP/m20-phase6-port-$mode.exe"
            if ($LASTEXITCODE -ne 0) { throw "M20_PHASE6_PORT_TEST_FAILED_$mode" }
          }
          Write-Output M20_PHASE6_PORT_WINDOWS_PREPRODUCTION_PASS_NOT_GATE_G
      - name: Preserve ONLY bounded Windows failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: M20-Windows-bounded-diagnostic
          path: ${{ runner.temp }}/m20-audioscope-bounded.txt
          if-no-files-found: ignore
