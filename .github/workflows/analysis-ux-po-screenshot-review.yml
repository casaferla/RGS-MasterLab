name: Analysis M19-M21 QtQuick PO Screenshot Review (non-FQ)

on:
  push:
    branches:
      - experimental/m19-m21-analysis-ui-po-review-20261107
    paths:
      - 'ui/qml/AnalysisWorkspaceReview.qml'
      - 'tools/qualification/ui_review/**'
      - '.github/workflows/analysis-ux-po-screenshot-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rgsml-analysis-ux-po-screenshot-review
  cancel-in-progress: false

jobs:
  windows-qt-real-screenshots:
    name: Windows · render real QtQuick M19 M20 M21 PNGs (DEMO ONLY)
    runs-on: windows-2022
    timeout-minutes: 23
    env:
      RGSML_QT_ROOT: ${{ runner.temp }}/rgsml-uxqt/6.8.3/msvc2022_64
      RGSML_ANALYSIS_SCREENSHOT_DIR: ${{ runner.temp }}/rgsml-analysis-review
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install isolated Qt 6.8.3 MSVC for real visual review
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "aqtinstall==3.3.0" "py7zr==1.1.0" ninja
          if ($LASTEXITCODE -ne 0) { throw "ANALYSIS_UX_INSTALL_TOOLCHAIN_FAILED" }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O "$env:RUNNER_TEMP/rgsml-uxqt"
          if ($LASTEXITCODE -ne 0) { throw "ANALYSIS_UX_INSTALL_QT_FAILED" }
      - name: Compile isolated QtQuick screenshot harness
        shell: pwsh
        run: |
          cmake -S tools/qualification/ui_review -B "$env:RUNNER_TEMP/rgsml-ux-build" -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$env:RGSML_QT_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "ANALYSIS_UX_CMAKE_FAILED" }
          cmake --build "$env:RUNNER_TEMP/rgsml-ux-build" --config Release --parallel 3
          if ($LASTEXITCODE -ne 0) { throw "ANALYSIS_UX_BUILD_FAILED" }
      - name: Render three actual Qt screenshots with explicitly DEMO data
        shell: pwsh
        run: |
          $env:PATH = "$env:RGSML_QT_ROOT/bin;$env:PATH"
          & "$env:RUNNER_TEMP/rgsml-ux-build/rgsml_analysis_ux_review.exe"
          if ($LASTEXITCODE -ne 0) { throw "ANALYSIS_UX_QT_RENDER_OR_STATE_GUARD_FAILED" }
          $names = @("rgsml-analysis-m19-levels.png", "rgsml-analysis-m20-tonal-stereo.png", "rgsml-analysis-m21-metrics-delta.png")
          foreach ($name in $names) {
            $full = Join-Path $env:RGSML_ANALYSIS_SCREENSHOT_DIR $name
            if (-not (Test-Path -LiteralPath $full)) { throw "ANALYSIS_UX_MISSING_PNG_$name" }
            if ((Get-Item -LiteralPath $full).Length -lt 20000) { throw "ANALYSIS_UX_SMALL_BLANK_PNG_$name" }
          }
      - name: Upload three genuine Windows Qt visual-review PNG files
        uses: actions/upload-artifact@v4
        with:
          name: RGS-M19-M20-M21-REAL-Qt-Windows-UX-Review-DEMO
          path: ${{ runner.temp }}/rgsml-analysis-review/*.png
          if-no-files-found: error
          retention-days: 20
